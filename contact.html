<header class="impact-hero compact">
  <p class="hero-eyebrow">Contact</p>
  <h1>CONTACT</h1>
  <p class="hero-desc">For lessons, performances, or general inquiries, get in touch.</p>
</header>

<div class="wrap" style="max-width:640px;">

  <section>
    <form action="https://formspree.io/f/xlgyyjqr" method="POST">
      <input type="hidden" name="_subject" value="yasuhiro-otani.com inquiry">
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
      <div class="form-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="e.g. lesson inquiry, performance, general question">
      </div>
      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="form-submit">Send</button>
    </form>
  </section>

</div>
