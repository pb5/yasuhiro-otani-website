<body>

<div class="scanlines"></div>

<header class="impact-hero compact">
  <p class="hero-eyebrow">Contact</p>
  <h1>CONTACT</h1>
  <p class="hero-desc">レッスンのお申し込み・制作のご依頼など、お気軽にご連絡ください。</p>
</header>

<div class="wrap" style="max-width:640px;">

  <section>
    <div class="placeholder-note">
      ⚠ PLACEHOLDER — このフォームは送信先が未設定です。公開前に <code>form action</code> を Formspree 等のフォーム送信サービスの実際のエンドポイントに差し替えてください。
    </div>

    <form action="https://formspree.io/f/your-form-id" method="POST">
      <div class="form-field">
        <label for="name">お名前</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-field">
        <label for="subject">お問い合わせ種別</label>
        <input type="text" id="subject" name="subject" placeholder="例：作曲教室のお申し込み / 商業作曲のご依頼 / 音楽活動について">
      </div>
      <div class="form-field">
        <label for="message">メッセージ</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="form-submit">送信する</button>
    </form>
  </section>

</div>
