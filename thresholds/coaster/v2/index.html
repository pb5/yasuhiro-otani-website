<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Silver Relief — Eternal Coaster</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#aaa;font:12px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:14px;bottom:14px;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;transition:opacity .6s}
#ui.hid{opacity:0;pointer-events:none}
select,button{background:rgba(0,0,0,.6);color:#ccc;border:1px solid #444;font:inherit;padding:4px 10px}
#name{position:fixed;left:16px;top:14px;z-index:2;letter-spacing:.25em;color:#999;transition:opacity 1.2s;pointer-events:none}
#name b{font-weight:400;color:#ddd}
</style></head><body>
<canvas id="c"></canvas>
<div id="name"><b id="vn">—</b></div>
<div id="ui">
  <select id="sel"><option value="grav" selected>重力が変わる</option><option value="sink">ただ落ちつづける</option></select>
  <select id="q"><option value="0.5">軽い</option><option value="0.75" selected>標準</option><option value="1">最高</option></select>
  <button id="mic">マイクで</button>
  <button id="fs">全画面</button>
  <span style="color:#666">H：表示を消す</span>
</div>
<script src="../img/data.js"></script>
<script>
"use strict";
const sm=x=>x*x*(3-2*x);

/* ===== 輪のトンネル =====
   銀の輪（トーラス）を、うねる一本の道筋に沿って奥へ並べ、その中を落ちていく。
   輪は隣どうしが食い込むほど太く、交わった所が結晶のような面になる。
   （輪を並べる発想は ntsutae の #つぶやきProcessing を参照。コードは書き直し） */
const TAU=Math.PI*2;
const cv=document.getElementById('c'),gl=cv.getContext('webgl2',{antialias:false});
const sh=(k,s)=>{const x=gl.createShader(k);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x;};
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'a');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);return p;}
const PATH=`
uniform float uWob,uHelix,uPh;
vec2 path(float s){
  s+=uPh;
  return uWob*vec2(sin(s*.11)+.55*sin(s*.047+1.7)+.3*sin(s*.23+.4), cos(s*.09+.5)+.5*sin(s*.061+2.9)+.3*cos(s*.19))
        +uHelix*vec2(cos(s*.42),sin(s*.42));
}
float hs(float n){return fract(sin(n*12.9898)*43758.5453);}
float vn1(float x){float i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(hs(i),hs(i+1.),f);}
`;
const TVS=`#version 300 es
precision highp float;
layout(location=0) in vec2 a;              /* トーラスの (u,v) */
uniform mat4 uVP;uniform vec3 uSC,uEye,uFw,uRt,uUpv;uniform float uCut0,uCut1,uNt,uNC,uNN,uCamS,uFree,uFT,uPt,uS0,uSp,uTube,uJit,uGs;
${PATH}
out vec3 vN,vW,vS;out float vG,vAO;
void main(){
  float k=float(gl_InstanceID);
  float s=uS0+k*uSp;
  float idx=floor(s/uSp+.5);
  s+=(hs(idx)-.5)*uJit;                     /* ずらしが小さいと隣と重なり、面が割れる */
  vec3 c=vec3(path(s),-s);
  vec3 t=normalize(vec3(path(s+.4)-path(s-.4),-.8));
  vec3 up=abs(t.y)>.9?vec3(1,0,0):vec3(0,1,0);
  vec3 bx=normalize(cross(up,t)),by=cross(t,bx);
  float R=1.+.12*sin(idx*.37);
  vec3 lp=vec3((R+uTube*cos(a.y))*cos(a.x),(R+uTube*cos(a.y))*sin(a.x),uTube*sin(a.y));
  vec3 ln=vec3(cos(a.y)*cos(a.x),cos(a.y)*sin(a.x),sin(a.y));
  /* 無重力：輪が道筋から外れ、それぞれの軸でゆっくり転がりながら漂い出す */
  if(uFree>0.){
    vec3 ax=normalize(vec3(hs(idx+1.3)-.5,hs(idx+2.7)-.5,hs(idx+4.1)-.5));
    float ang=uFT*(.18+.6*hs(idx+5.9))*(hs(idx+8.)<.5?-1.:1.)*uFree;
    float ds=abs(s-uCamS);ang*=smoothstep(.8,5.,ds);        /* 目の前の輪は転がさず、外へよける */
    float cs=cos(ang),sn=sin(ang);
    lp=lp*cs+cross(ax,lp)*sn+ax*dot(ax,lp)*(1.-cs);
    ln=ln*cs+cross(ax,ln)*sn+ax*dot(ax,ln)*(1.-cs);
    float th=hs(idx+9.1)*6.2832;
    vec3 dr=bx*cos(th)+by*sin(th)+t*(hs(idx+6.6)-.5)*.4;      /* 軸から外へ散っていく */
    c+=dr*uFT*(.15+.45*hs(idx+7.7))*uFree;
    lp.xy*=1.+1.4*uFree*(1.-smoothstep(0.,4.,ds))*min(1.,uFT);
  }
  vec3 w=c+bx*lp.x+by*lp.y+t*lp.z;
  vN=bx*ln.x+by*ln.y+t*ln.z;vW=w;vS=vec3(0.);vAO=1.;
  vG=.5+.5*sin(vn1(idx*.23+uGs)*25.13);          /* 輪ごとの白〜黒 */
  if(uNt>.5){
    /* 無重力：ntsutae の輪の配置（480本を一枚の面に、ノイズの角度で放射状に重ねる）。陰影なしの平らな灰 */
    float i=480.*(1.-k/uNN);
    float d=vn1(i-uNC)*6.2832*2.;
    float sc=6./623.;
    vec3 P0=uSC;
    vec3 tl=vec3((120.+10.*cos(a.y))*cos(a.x),(120.+10.*cos(a.y))*sin(a.x),10.*sin(a.y))*sc;
    w=P0+uRt*(cos(d)*i*sc+tl.x)+uUpv*(sin(d)*i*sc+tl.y)-uFw*tl.z;
    {
      /* 中心の球：内側の輪は、平面ではなく球の殻に並ぶ。入ると輪の檻に囲まれる */
      float e2=acos(clamp(1.-2.*vn1(i*1.37+uNC*.21+9.),-1.,1.));
      vec3 dir=normalize(uRt*cos(d)*sin(e2)+uUpv*sin(d)*sin(e2)+uFw*cos(e2));
      vec3 ux=normalize(cross(abs(dir.y)>.9?vec3(1,0,0):vec3(0,1,0),dir)),uy=cross(dir,ux);
      float rr=.92+.08*hs(i+3.1);
      float rs=.16+.2*hs(i+5.3);
      vec3 tl2=vec3((rs+.025*cos(a.y))*cos(a.x),(rs+.025*cos(a.y))*sin(a.x),.025*sin(a.y));
      w=P0+dir*rr*1.3+ux*tl2.x+uy*tl2.y+dir*tl2.z;
      vN=ux*ln.x+uy*ln.y+dir*ln.z;vS=dir;vAO=smoothstep(.9,1.,rr);
    }
    vW=w;
    vG=.5+.5*sin(d);
  }
  gl_Position=uVP*vec4(w,1.);
  if(uNt<.5&&s>uCut0&&s<uCut1)gl_Position=vec4(2.,2.,2.,1.);   /* 球のまわりは竪穴が途切れ、何もない空間になる */
  gl_PointSize=uPt;
}`;
const TFS=`#version 300 es
precision highp float;
uniform vec3 uCam,uLd,uSCf;uniform float uFog,uLampA,uMode,uNtF;
in vec3 vN,vW,vS;in float vG,vAO;out vec4 o;
void main(){
  vec3 N=normalize(vN),V=normalize(uCam-vW);
  vec3 L=normalize(V+vec3(cos(uLampA),sin(uLampA),0.)*.6);   /* 一灯：自分のすぐ脇から */
  float dif=max(dot(N,L),0.);
  float sp=pow(max(dot(reflect(-L,N),V),0.),48.);
  float alb=mix(.0,1.,pow(vG,1.3));
  float dist=length(uCam-vW);
  float c=(alb*pow(dif,1.2)*1.5+sp*1.3*(.3+.7*vG))*exp(-dist*uFog)*smoothstep(.25,1.6,dist);   /* 目の前のものは黒い影になる */
  if(uNtF>.5){
    /* 球：一灯の陰影。球の裏側・殻の奥・縁は黒に沈む */
    vec3 L2=normalize(uLd);
    float d2=max(dot(N,L2),0.);
    float term=smoothstep(-.15,.75,dot(vS,L2));                 /* 球としての明暗の境 */
    float rim=smoothstep(.0,.45,dot(vS,V));                      /* 縁は暗く */
    float inside=1.-smoothstep(1.,1.4,length(uCam-uSCf));
    if(inside>0.){                                                /* 球の中：自分の脇の一灯だけが輪を照らす */
      vec3 Li=normalize(V+cross(V,vec3(0,1,0))*.35+vec3(0,.3,0));
      L2=mix(L2,Li,inside);d2=max(dot(N,L2),0.);
      term=mix(term,1.,inside);rim=mix(rim,1.,inside);
    }
    float s2=pow(max(dot(reflect(-L2,N),V),0.),60.);
    float alb=mix(.12,1.,vG);
    c=(alb*pow(d2,1.3)*.95+s2*.8*term)*term*mix(.25,1.,vAO)*mix(.35,1.,rim)*exp(-dist*.025);
  }
  float nv=abs(dot(N,V));
  if(uMode>.5&&uMode<1.5) c=smoothstep(.3,.0,nv)*2.2*exp(-dist*uFog*.4);          /* 輪郭だけ */
  else if(uMode>1.5&&uMode<2.5) c=pow(1.-nv,4.)*.07*exp(-dist*uFog*.5);            /* 透ける（X線） */
  else if(uMode>2.5) c=(.35+.65*vG)*exp(-dist*uFog*.5);                             /* 粒 */
  o=vec4(c,c,c,1.);
}`;
const QVS=`#version 300 es
layout(location=0) in vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const TRAIL=`#version 300 es
precision highp float;uniform sampler2D S,P;uniform vec2 r;uniform float uTr,uZb,uRot;out vec4 o;
void main(){vec2 u=gl_FragCoord.xy/r,c=u-.5;float cs=cos(uRot),sn=sin(uRot);c=mat2(cs,-sn,sn,cs)*c;
  vec3 s=texture(S,u).rgb,p=texture(P,.5+c*(1.-uZb)).rgb;
  o=vec4(min(s,mix(vec3(1.),p,uTr)),1.);}`;              /* 黒が尾を引く */
const SHOW=`#version 300 es
precision highp float;uniform sampler2D A,M;uniform vec2 r;uniform float uT,uGam,uVig,uGrain,uFlash,uMemA,uMemAsp,uMemRot,uMemTh,uSpd;uniform vec3 uMemR;out vec4 o;
float hash(vec2 p){p=fract(p*vec2(443.897,441.423));p+=dot(p,p.yx+19.19);return fract((p.x+p.y)*p.x);}
void main(){vec2 u=gl_FragCoord.xy/r;float c=texture(A,u).r;
  c=pow(max(c,0.),uGam);
  vec2 q=(gl_FragCoord.xy-.5*r)/r.y;c*=smoothstep(uVig,uVig*.25,length(q));
  if(uMemA>0.){
    /* 瞬間記憶：コラージュが一瞬だけ差しこまれる */
    /* 意識が飛ぶ一瞬：コラージュの断片が、落下の勢いで中心へ引き伸ばされ、光と闇だけになる */
    vec2 p=(u-.5)*vec2(r.x/r.y,1.);
    float cs=cos(uMemRot),sn=sin(uMemRot);p=mat2(cs,-sn,sn,cs)*p;
    float acc=0.;
    for(int k=0;k<14;k++){
      float f=1.-float(k)/14.*(.15+.6*uSpd);               /* 中心へ向かう流れ（速いほど長い） */
      vec2 iu=uMemR.xy+p*f*vec2(1./uMemAsp,1.)*uMemR.z;
      acc+=(iu.x<0.||iu.x>1.||iu.y<0.||iu.y>1.)?0.:texture(M,iu).r;
    }
    acc/=14.;
    float m=smoothstep(uMemTh-.04,uMemTh+.04,acc);         /* ほぼ二値：光か闇か */
    m*=smoothstep(uVig*1.05,uVig*.3,length(q));             /* 狭まった視野の内側にだけ見える */
    c=mix(c,m*1.15,uMemA);
  }
  c+=uFlash;c+=(hash(gl_FragCoord.xy+fract(uT*7.)*91.)-.5)*uGrain;
  o=vec4(vec3(max(c,0.))*vec3(.95,.97,1.),1.);}`;
const pT=prog(TVS,TFS),pTr=prog(QVS,TRAIL),pS=prog(QVS,SHOW);
const uni=(p,ns)=>{const o={};for(const n of ns)o[n]=gl.getUniformLocation(p,n);return o;};
const UT=uni(pT,['uSCf','uSC','uCut0','uCut1','uLd','uNtF','uEye','uFw','uRt','uUpv','uNt','uNC','uNN','uCamS','uFree','uFT','uPt','uMode','uPh','uGs','uVP','uS0','uSp','uTube','uJit','uWob','uHelix','uCam','uFog','uLampA']);
const UR=uni(pTr,['S','P','r','uTr','uZb','uRot']);
const US=uni(pS,['uMemRot','uMemTh','uSpd','M','uMemA','uMemAsp','uMemR','A','r','uT','uGam','uVig','uGrain','uFlash']);

/* トーラスの網 */
const NU=96,NV=18,uv=[],ix=[];
for(let i=0;i<=NU;i++)for(let j=0;j<=NV;j++)uv.push(i/NU*TAU,j/NV*TAU);
for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){const a=i*(NV+1)+j,b=a+NV+1;ix.push(a,b,a+1,b,b+1,a+1);}
const vaoT=gl.createVertexArray();gl.bindVertexArray(vaoT);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(uv),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(ix),gl.STATIC_DRAW);
const NIDX=ix.length;
const vaoQ=gl.createVertexArray();gl.bindVertexArray(vaoQ);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.bindVertexArray(null);

/* 画を描く先（深さ付き）と、尾のための2枚 */
let fb=null;
function mkT(w,h,depth){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  for(const[k,v]of[[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  if(depth){const rb=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,rb);gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,w,h);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,rb);}
  return{t,f};}
function ensureFB(w,h){if(fb&&fb.w===w&&fb.h===h)return;fb={w,h,s:mkT(w,h,true),a:[mkT(w,h),mkT(w,h)],i:0};}

/* コラージュ（記憶） */
const ASPI=[0.71216,0.86762,0.74902,0.75977],MT=[];
(window.IMGDATA||[]).forEach((src,i)=>{const t=gl.createTexture();MT[i]=null;const im=new Image();
  im.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);MT[i]=t;};
  im.src=src;});
/* 行列 */
const norm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l);};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function persp(fy,as,n,f){const t=1/Math.tan(fy/2);return[t/as,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0];}
function mul(a,b){const o=new Array(16).fill(0);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];return o;}
function view(eye,fw,up){const z=norm(fw.map(x=>-x)),x=norm(cross(up,z)),y=cross(z,x);
  return[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1];}
const rotAx=(v,ax,a)=>{const c=Math.cos(a),s=Math.sin(a),d=dot(ax,v),cr=cross(ax,v);return v.map((x,i)=>x*c+cr[i]*s+ax[i]*d*(1-c));};
let WOB=1.4,HEL=0,PH=0;
const path=s=>(s+=PH,[WOB*(Math.sin(s*.11)+.55*Math.sin(s*.047+1.7)+.3*Math.sin(s*.23+.4))+HEL*Math.cos(s*.42),
               WOB*(Math.cos(s*.09+.5)+.5*Math.sin(s*.061+2.9)+.3*Math.cos(s*.19))+HEL*Math.sin(s*.42)]);

/* 音（任意） */
let an=null,buf=null,lvl=0,lvlSlow=0,kick=0;
document.getElementById('mic').onclick=async()=>{
  try{const ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    an=ac.createAnalyser();an.fftSize=2048;buf=new Float32Array(an.fftSize);ac.createMediaStreamSource(st).connect(an);
    document.getElementById('mic').textContent='マイク：入';}catch(e){document.getElementById('mic').textContent='マイク不可';}};
document.getElementById('fs').onclick=()=>{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d);};
let ui=true;addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H'){ui=!ui;document.getElementById('ui').classList.toggle('hid',!ui);document.getElementById('name').style.opacity=ui?1:0;}});

/* 状態：重力で落ちる。重力そのものがゆっくり変わりつづける */
let anc=null,NC=0,burnCool=25,gdose=0,loc=0,wake=0,burn=0,pmode=0,camS=0,T=0,Tm=0,last=0,shown='',prRoll=0,vel=1.2,g=1,hang=0,hangLen=0,nextHang=9,floatP=0,floatR=0,fpv=0,frv=0,roll=0;
const MD={gam:2,vig:1.2,grain:.015,flash:0};
let rs=31;const rnd=()=>{rs=(rs*16807)%2147483647;return rs/2147483647;};
const n1=x=>{const i=Math.floor(x),f=x-i,h=k=>{const v=Math.sin(k*127.1+rs0)*43758.5453;return v-Math.floor(v);};const u=f*f*(3-2*f);return h(i)*(1-u)+h(i+1)*u;};
const rs0=12.3;
/* 世界：宙吊りの瞬間に、フェードなしで丸ごと入れ替わる */
const WD={ph:0,wob:1.4,sp:.38,tube:.21,jit:.19,gs:0,lamp:0,fog:.045,hel:0};
function switchWorld(){
  const k=rnd();
  WD.ph=rnd()*400;WD.gs=rnd()*50;WD.lamp=rnd()*TAU;
  if(k<.3){WD.wob=1.4;WD.sp=.38;WD.tube=.21;WD.jit=.19;WD.hel=0;WD.fog=.045;}          /* 銀の竪穴 */
  else if(k<.5){WD.wob=.5;WD.sp=.1;WD.tube=.33;WD.jit=.012;WD.hel=0;WD.fog=.06;}      /* 輪が重なり、面が割れる */
  else if(k<.68){WD.wob=.8;WD.sp=.6;WD.tube=.09;WD.jit=.3;WD.hel=1.3;WD.fog=.035;}    /* 細い輪の螺旋 */
  else if(k<.84){WD.wob=2.6;WD.sp=.3;WD.tube=.26;WD.jit=.15;WD.hel=0;WD.fog=.08;}     /* 大きくうねる、近い闇 */
  else{WD.wob=1;WD.sp=.85;WD.tube=.4;WD.jit=.4;WD.hel=.4;WD.fog=.03;}                 /* まばらな太い輪 */
  roll=rnd()*TAU;floatP=(rnd()-.5)*.5;floatR=0;fpv=(rnd()-.5)*.25;frv=(rnd()-.5)*.6;
}
const SPEED=4.2;
/* 落ちた先に球がある。球に着くと無重力で浮き、上から眺め、やがて球の中へ落ちこむ。球の中で次の竪穴に変わり、また次の球へ */
let memRot=0,memTh=.5,warpT=30,wT=0,warped=false,inT=0,inLen=0,exitFw=null,exitT=9,memT=5,memOn=0,memI=0,memR=[.5,.5,1],memLeft=0,memGap=0,post=false,phase='fall',sS=1e9,sphOn=false,sphT=14,phT=0,phLen=0,orbE=null;
function frame(ms){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(ms-last)/1000||0);last=ms;T+=dt;Tm+=dt;
  if(an){an.getFloatTimeDomainData(buf);let s=0;for(const x of buf)s+=x*x;const l=Math.max(0,Math.min(1,(20*Math.log10(Math.sqrt(s/buf.length)+1e-9)+60)/50));
    if(l>lvlSlow+.18)kick=1;lvl+=(l-lvl)*.3;lvlSlow+=(l-lvlSlow)*.02;}
  kick*=Math.exp(-dt*2.5);
  const mode=document.getElementById('sel').value;

  let gt;
  if(mode==='sink')gt=.5;
  else{
    const a=n1(T*.06),b=n1(T*.23+7),c=n1(T*.011+3);
    gt=.12*Math.exp(3.6*Math.pow(a,1.4))+1.5*Math.pow(b,4)+kick*4+lvl*2;
    burn-=dt;burnCool-=dt;if(phase==='fall'&&burn<=0&&burnCool<=0&&rnd()<dt/20){burn=2.5+rnd()*3;burnCool=60+rnd()*40;}
    if(burn>0)gt+=9*Math.sin(Math.min(1,burn/1.2)*Math.PI/2);
    if(c<.18)gt=-.6*(1-c/.18);
  }
  /* 段階 */
  if(mode!=='sink'){
    if(phase==='fall'){warpT-=dt;if(warpT<=0&&!sphOn){phase='warp';wT=0;warped=false;}}
    if(false){sphT-=dt;if(sphT<=0){phase='approach';sS=camS+Math.max(40,vel*SPEED*4);sphOn=true;post=false;}}
    if(sphOn&&phase==='fall'&&camS>sS+14)sphOn=false;
  }
  const floating=phase==='float'||phase==='inside';
  if(floating||phase==='enter')gt=phase==='enter'?.8:0;
  if(phase==='warp'){wT+=dt;gt=0;}
  g+=(gt-g)*Math.min(1,dt*(floating?30:1.2));
  vel+=(g-.025*vel*Math.abs(vel))*dt;
  if(phase==='approach'){
    const dd=sS-camS;
    vel=Math.max(Math.min(vel,Math.sqrt(2*5*Math.max(dd,0))/SPEED),Math.min(.35,dd*.2));   /* 球の手前でほどけ、そのまま中へ漂い入る */
    if(dd<.04){camS=sS;phase='inside';inT=0;inLen=8+rnd()*4;vel=0;}
  }
  if(floating||phase==='enter')vel=0;
  if(phase==='warp'){const x=wT/1.8;vel=3+70*Math.sin(Math.min(1,x)*Math.PI)**2;
    if(!warped&&x>.55){warped=true;switchWorld();}
    if(x>=1){phase='fall';vel=3.2;warpT=40+rnd()*45;}}
  const v=vel;
  camS+=v*SPEED*dt;
  roll+=dt*(.05*Math.sin(T*.13))*Math.min(1,Math.abs(v));

  WOB=WD.wob;HEL=WD.hel;PH=WD.ph;
  const sp=WD.sp,tube=WD.tube,jit=WD.jit;
  const spd=Math.min(1,Math.abs(v)/14),warpK=phase==='warp'?Math.sin(Math.min(1,wT/1.8)*Math.PI):0;
  const G=Math.max(0,g),gl_=Math.min(1,Math.max(0,(G-2.5)/7));
  const calm=floating||phase==='enter';
  const tg={gam:calm?1.25:1.35+.9*spd,vig:calm?1.6:Math.max(.2,1.5-1.3*gl_-.9*warpK),grain:.01+.05*spd,flash:0};
  for(const k in MD){const a=k==='flash'?1:Math.min(1,dt*1.5);MD[k]+=(tg[k]-MD[k])*a;}
  const name=mode==='sink'?'ただ落ちつづける':(phase==='warp'?'ワープ':phase==='inside'?'球の中 — 無重力':floating?'球':phase==='enter'?'球の中へ':phase==='approach'?'球へ  '+g.toFixed(1)+' G':(g<0?'重力が反転しかける':g.toFixed(1)+' G'+(burn>0?'  限界':'')));
  if(name!==shown){shown=name;document.getElementById('vn').textContent=name;}

  const p0=path(camS),p1=path(camS+2.5);
  const eye=[p0[0],p0[1],-camS];
  let fw=norm([p1[0]-p0[0],p1[1]-p0[1],-2.5]),up=[Math.sin(roll),Math.cos(roll),0];
  const rightAx=norm(cross(fw,up));
  const shk=calm?0:.002+.012*gl_*gl_+.004*spd;
  fw=rotAx(fw,rightAx,shk*(Math.sin(T*71)+Math.sin(T*53.7)));
  fw=rotAx(fw,up,shk*(Math.sin(T*67.3)+Math.sin(T*41.1)));
  const pc=path(sS),C=[pc[0],pc[1],-sS];                    /* 球の中心：竪穴の道筋の上 */
  const q=+document.getElementById('q').value,dpr=Math.min(2,devicePixelRatio||1);
  const W=Math.max(2,innerWidth*dpr*q|0),H=Math.max(2,innerHeight*dpr*q|0);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  ensureFB(W,H);
  const fovy=.9+.9*1.6*Math.pow(spd,1.3)+.5*warpK;
  let eyeV=eye,fwV=fw,upV=up;
  if(!anc){const r0=norm(cross(fw,up));anc={eye:eye.slice(),fw:fw.slice(),rt:r0,up:cross(r0,fw)};}
  if(phase==='inside'){
    /* 球の中：無重力。輪の檻の真ん中で、向きだけがゆっくりほどける */
    inT+=dt;eyeV=C;
    fwV=rotAx(rotAx(anc.fw,anc.up,inT*.21+.5*Math.sin(inT*.13)),anc.rt,.35*Math.sin(inT*.17));upV=rotAx(anc.up,fwV,inT*.09);
    if(inT>inLen){switchWorld();camS=sS;vel=.15;phase='fall';sphT=24+rnd()*20;post=true;exitFw=fwV.slice();exitT=0;}
  }else if(phase==='float'||phase==='enter'){
    phT+=dt;
    /* 俯瞰：何もない空間に浮かぶ球を、少し離れた上から見下ろす。視点はゆっくり巡る */
    const ob=rotAx(anc.fw,anc.up,.4*Math.sin(Math.min(phT,phLen)*.22)),ob2=rotAx(ob,anc.rt,.28*Math.sin(Math.min(phT,phLen)*.15));
    orbE=C.map((x,i)=>x-ob2[i]*4.6);
    eyeV=orbE;fwV=ob2;upV=rotAx(anc.up,fwV,Math.min(phT,phLen)*.1);
    if(phase==='float'&&phT>phLen){phase='enter';phT=phLen;}
    if(phase==='enter'){
      const e=Math.min(1,(phT-phLen)/2.4),m=e*e*e;            /* 球へ落ちこむ：じわりと、そして一気に */
      eyeV=orbE.map((x,i)=>x+(C[i]-x)*m);
      if(e>=1){phase='inside';inT=0;inLen=7+rnd()*3;}
    }
  }else if(phase==='fall'||phase==='approach'||phase==='warp'){const r0=norm(cross(fw,up));anc={eye:eye.slice(),fw:fw.slice(),rt:r0,up:cross(r0,fw)};}
  if(phase==='fall'&&exitFw&&exitT<2){exitT+=dt;const m=sm(Math.min(1,exitT/2));fwV=norm(exitFw.map((x,i)=>x*(1-m)+fwV[i]*m));if(exitT>=2)exitFw=null;}
  const VP=mul(persp(Math.max(.5,Math.min(2.4,fovy)),W/H,.02,200),view(eyeV,fwV,upV));

  gl.bindFramebuffer(gl.FRAMEBUFFER,fb.s.f);gl.viewport(0,0,W,H);
  gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
  gl.useProgram(pT);gl.bindVertexArray(vaoT);
  const N=Math.round(110/sp);
  gl.uniformMatrix4fv(UT.uVP,false,VP);
  gl.uniform1f(UT.uS0,Math.floor(camS/sp)*sp-2*sp);gl.uniform1f(UT.uSp,sp);gl.uniform1f(UT.uTube,tube);gl.uniform1f(UT.uJit,jit);
  gl.uniform1f(UT.uWob,WOB);gl.uniform1f(UT.uPh,PH);gl.uniform1f(UT.uGs,WD.gs);gl.uniform1f(UT.uHelix,HEL);gl.uniform3f(UT.uCam,...eyeV);
  gl.uniform1f(UT.uFog,WD.fog*(1+.25*spd));gl.uniform1f(UT.uLampA,WD.lamp+Tm*.3);
  gl.uniform1f(UT.uMode,0);gl.uniform1f(UT.uCamS,camS);gl.uniform1f(UT.uFree,0);gl.uniform1f(UT.uFT,0);gl.uniform1f(UT.uPt,1);
  gl.uniform1f(UT.uCut0,sphOn?sS-8.:1e9);gl.uniform1f(UT.uCut1,sphOn?(post?sS+2.6:1e9):1e9);
  gl.uniform3f(UT.uRt,...anc.rt);gl.uniform3f(UT.uUpv,...anc.up);gl.uniform3f(UT.uFw,...anc.fw);gl.uniform3f(UT.uEye,...anc.eye);gl.uniform3f(UT.uSC,...C);gl.uniform3f(UT.uSCf,...C);
  gl.uniform3f(UT.uLd,...anc.up.map((x,i)=>x*.55-anc.rt[i]*.55-anc.fw[i]*.6));
  /* 竪穴 */
  gl.uniform1f(UT.uNt,0);gl.uniform1f(UT.uNtF,0);gl.uniform1f(UT.uNN,N);
  gl.drawElementsInstanced(gl.TRIANGLES,NIDX,gl.UNSIGNED_SHORT,0,N);
  /* 球 */
  if(sphOn){NC+=(calm?60:20)*dt;gl.uniform1f(UT.uNt,1);gl.uniform1f(UT.uNtF,1);gl.uniform1f(UT.uNC,NC);gl.uniform1f(UT.uNN,480);
    gl.drawElementsInstanced(gl.TRIANGLES,NIDX,gl.UNSIGNED_SHORT,0,480);}
  gl.disable(gl.DEPTH_TEST);gl.bindVertexArray(vaoQ);

  const A=fb.a[fb.i],B=fb.a[1-fb.i];
  gl.useProgram(pTr);gl.bindFramebuffer(gl.FRAMEBUFFER,A.f);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,fb.s.t);gl.uniform1i(UR.S,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,B.t);gl.uniform1i(UR.P,1);
  gl.uniform2f(UR.r,W,H);gl.uniform1f(UR.uTr,calm?0:Math.min(.985,.05+.95*spd+.3*warpK));gl.uniform1f(UR.uZb,(.003+.09*spd*spd+.06*warpK)*Math.sign(v||1));
  gl.uniform1f(UR.uRot,0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  gl.useProgram(pS);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,A.t);gl.uniform1i(US.A,0);
  gl.uniform2f(US.r,W,H);gl.uniform1f(US.uT,Tm);gl.uniform1f(US.uGam,calm?1:MD.gam*.85);gl.uniform1f(US.uVig,MD.vig);
  gl.uniform1f(US.uGrain,MD.grain);gl.uniform1f(US.uFlash,MD.flash);
  /* 瞬間記憶：強いGや加速の極みで、意識が飛びかける一瞬にだけ見える。1〜3コマ */
  let ma=0;
  const press=Math.max(gl_,warpK);
  if(mode!=='sink'&&MT.some(Boolean)&&press>.25){
    memT-=dt*press*3;
    if(memT<=0&&memLeft<=0){memLeft=1+Math.floor(rnd()*4);memGap=0;memT=1.5+rnd()*3;}
  }
  if(memLeft>0){
    if(memOn>0){memOn-=dt;ma=1;if(memOn<=0){memLeft--;memGap=.05+rnd()*.35;}}
    else{memGap-=dt;if(memGap<=0){memOn=.017+rnd()*.035;do{memI=Math.floor(rnd()*4);}while(!MT[memI]);
      const z=.1+rnd()*.35;memR=[z/2+rnd()*(1-z),z/2+rnd()*(1-z),z];memRot=rnd()*TAU;memTh=.35+rnd()*.35;ma=1;}}
  }
  gl.uniform1f(US.uMemRot,memRot);gl.uniform1f(US.uMemTh,memTh);gl.uniform1f(US.uSpd,Math.max(spd,warpK));
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,MT[memI]||null);gl.uniform1i(US.M,1);
  gl.uniform1f(US.uMemA,ma);gl.uniform1f(US.uMemAsp,ASPI[memI]);gl.uniform3f(US.uMemR,...memR);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  fb.i=1-fb.i;
}
requestAnimationFrame(frame);
</script></body></html>
