button.on{border-color:#aaa;color:#fff}
.hid{opacity:0;pointer-events:none}

    {const ls=camS+1.6+.4*Math.sin(Tm*.3),pl=path(ls),rl=radAt(ls)*get('radK')*.62;gl.uniform3f(UT.uLp,pl[0]+rl*Math.cos(Tm*.2),pl[1]+rl*Math.sin(Tm*.2),-ls);}

    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  }

    $('hs').textContent=`${(1000/ftAvg).toFixed(0)} fps・解像度 ${(qMax*scale*100).toFixed(0)}%`+(an?`・音 ${lvl.toFixed(2)}`:'');
