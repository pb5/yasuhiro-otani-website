<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thresholds of Presence — silver (study)</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px/1.4 Georgia,serif;color:#999}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
#ui{position:fixed;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;transition:opacity .4s}
#ui.hidden{opacity:0;pointer-events:none}
button,label.b{background:#111;color:#bbb;border:1px solid #333;border-radius:4px;padding:5px 9px;font:inherit;cursor:pointer}
button.on{border-color:#aaa;color:#fff}
#fl{position:fixed;left:50%;top:14px;transform:translateX(-50%);opacity:0;transition:opacity .5s}
#tg{position:fixed;right:10px;top:10px}
</style></head><body>
<canvas id="c"></canvas>
<div id="fl"></div>
<button id="tg">≡</button>
<div id="ui">
  <label class="b">画像を選ぶ<input id="file" type="file" accept="image/*" hidden></label>
  <button id="cam">カメラ</button>
  <button id="mic">Mic</button><button id="sim">擬似音</button>
  <span>黒の深さ</span><input id="deep" type="range" min="70" max="100" value="96">
  <span>粒</span><input id="gs" type="range" min="6" max="40" value="14">
  <button id="clear">白紙に戻す</button>
</div>
<script>
/* Silver.
   Not lines, not a filter: the picture is developed. The picture only exposes; the silver decides.
   Every grain either develops or it does not — there is no grey inside a grain. Grey is only how many grains are there.
   Where dark meets light the developer runs out on one side and is fresh on the other (the edge effect),
   so every boundary is sharpened by the chemistry, not by a filter. The latent image is never finished:
   it keeps being exposed while the room plays, and slowly forgets while it is silent. */
const c = document.getElementById("c"), gl = c.getContext("webgl", { antialias: false, alpha: false });
const hf = gl.getExtension("OES_texture_half_float"); gl.getExtension("OES_texture_half_float_linear"); gl.getExtension("EXT_color_buffer_half_float");
const FT = hf ? hf.HALF_FLOAT_OES : gl.UNSIGNED_BYTE;
const QV = `attribute vec2 p; varying vec2 uv; void main(){ uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
const COMMON = `precision highp float; varying vec2 uv;
float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }`;
/* exposure: how much light the paper receives here. shadows of the subject receive the most, as in a print */
const EXP = COMMON + `uniform sampler2D uSrc, uPrev; uniform vec2 uSrcPx; uniform float uRate, uForget, uFlip;
  float L(vec2 q){ q.x = uFlip > .5 ? 1. - q.x : q.x; vec3 c = texture2D(uSrc, vec2(q.x, 1. - q.y)).rgb; return dot(c, vec3(.3, .59, .11)); }
  void main(){
    float l = L(uv), m = 0.;
    for (int i = 0; i < 12; i++) { float a = float(i) * .5236; m += L(uv + vec2(cos(a), sin(a)) * uSrcPx * 14.); }
    m /= 12.;
    float e = 1. - l;                                  // the dark of the subject is what exposes the paper
    float edge = (m - l) * 2.2;                         // adjacency: beside light the dark goes darker, beside dark the light stays clean
    e = clamp(e + edge, 0., 1.);
    e = pow(e, 1.6);
    float prev = texture2D(uPrev, uv).r;
    gl_FragColor = vec4(prev * uForget + e * uRate, 0., 0., 1.);
  }`;
/* development and print */
const DEV = COMMON + `uniform sampler2D uLat; uniform vec2 uRes; uniform float uDeep, uGs, uT;
  /* one population of grains: irregular clumps around jittered points. returns the threshold of the grain this pixel belongs to, or -1 */
  float grain(vec2 px, float size, float seed){
    vec2 g = px / size, i = floor(g), f = fract(g); float best = 9., thr = -1.;
    for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
      vec2 o = vec2(x, y), id = i + o;
      vec2 pt = o + vec2(h(id + seed), h(id + seed + 7.1));
      vec2 d = f - pt;
      float r = .38 + .32 * h(id + seed + 3.3);                          // grains differ in size
      float rag = .08 * sin(atan(d.y, d.x) * (3. + floor(h(id + seed + 5.5) * 4.)) + h(id) * 6.);   // and are not round
      float dd = length(d) - r - rag;
      if (dd < best) { best = dd; thr = h(id + seed + 11.7); }
    }
    return best < 0. ? thr : -1.;
  }
  void main(){
    vec2 px = uv * uRes;
    float lat = texture2D(uLat, uv).r;
    float D = 0.;
    /* three populations: fast large clumps, middle, slow fine grains. each develops only past its own threshold */
    float t1 = grain(px, uGs * 1.9, 1.), t2 = grain(px, uGs, 21.), t3 = grain(px, uGs * .55, 41.);
    if (t1 >= 0. && lat > .35 + t1 * 1.4) D = max(D, 1.);
    if (t2 >= 0. && lat > .8 + t2 * 2.2) D = max(D, .92);
    if (t3 >= 0. && lat > 1.6 + t3 * 2.6) D = max(D, .85);
    float fog = smoothstep(2.2, 4.5, lat) * .55;                     // where the exposure is heaviest the gaps between grains close too
    D = max(D, fog);
    D *= uDeep;
    vec3 paper = vec3(.80, .795, .78);
    vec3 col = paper * (1. - D);
    /* silver: the densest clumps are not dead black, they are metal. a cold glint on a few of them */
    float glint = step(.965, h(floor(px / 1.3) + floor(uT * 2.))) * step(.95, D) * .09;
    col += vec3(.85, .88, .92) * glint;
    col += (h(px + 13.) - .5) / 255.;
    gl_FragColor = vec4(col, 1.);
  }`;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; }
function prog(f) { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, QV)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, f)); gl.linkProgram(p); return p; }
const pE = prog(EXP), pD = prog(DEV);
const qb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
function quad(p) { gl.useProgram(p); const l = gl.getAttribLocation(p, "p"); gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }
function tex(w, h, type) { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, type, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v); return t; }
const srcT = tex(2, 2, gl.UNSIGNED_BYTE);
let lat = [], lp = 0, W = 0, H = 0, srcW = 2, srcH = 2, srcEl = null, flip = 0;
function fit(iw, ih) {
  const k = Math.min(innerWidth / iw, innerHeight / ih), d = Math.min(2, devicePixelRatio || 1);
  W = Math.round(iw * k * d); H = Math.round(ih * k * d); c.width = W; c.height = H; c.style.width = W / d + "px"; c.style.height = H / d + "px";
  for (const l of lat) { gl.deleteTexture(l.t); gl.deleteFramebuffer(l.f); }
  lat = [0, 1].map(() => { const t = tex(W, H, FT), f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); return { t, f }; });
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
function setSrc(el, iw, ih) { srcEl = el; srcW = iw; srcH = ih; fit(iw, ih); upload(); }
function upload() { if (!srcEl) return; gl.bindTexture(gl.TEXTURE_2D, srcT); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcEl); }

/* the room */
const snd = { an: null, buf: null, floor: -70, lv: 0, sim: false, cal: 0, calv: [], sn: 0 };
async function mic() { try { const st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  const a = new (window.AudioContext || window.webkitAudioContext)(); snd.an = a.createAnalyser(); snd.an.fftSize = 2048; snd.buf = new Float32Array(2048);
  a.createMediaStreamSource(st).connect(snd.an); snd.cal = 2.5; snd.calv = []; flash("listening to the quiet…"); document.getElementById("mic").classList.add("on"); }
  catch (e) { flash("no microphone here — 擬似音"); } }
function sndStep(dt) {
  if (snd.an) { snd.an.getFloatTimeDomainData(snd.buf); let q = 0; for (const v of snd.buf) q += v * v; const db = 20 * Math.log10(Math.sqrt(q / snd.buf.length) + 1e-9);
    if (snd.cal > 0) { snd.calv.push(db); snd.cal -= dt; if (snd.cal <= 0) { const s = snd.calv.sort((a, b) => a - b); snd.floor = Math.max(-90, s[Math.floor(s.length * .6)]); } return; }
    const v = Math.max(0, Math.min(1, (db - snd.floor - 8) / 24)); snd.lv += (v - snd.lv) * (v > snd.lv ? .3 : .06); }
  else if (snd.sim) { snd.sn += (Math.random() - .5) * dt * 1.4; snd.sn *= .996; snd.lv += (Math.max(0, Math.min(1, .4 + snd.sn)) - snd.lv) * .1; }
}
let DEEP = .96, GS = 1.4, T = 0, last = performance.now(), video = null;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt; sndStep(dt);
  if (lat.length) {
    if (video && video.readyState >= 2) upload();
    const live = snd.an || snd.sim, lv = live ? snd.lv : .45;
    /* exposure while the room plays; in silence the latent image slowly forgets */
    const rate = dt * (.04 + 1.1 * lv), forget = Math.pow(.5, dt / (2.5 + 10 * lv));
    const a = lat[lp], b = lat[1 - lp];
    gl.bindFramebuffer(gl.FRAMEBUFFER, b.f); gl.viewport(0, 0, W, H); gl.useProgram(pE);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, srcT); gl.uniform1i(gl.getUniformLocation(pE, "uSrc"), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, a.t); gl.uniform1i(gl.getUniformLocation(pE, "uPrev"), 1);
    gl.uniform2f(gl.getUniformLocation(pE, "uSrcPx"), 1 / srcW, 1 / srcH); gl.uniform1f(gl.getUniformLocation(pE, "uRate"), rate * 2.2);
    gl.uniform1f(gl.getUniformLocation(pE, "uForget"), forget); gl.uniform1f(gl.getUniformLocation(pE, "uFlip"), flip);
    quad(pE); lp = 1 - lp;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(pD);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, b.t); gl.uniform1i(gl.getUniformLocation(pD, "uLat"), 0);
    gl.uniform2f(gl.getUniformLocation(pD, "uRes"), W, H); gl.uniform1f(gl.getUniformLocation(pD, "uDeep"), DEEP);
    gl.uniform1f(gl.getUniformLocation(pD, "uGs"), GS * Math.max(1, W / 1600)); gl.uniform1f(gl.getUniformLocation(pD, "uT"), T);
    quad(pD);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function flash(t) { const f = document.getElementById("fl"); f.textContent = t; f.style.opacity = 1; clearTimeout(flash.t); flash.t = setTimeout(() => f.style.opacity = 0, 2000); }
function stopCam() { if (video) { video.srcObject.getTracks().forEach(t => t.stop()); video = null; document.getElementById("cam").classList.remove("on"); } }
document.getElementById("file").onchange = e => { const f = e.target.files[0]; if (!f) return; const im = new Image();
  im.onload = () => { stopCam(); flip = 0; setSrc(im, im.width, im.height); }; im.src = URL.createObjectURL(f); };
document.getElementById("cam").onclick = async () => { if (video) { stopCam(); return; }
  try { const st = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } }); video = document.createElement("video"); video.srcObject = st; video.muted = true; video.playsInline = true; await video.play();
    flip = 1; setSrc(video, video.videoWidth, video.videoHeight); document.getElementById("cam").classList.add("on"); }
  catch (e) { flash("no camera here"); } };
document.getElementById("mic").onclick = mic;
document.getElementById("sim").onclick = e => { snd.sim = !snd.sim; e.target.classList.toggle("on", snd.sim); };
document.getElementById("deep").oninput = e => { DEEP = e.target.value / 100; };
document.getElementById("gs").oninput = e => { GS = e.target.value / 10; };
document.getElementById("clear").onclick = () => { for (const l of lat) { gl.bindFramebuffer(gl.FRAMEBUFFER, l.f); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); } gl.bindFramebuffer(gl.FRAMEBUFFER, null); };
document.getElementById("tg").onclick = () => document.getElementById("ui").classList.toggle("hidden");
addEventListener("keydown", e => { if (e.key === "h") document.getElementById("ui").classList.toggle("hidden"); });
flash("画像を選ぶ、またはカメラ");
</script></body></html>
