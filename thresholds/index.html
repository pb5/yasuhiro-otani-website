<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thresholds">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<title>Thresholds of Presence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one black screen; a single paragraph of prose in a reading column; the more active the sound, the longer a paragraph stays */
:root { --bg:#000; --ink:#a39d92; --ui:#4a4741; --ui-hi:#8f897f; --hud:#5a5650;
  --serif:"EB Garamond", Garamond, "Hoefler Text", "Times New Roman", serif;
  --mono: ui-monospace, Menlo, Consolas, monospace; color-scheme: dark; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { background:var(--bg); color:var(--ink); overflow:hidden; margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none; user-select:none; touch-action:manipulation; }
#stage { position:fixed; inset:0; }
#para { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); margin:0;
  width:min(84vw, 30em); font-family:var(--serif); text-align:left; text-wrap:pretty;
  font-size:calc(clamp(19px, min(3.4vw, 5.6vh), 66px) * var(--scale, 1)); line-height:1.45;
  opacity:0; transition:opacity 2s ease; }
#para.on { opacity:1; }
#panel { position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:14px; font-family:var(--mono); font-size:13px; color:var(--ui);
  width:calc(100vw - 32px); max-width:640px; text-align:center; }
#panel .row { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px 12px; }
#panel button { white-space:nowrap; font:inherit; color:var(--ui-hi); background:transparent; border:1px solid var(--ui); border-radius:4px;
  min-width:44px; min-height:44px; padding:0 14px; cursor:pointer; }
#panel button:focus-visible { outline:1px solid var(--ui-hi); outline-offset:3px; }
#panel span { white-space:nowrap; }
#meter { position:relative; width:min(280px, 80vw); height:6px; background:#141414; }
#meterFill { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--ui-hi); }
#meterThr { position:absolute; top:-4px; bottom:-4px; width:2px; left:0; background:#a33; }
#ver { font-size:11px; color:#3d3a35; }
#hud { position:fixed; right:calc(14px + env(safe-area-inset-right, 0px)); bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  color:var(--hud); font:12px/1.4 var(--mono); text-align:right; opacity:0; transition:opacity .4s; white-space:pre; pointer-events:none; }
#hud.on { opacity:1; }
body.running { cursor:none; }
body.running #panel { display:none !important; }
@media (prefers-reduced-motion: reduce) { #para { transition-duration:.01s; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap">

<div id="stage" aria-live="polite"><p id="para"></p></div>
<div id="panel">
  <div class="row">
    <button id="smaller" aria-label="文字を小さく">A−</button>
    <span id="sizeLbl">100%</span>
    <button id="bigger" aria-label="文字を大きく">A＋</button>
    <button id="slower" aria-label="全体をゆっくり">pace −</button>
    <span id="paceLbl">1.0×</span>
    <button id="faster" aria-label="全体を速く">pace ＋</button>
  </div>
  <div class="row">
    <button id="micBtn">mic: off</button>
    <button id="sensMinus" aria-label="反応しやすく">−</button>
    <span id="sensLbl">+12 dB</span>
    <button id="sensPlus" aria-label="反応しにくく">＋</button>
  </div>
  <div id="meter" aria-hidden="true"><div id="meterFill"></div><div id="meterThr"></div></div>
  <button id="go">Start</button>
  <div>loops by itself · busier sound, slower text<br>tap right: next · tap left: back · hold: pause / menu · keys or pedal: → ← space</div>
  <div id="ver">v11</div>
</div>
<div id="hud"></div>

<script>
/* ===== text: prose, in order, looping ===== */
const PARAS = [
  "This is a guitar and a filter. There is no computer in the sound. Nothing is recorded, and nothing is planned.",
  "The guitar feeds the filter, and the filter feeds itself. Once it begins, the sound moves on its own. My work is to listen to where it is going.",
  "When we really listen, we all hear much the same thing. When we don't, each of us hears something different. Not the sound, but an image of it: what we expect, what we already know.",
  "While you read this, you are listening less. That is not a problem. Notice it, and come back.",
  "The same settings never give the same sound twice. The system remembers nothing. I cannot repeat it, and I don't try.",
  "A small touch can change everything. Sometimes nothing I do changes anything. Most of the time I am not playing. I am waiting, and following.",
  "What I listen for is an edge: the moment just before the sound holds, or just before it breaks. The edge does not stay where it is. It moves while I listen.",
  "A note can appear that belongs nowhere. It can change everything around it. I keep it.",
  "The sound is never finished. Something is always left open, so that you can complete it. What you hear is partly yours.",
  "There is no right or wrong tool. A computer, a guitar, a voice. Use whatever lets you listen.",
  "When the image falls away, what remains is the sound and the person listening.",
  "When it ends, it is gone. Not even the silence stays.",
  "For me, listening is the performance."
];

/* ===== pacing =====
   Each paragraph has a reading time. It stays until "progress" reaches 1.
   Quiet room: progress runs at full speed. Busy sound: progress slows, up to SLOW_MAX times. */
const FADE = 2.0, GAP = 2.5, READ_BASE = 4, READ_PER_WORD = 0.5, SLOW_MAX = 4;
let PACE = 1;
const readTime = p => (READ_BASE + p.split(/\s+/).length * READ_PER_WORD) / PACE;

const el = document.getElementById("para"), hud = document.getElementById("hud"), panel = document.getElementById("panel");
let started = false, paused = false, last = null, hudT, wake = null;
let idx = 0, loop = 1, phase = "gap", phaseT = 0, progress = 0, activity = 0;
const flash = m => { hud.textContent = m; hud.classList.add("on"); clearTimeout(hudT); hudT = setTimeout(() => hud.classList.remove("on"), 1800); };
const status = () => `${idx + 1} / ${PARAS.length} · loop ${loop}` + (micOn ? ` · sound ${Math.round(activity * 100)}%` : "") + (paused ? " · paused" : "");

function show(i) {
  idx = (i + PARAS.length) % PARAS.length;
  el.style.transition = "none"; el.classList.remove("on"); el.textContent = PARAS[idx]; void el.offsetWidth; el.style.transition = "";
  el.classList.add("on"); phase = "in"; phaseT = 0; progress = 0;
}
function step(dt) {
  phaseT += dt;
  if (phase === "in") { if (phaseT >= FADE) { phase = "hold"; phaseT = 0; } }
  else if (phase === "hold") {
    const slow = 1 + (SLOW_MAX - 1) * activity;          /* busier sound = slower text */
    progress += dt / (readTime(PARAS[idx]) * slow);
    if (progress >= 1) { el.classList.remove("on"); phase = "out"; phaseT = 0; }
  }
  else if (phase === "out") { if (phaseT >= FADE) { phase = "gap"; phaseT = 0; } }
  else if (phase === "gap") { if (phaseT >= GAP) { if (idx === PARAS.length - 1) loop++; show(idx + 1); } }
}

/* ===== mic: how busy the sound is (level above the room, plus how much it is changing). Nothing is recorded or sent. ===== */
let micOn = false, analyser = null, buf = null, floorDb = -70, SENS = 12, levelDb = -100, prevDb = -100, change = 0, calib = null;
const micBtn = document.getElementById("micBtn");
async function startMic() {
  if (micOn) { calib = { until: performance.now() + 2500, vals: [] }; micBtn.textContent = "mic: listening to the room…"; return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume();
    analyser = ac.createAnalyser(); analyser.fftSize = 1024; buf = new Float32Array(analyser.fftSize);
    ac.createMediaStreamSource(s).connect(analyser);
    micOn = true; calib = { until: performance.now() + 2500, vals: [] }; micBtn.textContent = "mic: listening to the room…";
  } catch (e) { micBtn.textContent = "mic: not available here"; flash("mic not available here"); }
}
function micStep(dt) {
  analyser.getFloatTimeDomainData(buf);
  let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  const db = 10 * Math.log10(s / buf.length + 1e-12);
  levelDb = db > levelDb ? levelDb * 0.5 + db * 0.5 : levelDb * 0.9 + db * 0.1;
  change = change * 0.95 + Math.abs(levelDb - prevDb) * 0.05; prevDb = levelDb;
  if (calib) {
    calib.vals.push(levelDb);
    if (performance.now() > calib.until) { const v = calib.vals.sort((a, b) => a - b); floorDb = v[Math.floor(v.length / 2)] ?? -70; calib = null; micBtn.textContent = "mic: on (tap to recalibrate)"; }
    return;
  }
  const loud = Math.max(0, Math.min(1, (levelDb - (floorDb + SENS)) / 24));
  const busy = Math.max(0, Math.min(1, change / 3));
  const target = Math.max(loud, busy * (levelDb > floorDb + SENS ? 1 : 0.3));
  activity += (target - activity) * Math.min(1, dt * 1.5);
  if (!panel.hidden) {
    const pct = d => Math.max(0, Math.min(100, (d + 80) / 80 * 100)) + "%";
    document.getElementById("meterFill").style.width = pct(levelDb);
    document.getElementById("meterThr").style.left = pct(floorDb + SENS);
  }
}

function tick(ts) {
  const dt = last === null ? 0 : Math.min(0.1, (ts - last) / 1000);
  if (micOn) micStep(dt);
  if (started && !paused) step(dt);
  last = ts; requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ===== controls ===== */
function go(dir) { if (!started) return; show(idx + dir); flash(status()); }
async function keepAwake() { try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (started && document.visibilityState === "visible") keepAwake(); });
function start() {
  const resuming = started; started = true; paused = false;
  panel.hidden = true; panel.style.display = "none"; document.body.classList.add("running");
  keepAwake(); try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch (e) {}
  if (!resuming) { loop = 1; show(0); }
  flash(status());
}
function togglePause() { if (!started) return; paused = !paused; flash(status()); }
function showMenu() {
  if (!started) return; paused = true; panel.hidden = false; panel.style.display = ""; document.body.classList.remove("running");
  document.getElementById("go").textContent = "Resume"; flash(status());
}
function reset() {
  started = false; paused = false; idx = 0; loop = 1; el.classList.remove("on");
  panel.hidden = false; panel.style.display = ""; document.body.classList.remove("running");
  document.getElementById("go").textContent = "Start"; flash("reset");
}
let SCALE = 1;
function setScale(d) { SCALE = Math.round(Math.max(0.6, Math.min(2.5, SCALE + d)) * 10) / 10;
  document.documentElement.style.setProperty("--scale", SCALE);
  document.getElementById("sizeLbl").textContent = Math.round(SCALE * 100) + "%"; flash("size " + Math.round(SCALE * 100) + "%"); }
function setPace(d) { PACE = Math.round(Math.max(0.3, Math.min(3, PACE + d)) * 10) / 10;
  document.getElementById("paceLbl").textContent = PACE.toFixed(1) + "×"; flash("pace " + PACE.toFixed(1) + "×"); }
function setSens(d) { SENS = Math.max(3, Math.min(40, SENS + d)); document.getElementById("sensLbl").textContent = "+" + SENS + " dB"; flash("threshold +" + SENS + " dB"); }

const on = (id, fn) => document.getElementById(id).addEventListener("click", e => { e.stopPropagation(); fn(); });
on("go", start); on("smaller", () => setScale(-0.1)); on("bigger", () => setScale(0.1));
on("slower", () => setPace(-0.1)); on("faster", () => setPace(0.1));
on("micBtn", startMic); on("sensMinus", () => setSens(-1)); on("sensPlus", () => setSens(1));

const stage = document.getElementById("stage");
let holdTimer = null, held = false, tx = 0, ty = 0;
stage.addEventListener("pointerdown", e => { tx = e.clientX; ty = e.clientY; held = false;
  clearTimeout(holdTimer); holdTimer = setTimeout(() => { held = true; showMenu(); }, 700); });
stage.addEventListener("pointermove", e => { if (Math.abs(e.clientX - tx) > 15 || Math.abs(e.clientY - ty) > 15) clearTimeout(holdTimer); });
stage.addEventListener("contextmenu", e => e.preventDefault());
stage.addEventListener("pointerup", e => { clearTimeout(holdTimer); if (!started || held) return; go(e.clientX > innerWidth / 2 ? 1 : -1); });

document.addEventListener("keydown", e => {
  const k = e.key;
  if (["ArrowRight", "ArrowDown", "PageDown", "Enter"].includes(k)) { e.preventDefault(); started ? go(1) : start(); }
  else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(k)) { e.preventDefault(); go(-1); }
  else if (k === " ") { e.preventDefault(); started ? togglePause() : start(); }
  else if (k === "-") setScale(-0.1);
  else if (k === "=" || k === "+") setScale(0.1);
  else if (k === ",") setSens(-1);
  else if (k === ".") setSens(1);
  else if (k.toLowerCase() === "m") startMic();
  else if (k.toLowerCase() === "r") reset();
  else if (k.toLowerCase() === "h") flash(status());
});
</script>

</html>
