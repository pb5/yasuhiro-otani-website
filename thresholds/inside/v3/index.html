<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thresholds of Presence — inside the line (study v3)</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px/1.4 Georgia,serif;color:#bbb}
canvas{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;opacity:.85;transition:opacity .4s}
#ui.hidden{opacity:0;pointer-events:none}
button,select{background:#111;color:#bbb;border:1px solid #333;border-radius:4px;padding:5px 9px;font:inherit}
button.on{border-color:#aaa;color:#fff}
#fl{position:fixed;left:50%;top:14px;transform:translateX(-50%);opacity:0;transition:opacity .5s;color:#999}
#tg{position:fixed;right:10px;top:10px}
</style></head><body>
<canvas id="c"></canvas>
<div id="fl"></div>
<button id="tg">≡</button>
<div id="ui">
  <button id="mic">Mic</button><button id="sim">擬似音</button>
  <span>密度</span><select id="q"><option value="1">等倍</option><option value="0.75">0.75</option><option value="0.5">0.5</option></select>
  <span>深さ</span><select id="nv"><option value="5">5</option><option value="7" selected>7</option><option value="9">9</option></select>
  <button id="fs">全画面</button>
</div>
<script>
/* Inside the line.
   One line is drawn so finely that it can be entered. The camera keeps falling into it:
   what was one line opens into a band, and the band is made of finer lines, each of which opens again.
   Nothing is a texture or a picture of anything: every pixel is computed, at any depth, from the same rule,
   and the fall never reaches a bottom and never repeats. The room's sound sets how fast we fall and how much the lines writhe. */
const c = document.getElementById("c"), gl = c.getContext("webgl", { antialias: false, alpha: false, preserveDrawingBuffer: false });
gl.getExtension("OES_standard_derivatives");
const VS = `attribute vec2 p; varying vec2 v; void main(){ v = p; gl_Position = vec4(p,0.,1.); }`;
const FS = (N) => `#extension GL_OES_standard_derivatives : enable
precision highp float; varying vec2 v; uniform vec2 uR; uniform float uT, uZ, uW, uLv, uEx; uniform vec3 uS[2]; uniform float uRZ[4], uRK[4], uRG[4];
float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 4; i++){ s += a * n(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= .5; } return s; }
/* one depth: a field of flowing filaments. returns distance to the nearest filament, in pixels, and the field's own phase */
vec3 layer(vec2 uv, float M, float seed){
  float r = length(uv); float a = .55 * log(1. + r * 3.) * uW;            // the whole fall turns, as a vortex does
  vec2 p = mat2(cos(a), -sin(a), sin(a), cos(a)) * (uv / M * 3.0) + vec2(h(vec2(seed, 1.7)), h(vec2(seed, 9.1))) * 50.;
  vec2 q = vec2(fbm(p * .9 + vec2(0., uT * .05)), fbm(p * .9 + vec2(5.2, -uT * .043)));
  q = p + (.8 + .9 * uW) * (q - .5) * 2.2;
  float g = fbm(q * .7 + seed) * 4.;
  float fw = min(fwidth(g), .5); float d = abs(fract(g + .5) - .5) / max(fw, 1e-5);
  return vec3(d, g, fw);
}
void main(){
  vec2 uv = v * vec2(uR.x / uR.y, 1.) * .5;
  /* hard cuts: up to two straight seams divide the picture; each part is the same fall seen at another depth and printed at another exposure */
  int r = 0;
  for (int i = 0; i < 2; i++) if (dot(uv, uS[i].xy) - uS[i].z > 0.) r += i == 0 ? 1 : 2;
  float rz = 0., rk = 1.8, rg = 1.25;
  for (int i = 0; i < 4; i++) if (i == r) { rz = uRZ[i]; rk = uRK[i]; rg = uRG[i]; }
  float Zr = uZ + rz;
  float fz = fract(Zr), iz = floor(Zr);
  const int N = ${N};
  float mask = 1.;
  float light = 0., fill = 0., carve = 0., ground = 0.;
  for (int k = N - 1; k >= 0; k--) {                 // from the coarsest depth to the finest
    float e = float(k) + fz;
    float M = pow(2., e);
    float seed = float(k) - iz;
    float w0 = smoothstep(0., 1.2, e) * smoothstep(float(N), float(N) - 1.6, e);
    float wt = smoothstep(float(N) - 5., float(N) - 3.8, e) * smoothstep(float(N), float(N) - 1.6, e);
    vec3 L = layer(uv * pow(2., float(N)), M, seed);
    float wpx = .55 * M / pow(2., float(N) - 4.);
    float res = 1. - smoothstep(.12, .3, L.z);
    ground += min(1., 2. * wpx * L.z) * (1. - res) * w0;   // lines too fine to resolve are not dropped: they settle as the black's own texture
    wt *= res;
    float solid = 1. - smoothstep(1.2, 3.5, wpx);
    float core = clamp(1. - (L.x - wpx), 0., 1.);
    float edge = clamp(1. - abs(L.x - wpx) * 1.3, 0., 1.) * (1. - smoothstep(14., 40., wpx));
    float inside = (1. - smoothstep(wpx - 1., wpx + 1., L.x)) * (1. - solid);
    float dark = step(.55, h(vec2(seed, 3.3)));
    if (dark > .5 && fill > .001) carve = max(carve, core * wt * mask);
    else light += (core * solid * 2.2 + edge * (1. - solid) * .7) * wt * mask;
    fill = max(fill, inside * wt * .06);
    mask = clamp(mask * 1.2 * smoothstep(wpx * 1.8 + 2., 0., L.x), 0., 1.);
  }
  vec2 px = gl_FragCoord.xy;
  float grain = n(px / 2.6 + float(r) * 31.7) * .5 + n(px / 7. - float(r) * 11.1) * .5;   // the black is never empty: a grain just above it, its own in each part
  ground = ground * .03 * (.6 + .8 * grain) + grain * grain * .0025;
  float x = ground + fill * (1. - carve * .95) + light * (1. + uLv * .6) * (1. - carve * .7);
  x *= uEx;
  x = 1. - exp(-x * rk);                              // each part has its own exposure: some nearly black, some burnt to white with structure left in it
  x = pow(x, rg);
  x += (h(v * uR + 17.) - .5) / 255.;
  gl_FragColor = vec4(vec3(max(x, 0.)), 1.);
}`;
function sh(t, s){ const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; }
let P, U = {};
function build(N){ if (P) gl.deleteProgram(P); P = gl.createProgram(); gl.attachShader(P, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(P, sh(gl.FRAGMENT_SHADER, FS(N))); gl.linkProgram(P); gl.useProgram(P);
  for (const k of ["uR","uT","uZ","uW","uLv","uEx","uS","uRZ","uRK","uRG"]) U[k] = gl.getUniformLocation(P, k);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const l = gl.getAttribLocation(P, "p"); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0); }
build(7);
let Q = 1;
function resize(){ const d = Math.min(2, devicePixelRatio || 1) * Q; c.width = Math.round(innerWidth * d); c.height = Math.round(innerHeight * d); gl.viewport(0, 0, c.width, c.height); }
addEventListener("resize", resize); resize();

/* the room */
const snd = { an: null, buf: null, floor: -70, lv: 0, on: false, sim: false, cal: 0, calv: [], sn: 0 };
let actx;
async function mic(){ try { const st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  actx = new (window.AudioContext || window.webkitAudioContext)(); snd.an = actx.createAnalyser(); snd.an.fftSize = 2048; snd.buf = new Float32Array(2048);
  actx.createMediaStreamSource(st).connect(snd.an); snd.sim = false; snd.cal = 2.5; snd.calv = []; flash("listening to the quiet…"); document.getElementById("mic").classList.add("on"); }
  catch (e) { flash("no microphone here — 擬似音"); } }
function sndStep(dt){
  if (snd.an) { snd.an.getFloatTimeDomainData(snd.buf); let q = 0; for (const x of snd.buf) q += x * x; const db = 20 * Math.log10(Math.sqrt(q / snd.buf.length) + 1e-9);
    if (snd.cal > 0) { snd.calv.push(db); snd.cal -= dt; if (snd.cal <= 0) { const s = snd.calv.sort((a, b) => a - b); snd.floor = Math.max(-90, s[Math.floor(s.length * .6)]); flash("quiet = " + snd.floor.toFixed(1) + " dB"); } return; }
    const v = Math.max(0, Math.min(1, (db - snd.floor - 8) / 24)); snd.lv += (v - snd.lv) * (v > snd.lv ? .3 : .06); }
  else if (snd.sim) { snd.sn += (Math.random() - .5) * dt * 1.4; snd.sn *= .996; const v = Math.max(0, Math.min(1, .4 + snd.sn)); snd.lv += (v - snd.lv) * .1; }
  else snd.lv *= .98;
}
let Z = 0, W = .3, T = 0, last = performance.now(), lvS = 0;
/* the cuts */
const seams = [[1, 0, 9], [0, 1, 9]];                 // off screen until a cut is made
const RZ = [0, 0, 0, 0], RK = [1.8, 1.8, 1.8, 1.8], RG = [1.25, 1.25, 1.25, 1.25];
let nextSeam = 0, lastCut = -99, prevLv = 0, quiet = 0;
const PRINTS = [[1.8, 1.25], [6.5, .75], [.7, 1.7], [3.2, 1.0], [12, .6]];   // exposure, contrast: plain, burnt, nearly black, full, white with structure
function cut() {
  const r = Math.random(), a = r < .4 ? 0 : r < .75 ? Math.PI / 2 : (Math.random() - .5) * 1.2;   // mostly level or upright, as paper is cut
  const off = (Math.random() - .5) * .6;
  seams[nextSeam] = [Math.sin(a), Math.cos(a), off];
  const bit = nextSeam === 0 ? 1 : 2;
  for (let i = 0; i < 4; i++) if (i & bit) {          // everything on the new side becomes another print
    const pr = PRINTS[Math.floor(Math.random() * PRINTS.length)];
    RK[i] = pr[0]; RG[i] = pr[1]; RZ[i] = (Math.random() - .3) * 4; }
  nextSeam = 1 - nextSeam; lastCut = T; }
function heal() { const i = seams.findIndex(s => s[2] < 5); if (i < 0) return; seams[i] = [seams[i][0], seams[i][1], 9];
  const bit = i === 0 ? 1 : 2; for (let k = 0; k < 4; k++) if (k & bit) { RZ[k] = RZ[k ^ bit]; RK[k] = RK[k ^ bit]; RG[k] = RG[k ^ bit]; } lastCut = T; }
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt; sndStep(dt);
  lvS += (snd.lv - lvS) * Math.min(1, dt * 1.5);
  Z += dt * (.025 + .22 * lvS);                    // the fall: barely moving in silence, faster as the room fills
  W += ((.25 + 1.1 * lvS) - W) * Math.min(1, dt * .4);   // the lines writhe with the sound
  const live = snd.an || snd.sim;
  const onset = live && snd.lv - prevLv > .12; prevLv = snd.lv;
  if (snd.lv < .05) quiet += dt; else quiet = 0;
  if (onset && T - lastCut > 2.5) cut();                       // a sound cuts the picture
  if (quiet > 14 && T - lastCut > 14) heal();                  // a long silence lets one cut close again
  gl.uniform3fv(U.uS, new Float32Array(seams.flat())); gl.uniform1fv(U.uRZ, new Float32Array(RZ)); gl.uniform1fv(U.uRK, new Float32Array(RK)); gl.uniform1fv(U.uRG, new Float32Array(RG));
  gl.uniform2f(U.uR, c.width, c.height); gl.uniform1f(U.uT, T * (.4 + 1.2 * lvS)); gl.uniform1f(U.uZ, Z); gl.uniform1f(U.uW, W); gl.uniform1f(U.uLv, lvS); gl.uniform1f(U.uEx, .4 + .6 * Math.exp(-Z * .025));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function flash(t){ const f = document.getElementById("fl"); f.textContent = t; f.style.opacity = 1; clearTimeout(flash.t); flash.t = setTimeout(() => f.style.opacity = 0, 2000); }
document.getElementById("mic").onclick = mic;
document.getElementById("sim").onclick = e => { snd.sim = !snd.sim; e.target.classList.toggle("on", snd.sim); };
document.getElementById("q").onchange = e => { Q = +e.target.value; resize(); };
document.getElementById("nv").onchange = e => build(+e.target.value);
document.getElementById("fs").onclick = () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
document.getElementById("tg").onclick = () => document.getElementById("ui").classList.toggle("hidden");
addEventListener("keydown", e => { if (e.key === "c") cut(); if (e.key === "h") document.getElementById("ui").classList.toggle("hidden"); if (e.key === "s") document.getElementById("sim").click(); });
</script></body></html>
