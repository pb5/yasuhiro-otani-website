<!DOCTYPE html>

<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#888;
  font-family:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;-webkit-user-select:none;user-select:none}

<div id="ui">

  <span class="lab">設置</span><button id="floorB">床</button><button id="pinB">台形</button><button id="pinR">台形リセット</button><button id="instB">設置イメージ</button>
  <span class="lab">原稿</span><select id="matS"><option value="0">なし</option><option value="1">光沢図版</option><option value="2">探査機モザイク</option><option value="3">天球図の見開き</option><option value="4">手稿と光</option><option value="5">長時間露光</option><option value="6">擬似カラー</option><option value="7">点描</option><option value="8">エアブラシ</option><option value="9">立体コラージュ</option></select>
  <span class="lab">書き出し</span><select id="outR"><option value="">画面</option><option value="1920x1080">1080p</option><option value="2560x1440" selected>1440p</option></select><button id="recOut">● 書き出し</button>

  <button id="cntB" class="on">数</button><button id="rst">最初から</button>

<script>
/* ===== Thresholds of Presence — v68 "the count, near and far" =====
   Every line is one life ending, spiralling down a funnel into the dark. Nothing comes back out.
   Rates are yearly estimates spread over the seconds. Stages add up: people → stars → land animals → fish → insects.
   The camera follows the numbers: close enough to see one line pass when the lives are few (micro);
   pulled back until the whole thing is a small bright eye when they are too many (macro); turning, zooming, low and high.
   At the end the camera falls into the dark. */

const YEAR = 365.25 * 86400;
const CATS = [
  { k:"people", lo: 63.6e6 / YEAR, hi: 63.6e6 / YEAR, rate: 63.6e6 / YEAR,  unit:"1 line = 1 human death", note:"about 2 per second" },
  { k:"stars", lo: 10, hi: 1250, rate: 130,            unit:"1 line = 1 star exploding somewhere in the universe", note:"~130 per second (estimates range 10–1,250)" },
  { k:"land animals", lo: 87.9e9 / YEAR, hi: 87.9e9 / YEAR, rate: 87.9e9 / YEAR, unit:"1 line = 1 land animal slaughtered for meat", note:"~2,800 per second" },
  { k:"fish", lo: (1.1e12 + 124e9) / YEAR, hi: (2.2e12 + 124e9) / YEAR, rate: (1.65e12 + 124e9) / YEAR, unit:"1 line = 1 fish, caught from the wild or farmed", note:"~35,000–70,000 per second" },
  { k:"insects", lo: 1e14 / YEAR, hi: 1e16 / YEAR, rate: 1e15 / YEAR,    unit:"insects killed by pesticides", note:"~3 million–300 million per second. This can no longer be drawn." }
];
/* the timeline: a total length (default 22 min) shared out by weight. In automatic running, the sound sets the pace (see tempo) */
const WEIGHTS = [0.4, 3, 4, 5, 5.6, 4];      // dark, people, stars, land animals, fish, insects (minutes at 22)
let TOTAL_MIN = 22, STAGES = [];
function buildStages() { const k = TOTAL_MIN / 22 * 60; STAGES = WEIGHTS.map((w, i) => ({ d: i < WEIGHTS.length - 1 ? w * k : Infinity, n: i })); }
buildStages();
/* camera per stage: distance from the throat, height angle (deg), field of view (deg), turning speed (rad/s) */
const CAM = [
  { dist: 0.55, tilt: 72, fov: 70, spin: 0.02 },   // dark: very close
  { dist: 0.95, tilt: 24, fov: 72, spin: 0.03 },   // people: low and near — one line passes by
  { dist: 2.6,  tilt: 58, fov: 50, spin: 0.04 },   // stars: pull back, the spiral appears
  { dist: 1.1,  tilt: 28, fov: 65, spin: 0.06 },   // land animals: dive in, a tunnel
  { dist: 4.2,  tilt: 70, fov: 45, spin: 0.08 },   // fish: high above, the whole field
  { dist: 9.0,  tilt: 80, fov: 38, spin: 0.10 }    // insects: far — the eye of it, white all round
];
const RAMP = 10, LIFE = 5.0, HOLE = 0.16, DEPTH = 0.9;
const funnelZ = r => -DEPTH * Math.exp(-r / 0.32);

// ---------- GL ----------
const gc = document.getElementById("gl"), gl = gc.getContext("webgl", { antialias: true, alpha: false });
const ov = document.getElementById("ov"), ox = ov.getContext("2d");
let W, H, DPR, ASP;
let OUT = null;          // null = the window; otherwise [width, height] in pixels for export (16:9)
function resize() {
  if (OUT) {               // render at a fixed size, shown fitted in the window
    DPR = 2; W = OUT[0] / 2; H = OUT[1] / 2; ASP = W / H;
    const k = Math.min(innerWidth / W, innerHeight / H), cw = W * k, ch = H * k;
    gc.style.width = cw + "px"; gc.style.height = ch + "px"; gc.style.left = (innerWidth - cw) / 2 + "px"; gc.style.top = (innerHeight - ch) / 2 + "px";
  } else {
    DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; ASP = W / H;
    gc.style.width = gc.style.height = gc.style.left = gc.style.top = "";
  }
  for (const c of [gc, ov]) { c.width = W * DPR; c.height = H * DPR; }
  gl.viewport(0, 0, gc.width, gc.height); ox.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (window.__fbReady) { makeFB(); placePins(); }
}
addEventListener("resize", resize); resize();

const VS = `
precision highp float;
attribute vec4 a;      // theta0, r0, birth, tail(0/1)
attribute float b;     // lifetime factor + 10 x layer
uniform mat4 uM;
uniform mat4 uL[5];      // one transform per voice (people, stars, land animals, fish, insects)
uniform float uG[5], uS[5];   // per voice: brightness, accumulated turn
uniform float uT, uLife, uHole, uDepth, uAlpha;
varying float v;
void main(){
  int li = int(floor(b / 10.0 + 0.001)); float lf = b - float(li) * 10.0;
  float L = uLife * lf;
  float age = uT - a.z - a.w * 0.1 * L;
  float u = age / L;
  if (age < 0.0 || u >= 1.0) { gl_Position = vec4(3.0, 3.0, 2.0, 1.0); v = 0.0; return; }
  /* v69: no hole — the lines run all the way in and the funnel closes to a point */
  float r = max(0.004, a.y * (1.0 - u * u));
  float g = 1.0, sp = 0.0; mat4 Lm = mat4(1.0);
  for (int k = 0; k < 5; k++) if (k == li) { Lm = uL[k]; g = uG[k]; sp = uS[k]; }
  float th = a.x + 2.4 * log(a.y / max(r, 0.03)) + sp;
  vec3 P = vec3(cos(th) * r, sin(th) * r, -uDepth * exp(-r / 0.32));
  gl_Position = uM * (Lm * vec4(P, 1.0));          // the GPU clips lines at the near plane
  float near = 1.0 - r / a.y;
  v = g * uAlpha * smoothstep(0.0, 0.08, u) * (1.0 - smoothstep(0.96, 1.0, u)) * (0.35 + 0.9 * near) * (1.0 - a.w * 0.85);
}`;
const FS = `precision mediump float; varying float v; void main(){ gl_FragColor = vec4(vec3(v), 1.0); }`;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const U = {}; for (const n of ["uM","uT","uLife","uHole","uDepth","uAlpha","uL","uG","uS"]) U[n] = gl.getUniformLocation(prog, n);
const N = 320000, data = new Float32Array(N * 2 * 5);
let head = 0, dirtyLo = Infinity, dirtyHi = -1;
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
function clearData() { for (let i = 0; i < N * 2; i++) data[i * 5 + 2] = -1e6; gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW); head = 0; }
clearData();
{ const la = gl.getAttribLocation(prog, "a"), lb = gl.getAttribLocation(prog, "b");
  gl.enableVertexAttribArray(la); gl.vertexAttribPointer(la, 4, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(lb); gl.vertexAttribPointer(lb, 1, gl.FLOAT, false, 20, 16); }
gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.clearColor(0, 0, 0, 1);

/* ===== v70: analogue quality =====
   The image is made the way the sound is: by feedback. Each frame is laid back over the last one,
   drawn slightly inward and turned, and pushed by a slow turbulent flow (like cloud bands), then faded.
   New lines are added on top. What you see is the residue of everything that has flowed in — smeared, folded, never sharp.
   On the way to the screen: a little softness, halation round the bright parts, grain, vignette, a tone like printed ink. */
const QUAD = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const qbuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qbuf); gl.bufferData(gl.ARRAY_BUFFER, QUAD, gl.STATIC_DRAW);
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
const QVS = `attribute vec2 p; varying vec2 uv; void main(){ uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
const FBFS = `precision highp float; varying vec2 uv; uniform sampler2D tex; uniform float uT, uAsp, uZoom, uRot, uFlow, uDecay;
  float psi(vec2 p){ return sin(p.x*3.1+uT*.11)*cos(p.y*2.7-uT*.07) + .5*sin(p.x*6.3-p.y*5.1+uT*.19) + .25*cos(p.x*11.7+p.y*9.3-uT*.23); }
  void main(){
    vec2 c = uv - .5; c.x *= uAsp;
    float e = .004; vec2 q = c * 3.0;
    vec2 curl = vec2(psi(q+vec2(0.,e))-psi(q-vec2(0.,e)), -(psi(q+vec2(e,0.))-psi(q-vec2(e,0.)))) / (2.*e);
    float r = length(c); float a = uRot * (0.6 + 0.8 / (1.0 + 6.0 * r));       // turns faster near the middle
    vec2 s = mat2(cos(a), -sin(a), sin(a), cos(a)) * c * uZoom + curl * uFlow;
    s.x /= uAsp; s += .5;
    vec3 col = min(texture2D(tex, s).rgb, vec3(3.0)) * uDecay;
    gl_FragColor = vec4(col, 1.);
  }`;
const DFS = `precision highp float; varying vec2 vuv; vec2 uv; uniform sampler2D tex, uOv; uniform mat3 uH; uniform vec2 uPx, uRes; uniform float uT, uAna, uTone, uAsp, uMos, uInv, uSpec;
  uniform float uInst, uTan, uS; uniform vec3 uCP, uCF, uCR, uCU;
  uniform float uMat; uniform mat3 uHP; uniform float uCurl, uGx, uLv, uBandA, uBandO, uTerm;  // uTerm: stipple seed
  float hf(vec2 q){ float v = dot(texture2D(tex, q).rgb, vec3(.333)); return v / (1. + v); }
  vec3 comp(vec3 c){ vec4 o = texture2D(uOv, uv); return c * (1. - o.a) + o.rgb; }
  float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
  float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
    return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
  float look(vec2 q){                                   // the developed image: softness, halation, film shoulder
    vec3 b = texture2D(tex, q).rgb * .4;
    b += (texture2D(tex, q+vec2(uPx.x,0.)).rgb + texture2D(tex, q-vec2(uPx.x,0.)).rgb + texture2D(tex, q+vec2(0.,uPx.y)).rgb + texture2D(tex, q-vec2(0.,uPx.y)).rgb) * .15;
    vec3 halo = vec3(0.);
    for (int i = 0; i < 8; i++) { float an = float(i) * .785398; halo += max(texture2D(tex, q + vec2(cos(an), sin(an)) * uPx * 9.).rgb - .45, 0.); }
    float l = dot(b + halo * .09, vec3(.333)); l = l / (1. + l * .35); return pow(l, .92);
  }
  void main(){
    if (uInst > .5) {
      /* installation visualization: the picture laid on the floor of a dark room, seen from a standing visitor's eye */
      vec2 sc = (vuv - .5) * 2. * uTan; sc.x *= uAsp;
      vec3 d = normalize(uCF + sc.x * uCR + sc.y * uCU);
      float glow = 0.;
      for (int i = 0; i < 3; i++) for (int j = 0; j < 3; j++) glow += dot(texture2D(tex, vec2(.2 + float(i) * .3, .2 + float(j) * .3)).rgb, vec3(.333));
      glow = glow / 9.; glow = glow / (1. + glow * .4);
      if (d.y >= -1e-4) {                                   // walls and ceiling: dark, a little light thrown up from the floor
        float h = clamp(d.y * 3., 0., 1.);
        gl_FragColor = vec4(vec3(.012 + glow * .06 * (1. - h)), 1.); return; }
      float t = -uCP.y / d.y; vec3 p = uCP + t * d;
      uv = vec2(p.x / uS + .5, p.z / uS + .5);
      if (uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1.) {   // the floor outside the picture: only spill
        vec2 o = max(abs(p.xz) - uS * .5, 0.); float dd = length(o);
        gl_FragColor = vec4(vec3(.014 + glow * .22 * exp(-dd * 2.2)), 1.); return; }
    } else if (uMat > .5 && uMat < 1.5) {
      /* glossy plate: the picture is a printed page lying on a dark table, photographed at a slant; it curls; light glances off it */
      vec3 hq = uHP * vec3(vuv, 1.); vec2 pg = hq.xy / hq.z;
      if (pg.x < 0. || pg.x > 1. || pg.y < 0. || pg.y > 1. || hq.z <= 0.) {
        float n = h(floor(vuv * uRes / 3.)) * .5 + h(floor(vuv * uRes / 9.)) * .5;
        gl_FragColor = vec4(vec3(.035, .03, .028) + n * .02, 1.); return; }
      float bend = (pg.x - .5); pg.y += uCurl * bend * bend * .35;      // the page curls toward the binding
      uv = clamp(pg, 0., 1.);
    } else {
    vec3 hq = uH * vec3(vuv, 1.); uv = hq.xy / hq.z;          // corner pin: where on the floor each point of the picture lands
    if (uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1. || hq.z <= 0.) { gl_FragColor = vec4(0., 0., 0., 1.); return; }
    }
    if (uAna < .5) { gl_FragColor = vec4(comp(texture2D(tex, uv).rgb), 1.); return; }
    vec2 q = uv; float gain = 1.; float paper = 0.; float seam = 0.;
    if (uMos > .5) {                                    // a mosaic of frames, as a spacecraft sends them back
      vec2 c = uv - .5; c.x *= uAsp; float an = .6; mat2 R = mat2(cos(an), -sin(an), sin(an), cos(an));
      vec2 r = R * c * 6.0; vec2 id = floor(r); vec2 f = fract(r);
      float k = h(id);
      gain = .78 + .44 * k;
      vec2 jit = (vec2(h(id+3.1), h(id+7.7)) - .5) * .012;
      q = uv + jit;
      seam = (1. - smoothstep(0., .025, f.x)) + (1. - smoothstep(0., .025, f.y));
      float edge = length(c * vec2(.85, 1.)) + (k - .5) * .35;   // ragged, stepped outline
      paper = step(.5, edge);
    }
    float l = look(q) * gain;
    l *= 1. - seam * .25;
    vec2 cc = uv - .5; cc.x *= uAsp; l *= 1. - .55 * smoothstep(.35, 1.05, length(cc));
    l += (h(uv * 731. + fract(uT * 7.3)) - .5) * .07;
    l = clamp(l, 0., 1.);
    int m0 = int(uTone + .5);
    if (m0 >= 2) {                                      // printed tones meter the page, like a printer setting exposure
      float mean = 0.;
      for (int i = 0; i < 4; i++) for (int j = 0; j < 4; j++) mean += dot(texture2D(tex, vec2(.125 + float(i) * .25, .125 + float(j) * .25)).rgb, vec3(.333));
      mean /= 16.; mean = mean / (1. + mean * .35);
      l = clamp(l * .42 / max(.03, mean), 0., 1.); }
    if (uInv > .5) l = 1. - l;
    vec3 col = vec3(l);
    int m = int(uTone + .5);
    if (m == 1) { vec3 ink = vec3(.05,.035,.03), mid = vec3(.78,.36,.12), hi = vec3(.98,.92,.80);
      col = l < .5 ? mix(ink, mid, l * 2.) : mix(mid, hi, (l - .5) * 2.); }
    else if (m == 2) {                                  // blueprint / cyanotype
      col = mix(vec3(.04,.12,.32), vec3(.80,.88,.96), smoothstep(.0, .95, l));
      col = mix(col, vec3(.62,.78,.60), paper); }
    else if (m == 3) {                                  // black ink on pink paper, halftone screen
      vec2 p = uv * uRes; float an = .785398; vec2 g = mat2(cos(an), -sin(an), sin(an), cos(an)) * p / 4.5;
      vec2 f = fract(g) - .5; float ink = 1. - l; float rad = sqrt(ink) * .62;
      float dot_ = 1. - smoothstep(rad - .08, rad + .08, length(f));
      col = mix(vec3(.93,.72,.72), vec3(.13,.08,.09), dot_);
      col = mix(col, vec3(.93,.72,.72), paper); }
    else if (m == 4) {                                  // orange stock, one black plate, posterised and blotchy
      float n = vn(uv * uRes / 7.) * .6 + vn(uv * uRes / 2.5) * .4;
      float ink = step(.62 + (n - .5) * .5, 1. - l);
      col = mix(vec3(.96,.56,.18), vec3(.08,.05,.04), ink);
      col = mix(col, vec3(.96,.56,.18), paper); }
    else if (m == 5) {                                  // manuscript: pen and ink on pink paper; light is drawn as ink
      float n = vn(uv * uRes / 3.) * .6 + vn(uv * uRes / 11.) * .4;
      float ink = smoothstep(.02, .22, (uInv > .5 ? 1. - l : l) + (n - .5) * .12);
      vec3 pap = vec3(.86,.62,.72) * (.94 + .06 * vn(uv * uRes / 40.));
      col = mix(pap, vec3(.10,.06,.07), ink);
      col = mix(col, vec3(.86,.62,.72), paper); }
    else if (m == 6) {                                  // engraving: the light cut as hatching into a plate, printed on khaki paper
      vec2 p = uv * uRes; float d = uInv > .5 ? 1. - l : clamp(l * 1.7, 0., 1.);   // the light is what gets cut
      float h1 = .5 + .5 * sin(dot(p, vec2(.62, .78)) * 1.25);
      float h2 = .5 + .5 * sin(dot(p, vec2(-.78, .62)) * 1.25);
      float ink = step(h1, d * 1.15) * step(.2, d);
      ink = max(ink, step(h2, (d - .55) * 2.2));       // cross-hatch only in the deepest parts
      ink = max(ink, step(.9, d));
      col = mix(vec3(.84,.79,.62), vec3(.07,.06,.05), ink);
      col = mix(col, vec3(.84,.79,.62), paper); }
    else if (m == 7) {                                  // a planet seen from close: the whole flow wrapped onto a lit sphere, airbrushed
      vec2 c = uv - .5; c.x *= uAsp; vec2 o = vec2(0., -.78); float R = 1.28;
      vec2 pp = (c - o) / R; float r = length(pp);
      if (r > 1.) col = vec3(.035) + (h(uv * 913. + uT) - .5) * .03;

    gl.uniformMatrix4fv(PU.uP, false, new Float32Array(p.P)); gl.uniform4fv(PU.uCrop, p.crop); gl.uniform3fv(PU.uPaper, p.paper);

  }

  const drawRate = Math.min(totalRate, CAP);

  { const act = CATS.map((c, i) => c.rate * arrived[i]), nAct = act.filter(r => r > 0).length || 1;

  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f); gl.viewport(0, 0, FBW, FBH);
  if (analog) {
    gl.disable(gl.BLEND);
    gl.useProgram(fbP); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.t); gl.uniform1i(FU.tex, 0);
    gl.uniform1f(FU.uT, T); gl.uniform1f(FU.uAsp, ASP); gl.uniform1f(FU.uZoom, 1.0 + MO.z * Math.min(2, rdt * 60));
    gl.uniform1f(FU.uRot, MO.r * Math.min(2, rdt * 60)); gl.uniform1f(FU.uFlow, MO.f * Math.min(2, rdt * 60)); gl.uniform1f(FU.uDecay, Math.pow(MO.d, rdt * 60));     // fade per second, not per frame

// ---------- controls ----------
const endIt = () => { ending = true; fall = 0; labelA = 0; };
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => setStage(+b.dataset.s));
document.getElementById("endB").onclick = endIt;
document.getElementById("spd").onchange = e => speed = +e.target.value;
document.getElementById("cap").onchange = e => CAP = +e.target.value;
document.getElementById("anaB").onclick = e => { analog = !analog; e.target.classList.toggle("on", analog); makeFB(); };
const cycleTone = () => { tone = (tone + 1) % TONES.length; const b = document.getElementById("toneB"); b.textContent = TONES[tone]; b.classList.toggle("on", !!tone); };
document.getElementById("toneB").onclick = cycleTone;
const tgl = (id, f) => document.getElementById(id).onclick = e => e.target.classList.toggle("on", f());
tgl("mosB", () => (mosaic = !mosaic)); tgl("floorB", () => (floor = !floor));
tgl("pinB", () => { pinOn = !pinOn; placePins(); return pinOn; });
document.getElementById("pinR").onclick = () => { corners = [[0,0],[1,0],[1,1],[0,1]]; updatePin(); }; tgl("specB", () => (spec = !spec)); tgl("calcB", () => (calc = !calc)); tgl("roomB", () => (room = !room)); tgl("skyB", () => (sky = !sky)); tgl("invB", () => (invert = !invert)); tgl("recB", () => (record = !record));
document.getElementById("camB").onclick = e => { camAuto = !camAuto; e.target.classList.toggle("on", camAuto); e.target.textContent = camAuto ? "動く" : "止める"; };
document.getElementById("cntB").onclick = e => { showCount = !showCount; e.target.classList.toggle("on", showCount); };
document.getElementById("rst").onclick = restart;
document.getElementById("matS").onchange = e => setMat(+e.target.value);
document.getElementById("len").onchange = e => { TOTAL_MIN = +e.target.value; buildStages(); flash("length " + TOTAL_MIN + " min"); };
tgl("autoRun", () => { autoRun = !autoRun; flash("automatic " + (autoRun ? "on: the sound sets the pace and the look" : "off")); return autoRun; });
tgl("instB", () => { setInst(!inst); return inst; });
document.getElementById("recOut").onclick = () => rec ? stopRec() : startRec();
addEventListener("resize", () => { if (inst) ivDraw(); });
document.getElementById("micB").onclick = startMic;
document.getElementById("calB").onclick = () => { if (snd.mic) calibrate(); else startMic(); };
const thr = d => { snd.sens = Math.max(1, Math.min(40, snd.sens + d)); showThr(); flash("threshold +" + snd.sens + " dB above the quiet"); };
document.getElementById("thrM").onclick = () => thr(-1); document.getElementById("thrP").onclick = () => thr(1);
tgl("simB", () => { snd.sim = !snd.sim; flash("simulated sound " + (snd.sim ? "on" : "off")); return snd.sim; });
tgl("oneB", () => (showOne = !showOne));
tgl("dimB", () => (dimOn = !dimOn));
tgl("autoB", () => { snd.auto = !snd.auto; flash("auto end " + (snd.auto ? "on" : "off")); return snd.auto; });
addEventListener("pointerdown", () => { if (actx && actx.state === "suspended") actx.resume(); }, { once: true });
showThr();
document.getElementById("tog").onclick = () => document.getElementById("ui").classList.toggle("hidden");
addEventListener("keydown", e => {
  if (e.key >= "0" && e.key <= "5") setStage(+e.key);
  else if (e.key === "e") endIt();
  else if (e.key === "t") cycleTone();
  else if (e.key === "f") document.getElementById("floorB").click();
  else if (e.key === "k") document.getElementById("pinB").click();
  else if (e.key === "m") document.getElementById("mosB").click();
  else if (e.key === "i") document.getElementById("invB").click();
  else if (e.key === "r") document.getElementById("recB").click();
  else if (e.key === "h") document.getElementById("ui").classList.toggle("hidden");
  else if (e.key === "[") thr(-1);
  else if (e.key === "]") thr(1);
  else if (e.key === "n") { if (snd.mic) calibrate(); else startMic(); }
  else if (e.key === "s") document.getElementById("simB").click();
  else if (e.key === "x") document.getElementById("instB").click();
  else if (e.key === "w") document.getElementById("recOut").click();
  else if (e.key === "a") document.getElementById("autoB").click();
  else if (e.key === "l") document.getElementById("oneB").click();
  else if (e.key === "d") document.getElementById("dimB").click();
  else if (e.key === "c") { showCount = !showCount; document.getElementById("cntB").classList.toggle("on", showCount); }

restart(); requestAnimationFrame(frame);
startMic();
