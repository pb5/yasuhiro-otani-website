<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thresholds of Presence — v67b the count</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#888;
  font-family:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;left:0;right:0;bottom:0;background:rgba(6,6,6,.88);border-top:1px solid #1c1c1c;
  padding:8px 10px;font:12px -apple-system,"Hiragino Sans",sans-serif;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:3}
#ui.hidden{display:none}
#ui .lab{color:#555;font-size:11px;margin:0 2px 0 6px}
button,select{background:#141414;color:#bbb;border:1px solid #2a2a2a;border-radius:6px;padding:5px 8px;font-size:12px;font-family:inherit}
button.on{background:#2c2c2c;color:#fff;border-color:#555}
#tog{position:fixed;right:8px;top:8px;z-index:4;background:rgba(15,15,15,.6)}
#note{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:13px -apple-system,sans-serif;color:#999;
  background:rgba(12,12,12,.92);border:1px solid #2a2a2a;border-radius:8px;padding:10px 14px;display:none;z-index:5;max-width:80vw;text-align:center}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<button id="tog">≡</button>
<div id="note"></div>
<div id="ui">
  <span class="lab">場面</span>
  <button data-s="0">暗</button><button data-s="1">人</button><button data-s="2">星</button><button data-s="3">家畜</button>
  <button data-s="4">魚</button><button data-s="5">虫</button><button id="endB">終</button>
  <span class="lab">速度</span><select id="spd"><option value="1">x1</option><option value="4" selected>x4</option><option value="12">x12</option></select>
  <span class="lab">線の上限</span><select id="cap"><option value="10000">1万/s</option><option value="25000" selected>2.5万/s</option><option value="45000">4.5万/s</option></select>
    <button id="cntB" class="on">数</button><button id="rst">最初から</button>
</div>
<script>
/* ===== Thresholds of Presence — v67 "the count" =====
   Every line is one life ending, flowing into the dark at the centre. Nothing comes back out.
   The rates are yearly estimates spread evenly over the seconds (no source counts deaths live).
   Stages add up: people → stars → land animals → fish → insects. Past what can be drawn, the lines carry more lives each and the room turns white.
   In the hole: one small figure (the performer) and one line of light — the one life in this room that is being listened to. */

const YEAR = 365.25 * 86400;
const CATS = [
  { k:"people", rate: 63.6e6 / YEAR,  unit:"1 line = 1 human death", note:"about 2 per second" },
  { k:"stars",  rate: 130,            unit:"1 line = 1 star exploding somewhere in the universe", note:"~130 per second (estimates range 10–1,250)" },
  { k:"land animals", rate: 87.9e9 / YEAR, unit:"1 line = 1 land animal slaughtered for meat", note:"~2,800 per second" },
  { k:"fish",   rate: (1.65e12 + 124e9) / YEAR, unit:"1 line = 1 fish, caught from the wild or farmed", note:"~35,000–70,000 per second" },
  { k:"insects",rate: 1e15 / YEAR,    unit:"insects killed by pesticides", note:"~3 million–300 million per second. This can no longer be drawn." }
];
const STAGES = [ {d:8,n:0}, {d:50,n:1}, {d:50,n:2}, {d:50,n:3}, {d:60,n:4}, {d:Infinity,n:5} ];
const RAMP = 10;   // seconds for a new rate to arrive

// ---------- GL ----------
const gc = document.getElementById("gl"), gl = gc.getContext("webgl", { antialias: true, premultipliedAlpha: false, alpha: false });
const ov = document.getElementById("ov"), ox = ov.getContext("2d");
let W, H, DPR, ASP;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; ASP = W / H;
  for (const c of [gc, ov]) { c.width = W * DPR; c.height = H * DPR; }
  if (gl) gl.viewport(0, 0, gc.width, gc.height);
  ox.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();
if (!gl) { const n = document.getElementById("note"); n.textContent = "WebGL is not available on this device."; n.style.display = "block"; }

const VS = `
precision highp float;
attribute vec4 a;      // theta0, r0, birth, tail(0/1)
attribute float b;     // lifetime factor
uniform float uT, uLife, uTilt, uAsp, uHole, uCy, uAlpha, uScale;
varying float v;
void main(){
  float L = uLife * b;
  float age = uT - a.z - a.w * 0.1 * L;
  float u = age / L;
  if (age < 0.0 || u >= 1.0) { gl_Position = vec4(3.0, 3.0, 0.0, 1.0); v = 0.0; return; }
  float r = uHole + (a.y - uHole) * (1.0 - u * u);              // slow far out, fast near the hole
  float th = a.x + 2.4 * log(a.y / r);                            // logarithmic spiral
  vec2 p = vec2(cos(th) * r, sin(th) * r * uTilt);
  p *= uScale;
  if (uAsp > 1.0) p.x /= uAsp; else p.y *= uAsp;
  p.y += uCy;
  gl_Position = vec4(p, 0.0, 1.0);
  float near = 1.0 - (r - uHole) / (a.y - uHole);
  v = uAlpha * smoothstep(0.0, 0.08, u) * (0.35 + 0.9 * near) * (1.0 - a.w * 0.85);
}`;
const FS = `precision mediump float; varying float v; void main(){ gl_FragColor = vec4(vec3(v), 1.0); }`;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
let prog, U = {}, buf, N = 320000, head = 0, data;
if (gl) {
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  for (const n of ["uT","uLife","uTilt","uAsp","uHole","uCy","uAlpha","uScale"]) U[n] = gl.getUniformLocation(prog, n);
  data = new Float32Array(N * 2 * 5);
  for (let i = 0; i < N * 2; i++) data[i * 5 + 2] = -1e6;            // empty slots: born long ago, already gone
  buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
  const la = gl.getAttribLocation(prog, "a"), lb = gl.getAttribLocation(prog, "b");
  gl.enableVertexAttribArray(la); gl.vertexAttribPointer(la, 4, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(lb); gl.vertexAttribPointer(lb, 1, gl.FLOAT, false, 20, 16);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.clearColor(0, 0, 0, 1);
}
const LIFE = 5.0, HOLE = 0.16, TILT = 0.62, CY = 0.06;
let dirtyLo = Infinity, dirtyHi = -1;
function spawn(n, t) {
  for (let i = 0; i < n; i++) {
    const th = Math.random() * 6.2832, r0 = 1.25 + Math.random() * 0.9, lf = 0.7 + Math.random() * 0.6, bt = t - Math.random() * 0.016;
    const o = head * 10;
    data[o] = th; data[o+1] = r0; data[o+2] = bt; data[o+3] = 0; data[o+4] = lf;
    data[o+5] = th; data[o+6] = r0; data[o+7] = bt; data[o+8] = 1; data[o+9] = lf;
    if (head < dirtyLo) dirtyLo = head; if (head > dirtyHi) dirtyHi = head;
    head++; if (head >= N) { flush(); head = 0; }
  }
}
function flush() {
  if (dirtyHi < 0) return;
  gl.bufferSubData(gl.ARRAY_BUFFER, dirtyLo * 40, data.subarray(dirtyLo * 10, (dirtyHi + 1) * 10));
  dirtyLo = Infinity; dirtyHi = -1;
}

// ---------- state ----------
let T = 0, stage = 0, stageT = 0, speed = 4, CAP = 25000, acc = 0, ending = false, endT = 0;
let showCount = true, counts = CATS.map(() => 0), arrived = CATS.map(() => 0);   // 0..1 how far each rate has arrived
let labelA = 0, labelTxt = ["", ""];
function setStage(s) {
  stage = s; stageT = 0; ending = false;
  for (let i = 0; i < CATS.length; i++) if (i >= STAGES[s].n) arrived[i] = 0; else if (i < STAGES[s].n - 1) arrived[i] = 1;
  const c = CATS[STAGES[s].n - 1];
  labelTxt = c ? [c.unit, c.note] : ["", ""]; labelA = c ? 1 : 0;
}
function restart() { T = 0; counts = CATS.map(() => 0); arrived = CATS.map(() => 0); acc = 0;
  if (gl) { for (let i = 0; i < N * 2; i++) data[i * 5 + 2] = -1e6; gl.bufferSubData(gl.ARRAY_BUFFER, 0, data); head = 0; }
  setStage(0); beam.l = 0; }

// ---------- the one line of light (sound) ----------
let beamMode = "sim", actx, an, tb, floorDb = -70, ceilDb = -20;
const beam = { l: 0, n: 0, dead: 0 };
function beamStep(dt) {
  let v = 0;
  if (beamMode === "sim") {
    if (beam.dead > 0) { beam.dead -= dt; v = 0; }
    else { beam.n += (Math.random() - .5) * dt * 1.2; beam.n *= .995; v = Math.max(0, Math.min(1, .45 + beam.n));
      if (Math.random() < dt * .02) beam.dead = 4 + Math.random() * 6; }        // the sound dies; later another is born
  } else if (beamMode === "mic" && an) {
    an.getFloatTimeDomainData(tb); let s = 0; for (const x of tb) s += x * x;
    const db = 20 * Math.log10(Math.sqrt(s / tb.length) + 1e-9);
    floorDb += (db - floorDb) * (db < floorDb ? .3 : .002); ceilDb += (db - ceilDb) * (db > ceilDb ? .3 : .0015);
    if (ceilDb - floorDb < 20) ceilDb = floorDb + 20;
    v = Math.max(0, Math.min(1, (db - floorDb) / (ceilDb - floorDb)));
  }
  beam.l += (v - beam.l) * (v > beam.l ? .25 : .05);
}

// ---------- overlay: hole, veil, figure, beam, words ----------
const fmtN = n => Math.floor(n).toLocaleString("en-US");
function ndc(x, y) { return [(x * .5 + .5) * W, (.5 - y * .5) * H]; }
function holeGeom() {
  let rx = HOLE * 1.0, ry = HOLE * TILT;
  if (ASP > 1) rx /= ASP; else ry *= ASP;
  const [cx, cy] = ndc(0, CY); return { cx, cy, rx: rx * W * .5, ry: ry * H * .5 };
}
function figure(x, y, h, a) {      // a small standing person, drawn plainly
  ox.save(); ox.fillStyle = `rgba(225,225,225,${a})`; ox.translate(x, y); const s = h / 100;
  ox.beginPath(); ox.arc(0, -90 * s, 6.5 * s, 0, 6.283); ox.fill();
  ox.beginPath();
  ox.moveTo(-9 * s, -80 * s); ox.lineTo(9 * s, -80 * s); ox.lineTo(12 * s, -45 * s); ox.lineTo(7 * s, -45 * s); ox.lineTo(6 * s, -50 * s);
  ox.lineTo(5 * s, 0); ox.lineTo(1 * s, 0); ox.lineTo(0, -40 * s); ox.lineTo(-1 * s, 0); ox.lineTo(-5 * s, 0); ox.lineTo(-6 * s, -50 * s);
  ox.lineTo(-7 * s, -45 * s); ox.lineTo(-12 * s, -45 * s); ox.closePath(); ox.fill(); ox.restore();
}
function drawOverlay(veil) {
  ox.clearRect(0, 0, W, H);
  const g = holeGeom();
  // the room turns white when there are more lives than lines
  if (veil > 0.001) {
    ox.save(); ox.beginPath(); ox.rect(0, 0, W, H); ox.ellipse(g.cx, g.cy, g.rx * 1.35, g.ry * 1.35, 0, 0, 6.283);
    ox.fillStyle = `rgba(255,255,255,${veil})`; ox.fill("evenodd"); ox.restore();
  }
  // the hole: nothing comes back out
  const gr = ox.createRadialGradient(g.cx, g.cy, 0, g.cx, g.cy, g.rx * 1.35);
  gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(.72, "rgba(0,0,0,1)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  ox.save(); ox.translate(g.cx, g.cy); ox.scale(1, g.ry / g.rx); ox.translate(-g.cx, -g.cy);
  ox.fillStyle = gr; ox.beginPath(); ox.arc(g.cx, g.cy, g.rx * 1.35, 0, 6.283); ox.fill(); ox.restore();
  /* v67b: the centre is only dark. The person in front of it is the performer, standing in the projector light. */
  // words: what a line is, and how many since this began
  const ink = veil > .5 ? "20,20,20" : "150,146,138";
  if (labelA > .01) {
    ox.font = `${Math.max(13, Math.min(W, H) * .022)}px "EB Garamond", Garamond, Georgia, serif`; ox.textBaseline = "alphabetic";
    ox.fillStyle = `rgba(${ink},${labelA})`; ox.textAlign = "left";
    const y0 = H - (document.getElementById("ui").classList.contains("hidden") ? 28 : 78);
    ox.fillText(labelTxt[0], 22, y0 - 22); ox.fillStyle = `rgba(${ink},${labelA * .7})`; ox.fillText(labelTxt[1], 22, y0);
    const per = linesPer(); if (per >= 2) { ox.fillStyle = `rgba(${ink},${labelA * .7})`; ox.fillText("each line now carries about " + fmtN(per) + " lives", 22, y0 + 20); }
  }
  if (showCount && stage > 0) {
    ox.font = `${Math.max(11, Math.min(W, H) * .017)}px "EB Garamond", Garamond, Georgia, serif`; ox.textAlign = "right";
    let y = 30; ox.fillStyle = `rgba(${ink},.55)`; ox.fillText("since this began", W - 22, y); y += 20;
    for (let i = 0; i < CATS.length; i++) { if (arrived[i] <= 0 && counts[i] < 1) continue;
      ox.fillStyle = `rgba(${ink},.8)`; ox.fillText(CATS[i].k + "  " + fmtN(counts[i]), W - 22, y); y += 19; }
  }
}
let totalRate = 0;
const linesPer = () => Math.max(1, totalRate / CAP);

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now; const dt = rdt * speed;
  T += rdt; stageT += dt;
  if (!ending && stageT >= STAGES[stage].d && stage < STAGES.length - 1) setStage(stage + 1);
  const n = STAGES[stage].n;
  totalRate = 0;
  for (let i = 0; i < CATS.length; i++) {
    if (!ending && i < n) arrived[i] = Math.min(1, arrived[i] + dt / RAMP);
    if (ending) arrived[i] = Math.max(0, arrived[i] - rdt / 2.5);
    const r = CATS[i].rate * arrived[i]; totalRate += r; counts[i] += r * dt;
  }
  if (stageT > 12) labelA = Math.max(0, labelA - rdt / 4);
  // lines drawn this frame: one per life, until the cap; then each line carries more
  const drawRate = Math.min(totalRate, CAP);
  acc += drawRate * rdt; const k = Math.floor(acc); acc -= k;
  if (gl && k > 0) { spawn(k, T); flush(); }
  const per = linesPer();
  /* few lives: each line bright enough to follow with the eye. many: each one faint, and only the mass is seen */
  const alpha = Math.min(1, 0.9 / Math.pow(Math.max(drawRate, 1) / 20, 0.35)) * Math.min(6, Math.pow(per, 0.25));
  const veil = Math.max(0, Math.min(.97, (Math.log10(Math.max(1, totalRate)) - 4.3) / 2.6));
  if (gl) {
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(U.uT, T); gl.uniform1f(U.uLife, LIFE); gl.uniform1f(U.uTilt, TILT); gl.uniform1f(U.uAsp, ASP);
    gl.uniform1f(U.uHole, HOLE); gl.uniform1f(U.uCy, CY); gl.uniform1f(U.uAlpha, alpha); gl.uniform1f(U.uScale, 1.0);
    gl.drawArrays(gl.LINES, 0, N * 2);
  }
  drawOverlay(veil);
  requestAnimationFrame(frame);
}

// ---------- controls ----------
const note = t => { const e = document.getElementById("note"); e.textContent = t; e.style.display = "block"; clearTimeout(note.t); note.t = setTimeout(() => e.style.display = "none", 3500); };
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => setStage(+b.dataset.s));
document.getElementById("endB").onclick = () => { ending = true; labelA = 0; };
document.getElementById("spd").onchange = e => speed = +e.target.value;
document.getElementById("cap").onchange = e => CAP = +e.target.value;
document.getElementById("cntB").onclick = e => { showCount = !showCount; e.target.classList.toggle("on", showCount); };
document.getElementById("rst").onclick = restart;
document.getElementById("tog").onclick = () => document.getElementById("ui").classList.toggle("hidden");
addEventListener("keydown", e => {
  if (e.key >= "0" && e.key <= "5") setStage(+e.key);
  else if (e.key === "e") { ending = true; labelA = 0; }
  else if (e.key === "h") document.getElementById("ui").classList.toggle("hidden");
  else if (e.key === "c") { showCount = !showCount; document.getElementById("cntB").classList.toggle("on", showCount); }
});
restart(); requestAnimationFrame(frame);
</script>
</body>
</html>
