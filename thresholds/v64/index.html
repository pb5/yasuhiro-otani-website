<style>
/* layout: one black screen, a single line centered; a pre-start panel that disappears once the piece runs */
:root { --bg:#000; --ink:#8f897f; --dim:#5d5850; --ui:#4a4741; --ui-hi:#8f897f;
  --serif:"EB Garamond", Garamond, "Hoefler Text", "Times New Roman", serif;
  --mono: ui-monospace, Menlo, Consolas, monospace; color-scheme: dark; }
html, body { height:100%; }
body { background:var(--bg); color:var(--ink); overflow:hidden; margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none; user-select:none; touch-action:manipulation; }
/* everything that carries text stays inside the safe area, away from the camera housing */
#stage { position:fixed; top:env(safe-area-inset-top, 0px); left:env(safe-area-inset-left, 0px); right:env(safe-area-inset-right, 0px); bottom:env(safe-area-inset-bottom, 0px); overflow:hidden; }
/* the camera image stops short of the camera housing (safe area), so the black oval sits on black */
#cam { position:fixed; top:env(safe-area-inset-top, 0px); left:env(safe-area-inset-left, 0px); right:env(safe-area-inset-right, 0px); bottom:0;
  width:calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); height:calc(100% - env(safe-area-inset-top, 0px)); object-fit:cover; pointer-events:none;
  filter:grayscale(1) contrast(1.1) brightness(var(--camB, 0.35)); opacity:0; transition:opacity 1.2s ease; }
#cam.on { opacity:1; }
#cam.mirror { transform:scaleX(-1); }
#qr { position:fixed; left:calc(16px + env(safe-area-inset-left, 0px)); bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  width:min(22vmin, 180px); background:#cfc9bd; padding:8px; border-radius:4px; line-height:0; opacity:0; transition:opacity 1s ease; pointer-events:none; }
#qr.on { opacity:1; }
body.running.intro #qr.on { pointer-events:auto; cursor:pointer; }
#qr svg { width:100%; height:auto; display:block; }
body.withdraw #cam, body.withdraw #qr { opacity:0 !important; transition:opacity 2.5s ease; }
body.withdraw #fast { visibility:hidden !important; }
#line, #fast { text-shadow:0 0 14px #000, 0 0 4px #000; }
#line { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(80vw, 1200px); text-align:center; font-family:var(--serif);
  font-size:calc(clamp(17px, min(3.1vw, 5.2vh), 64px) * var(--scale, 1)); line-height:1.5; text-wrap:balance;
  opacity:0; transition-property:opacity; transition-timing-function:ease; }
#line.on { opacity:1; }
#pts, #nz, #fx { position:fixed; top:env(safe-area-inset-top, 0px); left:env(safe-area-inset-left, 0px); width:calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); height:calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); pointer-events:none; }
#nz { image-rendering:pixelated; }
body.withdraw #pts, body.withdraw #nz, body.withdraw #fx { opacity:0; transition:opacity 2.5s ease; }
#line[data-pos="left"] { left:8vw; transform:translate(0,-50%); text-align:left; width:min(70vw, 1100px); }
#line[data-pos="right"] { left:auto; right:8vw; transform:translate(0,-50%); text-align:right; width:min(70vw, 1100px); }
#line[data-pos="high"] { top:24%; }
#line[data-pos="low"] { top:74%; }
#line.word { font-size:calc(clamp(30px, min(6vw, 10vh), 120px) * var(--scale, 1)); letter-spacing:.08em; }
#line .w { display:inline-block; white-space:nowrap; }
#line .c { display:inline-block; white-space:pre; }
#fast { position:absolute; left:50%; top:50%; width:min(80vw, 1200px); text-align:center; font-family:var(--serif); text-wrap:balance;
  color:var(--ink); line-height:1.5; font-size:calc(clamp(17px, min(3.1vw, 5.2vh), 64px) * var(--scale, 1)); visibility:hidden; pointer-events:none; }
#meter { position:relative; width:min(280px, 80vw); height:6px; background:#141414; }
#meterFill { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--ui-hi); }
#meterThr { position:absolute; top:-4px; bottom:-4px; width:2px; left:0; background:#a33; }
#line .ghost { position:absolute; left:0; width:100%; pointer-events:none; color:var(--ink); }
#line .by { display:block; margin-top:1.3em; font-size:.5em; letter-spacing:.16em; color:var(--dim); }
#panel { position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:14px; font-family:var(--mono); font-size:13px; color:var(--ui);
  width:calc(100vw - 32px); max-width:640px; text-align:center; background:rgba(0,0,0,.82); border-radius:10px; padding:16px 0; box-sizing:border-box; }
#panel span { white-space:nowrap; }
[hidden] { display:none !important; }
#panel .row { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px 12px; }
#panel button { white-space:nowrap; font:inherit; color:var(--ui-hi); background:transparent; border:1px solid var(--ui); border-radius:4px;
  min-width:44px; min-height:44px; padding:0 14px; cursor:pointer; }
#panel button:focus-visible { outline:1px solid var(--ui-hi); outline-offset:3px; }
#mins { font-size:22px; color:var(--ui-hi); min-width:4ch; font-variant-numeric:tabular-nums; }
#hud { position:fixed; right:calc(14px + env(safe-area-inset-right, 0px)); bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  color:#5a5650; font:12px/1.4 var(--mono); text-align:right; opacity:0; transition:opacity .4s; white-space:pre; pointer-events:none; }
#hud.on { opacity:1; }
body.running { cursor:none; }
body.running #panel { display:none !important; }
#ver { font-size:11px; color:#3d3a35; }
@media (prefers-reduced-motion: reduce) { #line { transition-duration:.01s !important; } }
</style>

    /* the line is pulled out sideways in thin grains; with sound the grains are read from the wrong places */
    const st = 1 + 0.65 * Math.sqrt(age) + 1.2 * fxAmt, gw = Math.max(2, Math.round(W / 320)), cx = W / 2, jit = fxAmt * W * 0.025;
    for (let x0 = 0; x0 < W; x0 += gw) { const dx = cx + (x0 - cx) * st; if (dx + gw * st < 0 || dx > W) continue;
      const sxp = Math.min(W - gw, Math.max(0, x0 + (Math.random() - 0.5) * jit)), yj = fxAmt * (Math.random() - 0.5) * H * 0.02;
      X.drawImage(fxSrc, sxp, 0, gw, H, dx, yj, gw * st + 1, H); }
  }
  X.globalAlpha = 1;
}

function rollChaos(p) {
  chaos = null;
  if (plan.indexOf(p) < OPENING) return;   /* the opening lines are never broken */
  if (!chaosOn || Math.random() > CHAOS_P) return;
  makeChaos(FADE_IN * rnd(0.3, 1) + rnd(0, 0.5) * p.hold, p.hold);
}
function makeChaos(t0, hold) {
  const type = TYPES[Math.floor(Math.random() * TYPES.length)];
  chaos = { type, t0, dur: rnd(1.0, Math.max(1.5, hold * 0.45)), made: false, lastSwap: 0, rev: null };
}
function forceChaos() {
  if (!started || idx < 0) return;
  const lt = clock - plan[idx].start;
  if (chaos && lt >= chaos.t0) return;
  makeChaos(lt, plan[idx].hold); flash("chaos: " + chaos.type);
}
function applyChaos(lt) {
  if (!chaos) return;
  let p = Math.min(1, Math.max(0, (lt - chaos.t0) / chaos.dur));
  if (chaos.rev != null) {
    p = Math.max(0, 1 - (lt - chaos.rev) / REFORM_DUR);
    if (p <= 0) { const it = plan[idx].it; build(it); el.classList.toggle("word", !!it[2]); chaos = null; return; }
  } else if (p >= 1 && lt - chaos.t0 - chaos.dur > REFORM_WAIT && lt < FADE_IN + plan[idx].hold) { reform(lt); if (!chaos) return; }
  if (p <= 0) return;
  const e = p * p;
  switch (chaos.type) {
    case "scatter":
      for (const c of chars) { const r = c._r;
        c.style.transform = `translate(${r[0] * e * 34}vmin, ${r[1] * e * 26}vmin) rotate(${r[0] * e * 160}deg)`;
        c.style.opacity = 1 - e * (0.4 + r[2] * 0.6); c.style.filter = `blur(${e * r[3] * 6}px)`; }
      break;
    case "scramble": {
      const pool = chars.map(c => c._o);
      for (const c of chars) c.textContent = (c._r[2] < p && Math.random() < 0.35) ? pool[Math.floor(Math.random() * pool.length)] : (c._r[2] < p ? c.textContent : c._o);
      break; }
    case "dissolve":
      for (const c of chars) c.style.opacity = Math.max(0, Math.min(1, 1 - (p - c._r[2] * 0.85) * 6));
      break;
    case "smear":
      el.style.filter = `blur(${e * 7}px)`; el.style.letterSpacing = `${e * 0.9}em`;
      el.style.transform = `translate(-50%, -50%) scaleX(${1 + e * 0.5})`;
      break;
    case "overlay":
      if (!chaos.made) { chaos.made = true; chaos.ghosts = [];
        const n = 3 + Math.floor(Math.random() * 4);
        for (let i = 0; i < n; i++) {
          const g = document.createElement("div"); g.className = "ghost";
          g.innerHTML = ITEMS[Math.floor(Math.random() * ITEMS.length)][0];
          g.style.top = `${rnd(-40, 40)}%`; g.style.transform = `translateX(${rnd(-12, 12)}%)`; g.style.opacity = 0;
          g._a = rnd(0.35, 0.95); el.appendChild(g); chaos.ghosts.push(g);
        } }
      for (const g of chaos.ghosts) g.style.opacity = e * g._a;
      break;
    case "shuffle":
      if (lt - chaos.lastSwap > rnd(0.25, 0.9) && words.length > 1) { chaos.lastSwap = lt;
        const a = words[Math.floor(Math.random() * words.length)], b = words[Math.floor(Math.random() * words.length)];
        const t = a.innerHTML; a.innerHTML = b.innerHTML; b.innerHTML = t;
        chars = [...el.querySelectorAll(".c")]; }
      if (p >= 1) for (const c of chars) c.style.opacity = 0.7;
      break;
    case "mirror":
      el.style.transform = `translate(-50%, -50%) scaleX(${1 - 2 * Math.min(1, p * 1.6)})`;
      el.style.filter = `blur(${Math.sin(p * Math.PI) * 3}px)`;
      break;
  }
}

let SCALE = 1;
function setScale(d) { SCALE = Math.round(Math.max(0.6, Math.min(2.5, SCALE + d)) * 10) / 10;
  document.documentElement.style.setProperty("--scale", SCALE);
  document.getElementById("sizeLbl").textContent = Math.round(SCALE * 100) + "%"; flash("size " + Math.round(SCALE * 100) + "%"); }
function toggleChaos() { level = (level + 1) % LEVELS.length; CHAOS_P = LEVELS[level][1]; chaosOn = CHAOS_P > 0;
  document.getElementById("chaosBtn").textContent = "chaos: " + LEVELS[level][0]; flash("chaos " + LEVELS[level][0]); }
/* ===== 緩急: one switch drops the text into top speed ===== */
const fastEl = document.getElementById("fast");
const FRAGS = (() => { const w = []; for (const it of ITEMS) { const t = plain(it[0]).replace(/[—,.;:]/g, " ").split(/\s+/).filter(Boolean);
  w.push(...t); for (let i = 0; i + 2 < t.length; i += 3) w.push(t.slice(i, i + 2 + Math.floor(Math.random() * 2)).join(" ")); } return w; })();
let fastMode = false, autoTempo = false, autoUntil = 0, nextFlash = 0, wallT = 0;
function setFast(on) {
  fastMode = on; nextFlash = 0;
  el.style.visibility = on ? "hidden" : ""; fastIdx = cur0;
  if (!on) { fastEl.style.visibility = "hidden"; el.style.transitionDuration = "0.4s"; if (look && look.points && ptHas) el.style.visibility = "hidden"; }
}
function toggleTempo() { if (!started) return; autoUntil = 0; setFast(!fastMode); flash(fastMode ? "急" : "緩"); }
/* with sound the text runs ahead: whole sentences, in order, in the middle, one after another.
   The unit stays the sentence; only the time each one gets shrinks as the level rises.
   On lines that are drawn (noise, points, delay, stretch, construction) the processing does this instead. */
let fastIdx = 0;
function fastStep(ms) {
  if (ms < nextFlash) return;
  if (look && look.points && ptHas) { fastEl.style.visibility = "hidden"; nextFlash = ms + 200; return; }
  let it; for (let k = 0; k < plan.length; k++) { fastIdx = (Math.max(0, fastIdx) + 1) % plan.length; it = plan[fastIdx].it; if (!isBlack(it) && plain(it[0]).trim()) break; }
  fastEl.innerHTML = it[0]; fastEl.style.fontSize = ""; fastEl.style.transform = "translate(-50%, -50%)";
  fastEl.style.opacity = 1; fastEl.style.visibility = "visible";
  const over = micOn ? Math.max(0, Math.min(1, (levelDb - (floorDb + SENS)) / 18)) : 0.5;
  nextFlash = ms + 1500 - 1100 * over;
}
/* ===== camera: the hands and the filter, live, dim and grey behind the text. Nothing is recorded or sent. ===== */
const cam = document.getElementById("cam"), camBtn = document.getElementById("camBtn");
const CAMS = ["off", "back", "front"];
let camMode = 0, camStream = null, CAMB = 0.35;
async function cycleCam() {
  camMode = (camMode + 1) % CAMS.length;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  cam.classList.remove("on");
  if (CAMS[camMode] === "off") { cam.srcObject = null; camBtn.textContent = "camera: off"; return; }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: {
      facingMode: { ideal: CAMS[camMode] === "back" ? "environment" : "user" }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    cam.srcObject = camStream; await cam.play().catch(() => {});
    cam.classList.toggle("mirror", CAMS[camMode] === "front"); cam.classList.add("on");
    camBtn.textContent = "camera: " + CAMS[camMode];
  } catch (e) { camMode = 0; camBtn.textContent = "camera: not available here"; flash("camera not available here"); }
}
function setCamB(d) { CAMB = Math.round(Math.max(0.05, Math.min(1, CAMB + d)) * 100) / 100;
  document.documentElement.style.setProperty("--camB", CAMB);
  document.getElementById("camLbl").textContent = Math.round(CAMB * 100) + "%"; flash("camera " + Math.round(CAMB * 100) + "%"); }

/* ===== mic: the sound decides 緩 / 急 (level only, nothing is recorded or sent) ===== */
let micOn = false, analyser = null, buf = null, floorDb = -70, SENS = 12, levelDb = -100, belowSince = 0, calib = null, speedK = 1;
const micBtn = document.getElementById("micBtn");
async function startMic() {
  if (micOn) { calib = { until: performance.now() + 2500, vals: [] }; micBtn.textContent = "mic: listening to the room…"; return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume();
    analyser = ac.createAnalyser(); analyser.fftSize = 1024; buf = new Float32Array(analyser.fftSize);
    ac.createMediaStreamSource(s).connect(analyser);
    micOn = true; calib = { until: performance.now() + 2500, vals: [] };
    micBtn.textContent = "mic: listening to the room…";
  } catch (e) { micBtn.textContent = "mic: not available here"; flash("mic not available here"); }
}
function readLevel() {
  analyser.getFloatTimeDomainData(buf);
  let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  const db = 10 * Math.log10(s / buf.length + 1e-12);
  levelDb = db > levelDb ? db : levelDb * 0.85 + db * 0.15;
  return levelDb;
}
function updateMeter() {
  const pct = d => Math.max(0, Math.min(100, (d + 80) / 80 * 100)) + "%";
  document.getElementById("meterFill").style.width = pct(levelDb);
  document.getElementById("meterThr").style.left = pct(floorDb + SENS);
}
function setSens(d) { SENS = Math.max(3, Math.min(40, SENS + d)); document.getElementById("sensLbl").textContent = "+" + SENS + " dB"; flash("threshold +" + SENS + " dB"); }
function micStep(ts) {
  readLevel();
  if (calib) {
    calib.vals.push(levelDb);
    if (performance.now() > calib.until) {
      const v = calib.vals.sort((a, b) => a - b); floorDb = v[Math.floor(v.length / 2)] ?? -70; calib = null;
      micBtn.textContent = "mic: on (tap to recalibrate)";
    }
  }
  if (!panel.hidden) updateMeter();
  if (!started || paused || calib) return;
  const thr = floorDb + SENS;
  if (phase === "intro") return;   /* on the stage, only a tap on the QR starts the performance */
  if (levelDb > thr) {
    belowSince = 0; speedK = Math.max(0.25, 1 - (levelDb - thr) / 30);
    if (!fastMode) setFast(true);
  } else if (fastMode) {
    if (!belowSince) belowSince = ts;
    if (ts - belowSince > 250) { belowSince = 0; speedK = 1; setFast(false); }
  }
}
/* ===== QR for the audience's own phones: off / first minute / always ===== */
const QRM = ["intro", "always", "off"]; let qrMode = 0;
const qrEl = document.getElementById("qr");
function toggleQR() { qrMode = (qrMode + 1) % QRM.length; document.getElementById("qrBtn").textContent = "QR: " + QRM[qrMode]; flash("QR " + QRM[qrMode]); }
function updateQR() { const m = QRM[qrMode];
  qrEl.classList.toggle("on", !killed && (m === "always" || (m === "intro" && (!started || phase === "intro")))); }
qrEl.addEventListener("pointerup", e => { e.stopPropagation(); if (started && phase === "intro") toPerf(); });
function tick(ts) {
  document.body.classList.toggle("intro", started && phase === "intro");
  updateQR();
  if (micOn) micStep(ts);
  if (last !== null && started && !paused) {
    const dt = (ts - last) / 1000; clock += dt; wallT += dt;
    if (phase === "intro" && clock >= INTRO_WAIT && (IS_STAGE || micOn)) clock = INTRO_WAIT;
    if (phase === "intro" && clock >= PERF_START) phase = "perf";
    if (autoTempo && !micOn) {
      if (!fastMode && Math.random() < dt / 70) { autoUntil = wallT + rnd(1.5, 12); setFast(true); }
      else if (fastMode && autoUntil && wallT > autoUntil) { autoUntil = 0; setFast(false); }
    }
    render();
    const bi = plan.findIndex(p => isBlack(p.it));
    const inBlack = bi >= 0 && plan[bi].hold > 0 && clock >= plan[bi].start && clock < (plan[bi + 1] ? plan[bi + 1].start : END);
    document.body.classList.toggle("withdraw", inBlack || killed);
    if (fastMode && !inBlack) fastStep(ts);
  }
  last = ts; requestAnimationFrame(tick);
}
function toggleAuto() { autoTempo = !autoTempo; document.getElementById("tempoBtn").textContent = "tempo: " + (autoTempo ? "auto" : "manual"); flash("tempo " + (autoTempo ? "auto" : "manual")); }
requestAnimationFrame(tick);

async function keepAwake() { try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (started && document.visibilityState === "visible") keepAwake(); });

function start() {
  if (!started) { phase = "intro"; aboveSince = 0; }
  started = true; paused = false; panel.hidden = true; panel.style.display = "none"; document.body.classList.add("running"); keepAwake();
  try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch (e) {}
  flash("start\n" + status());
}
function togglePause() { if (!started) return; paused = !paused; flash((paused ? "pause" : "play") + "\n" + status()); }
/* ===== screen kill switch: everything goes dark, then one last line ===== */
let killed = false, killTimer = null;
function killScreen() {
  if (!started || killed) return;
  killed = true; paused = true; setFast(false); chaos = null; assemble = null;
  document.body.classList.add("withdraw");
  el.style.transitionDuration = "0.3s"; el.classList.remove("on");
  clearTimeout(killTimer);
  killTimer = setTimeout(() => {
    applyLook(null); build(["Thank you for listening."]); el.classList.remove("word");
    el.style.transitionDuration = "0s"; void el.offsetWidth;
    el.style.transitionDuration = "3s"; el.classList.add("on");
  }, 3000);
}
const BLACKS = [0, 1, 2, 3, 5]; let blackIdx = 3;
function cycleBlack() { if (started) return; blackIdx = (blackIdx + 1) % BLACKS.length; BLACK_MIN = BLACKS[blackIdx]; buildPlan();
  document.getElementById("blackBtn").textContent = "dark: " + (BLACK_MIN ? BLACK_MIN + " min" : "off"); flash("dark section " + (BLACK_MIN ? BLACK_MIN + " min" : "off")); }
function reset() {
  killed = false; clearTimeout(killTimer); document.body.classList.remove("withdraw");
  phase = "intro"; aboveSince = 0;
  started = false; paused = false; clock = 0; idx = -1; el.classList.remove("on"); setFast(false); autoUntil = 0; assemble = null; pendingAssemble = false;
  panel.hidden = false; panel.style.display = ""; document.body.classList.remove("running"); flash("reset");
}
function jump(dir) {
  let n = idx >= 0 ? idx + dir : plan.findIndex(p => p.start > clock) - (dir < 0 ? 1 : 0);
  n = Math.min(plan.length - 1, Math.max(0, n));
  phase = n < INTRO_N ? "intro" : "perf";
  clock = plan[n].start; idx = -2; render(); flash(status());
}
function setMins(d) { TOTAL_MIN = Math.max(5, Math.min(60, TOTAL_MIN + d)); buildPlan(); showMins(); }

document.getElementById("go").addEventListener("click", e => { e.stopPropagation(); start(); });
document.getElementById("minus").addEventListener("click", e => { e.stopPropagation(); setMins(-1); });
document.getElementById("plus").addEventListener("click", e => { e.stopPropagation(); setMins(1); });
document.getElementById("smaller").addEventListener("click", e => { e.stopPropagation(); setScale(-0.1); });
document.getElementById("bigger").addEventListener("click", e => { e.stopPropagation(); setScale(0.1); });
document.getElementById("chaosBtn").addEventListener("click", e => { e.stopPropagation(); toggleChaos(); });
document.getElementById("tempoBtn").addEventListener("click", e => { e.stopPropagation(); toggleAuto(); });
document.getElementById("reformBtn").addEventListener("click", e => { e.stopPropagation(); toggleReform(); });
document.getElementById("qrBtn").addEventListener("click", e => { e.stopPropagation(); toggleQR(); });
document.getElementById("blackBtn").addEventListener("click", e => { e.stopPropagation(); cycleBlack(); });
micBtn.addEventListener("click", e => { e.stopPropagation(); startMic(); });
document.getElementById("camBtn").addEventListener("click", e => { e.stopPropagation(); cycleCam(); });
document.getElementById("camDim").addEventListener("click", e => { e.stopPropagation(); setCamB(-0.05); });
document.getElementById("camBright").addEventListener("click", e => { e.stopPropagation(); setCamB(0.05); });
document.getElementById("sensMinus").addEventListener("click", e => { e.stopPropagation(); setSens(-1); });
document.getElementById("sensPlus").addEventListener("click", e => { e.stopPropagation(); setSens(1); });

/* touch: tap = pause, swipe = next/prev, double-tap = reset */
let tx = 0, ty = 0, lastTap = 0, tapTimer = null;
const stage = document.getElementById("stage");
let holdTimer = null, held = false;
stage.addEventListener("pointerdown", e => { tx = e.clientX; ty = e.clientY; held = false;
  clearTimeout(holdTimer); holdTimer = setTimeout(() => { held = true; forceChaos(); }, 600); });
stage.addEventListener("pointermove", e => { if (Math.abs(e.clientX - tx) > 15 || Math.abs(e.clientY - ty) > 15) clearTimeout(holdTimer); });
stage.addEventListener("contextmenu", e => e.preventDefault());
let multi = false;
stage.addEventListener("touchstart", e => { if (e.touches.length >= 2) { multi = true; clearTimeout(holdTimer); clearTimeout(tapTimer); killScreen(); } }, { passive: true });
stage.addEventListener("touchend", e => { if (e.touches.length === 0) setTimeout(() => { multi = false; }, 400); }, { passive: true });
stage.addEventListener("pointerup", e => {
  clearTimeout(holdTimer);
  if (!started || held || multi) return;
  const now = Date.now();
  if (killed) { if (now - lastTap < 400) { lastTap = 0; reset(); } else lastTap = now; return; }
  const dx = e.clientX - tx, dy = e.clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { jump(dx < 0 ? 1 : -1); return; }
  if (phase === "intro") { if (e.clientX < innerWidth * 0.3 && e.clientY > innerHeight * 0.6) toPerf(); return; }
  toggleTempo();
});

/* keyboard (laptop over HDMI) */
document.addEventListener("keydown", e => {
  const k = e.key;
  if (k === " ") { e.preventDefault(); started ? togglePause() : start(); }
  else if (k === "[" || k === "]") { if (!started) setMins(k === "]" ? 1 : -1); }
  else if (k === "ArrowRight") { if (started) jump(1); }
  else if (k === "ArrowLeft") { if (started) jump(-1); }
  else if (k.toLowerCase() === "r") reset();
  else if (k.toLowerCase() === "h") flash(status());
  else if (k === "-") setScale(-0.1);
  else if (k === "=" || k === "+") setScale(0.1);
  else if (k.toLowerCase() === "c") toggleChaos();
  else if (k.toLowerCase() === "x") forceChaos();
  else if (k === "Enter" || k.toLowerCase() === "q") { if (phase === "intro") toPerf(); else toggleTempo(); }
  else if (k.toLowerCase() === "a") toggleAuto();
  else if (k.toLowerCase() === "g") toggleReform();
  else if (k.toLowerCase() === "u") toggleQR();
  else if (k.toLowerCase() === "k" || k === "Escape") killScreen();
  else if (k.toLowerCase() === "m") startMic();
  else if (k.toLowerCase() === "v") cycleCam();
  else if (k.toLowerCase() === "b") setCamB(-0.05);
  else if (k.toLowerCase() === "n") setCamB(0.05);
  else if (k === ",") setSens(-1);
  else if (k === ".") setSens(1);
});
showMins();
</script>
