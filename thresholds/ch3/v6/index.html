<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Silver Relief III — 傾注の果て</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#aaa;font:12px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:14px;top:12px;z-index:3;letter-spacing:.2em;color:#888;pointer-events:none;transition:opacity .6s}
#hud small{display:block;letter-spacing:.05em;color:#555}
#panel{position:fixed;right:10px;top:10px;max-height:calc(100% - 20px);width:250px;overflow:auto;z-index:3;background:rgba(0,0,0,.72);border:1px solid #222;padding:10px 12px;transition:opacity .6s}
#panel h3{font-weight:400;color:#777;font-size:11px;letter-spacing:.2em;margin:12px 0 4px;border-top:1px solid #222;padding-top:8px}
#panel h3:first-child{margin-top:0;border:0;padding:0}
.row{display:flex;align-items:center;gap:6px;margin:2px 0}
.row label{width:84px;color:#999;white-space:nowrap;overflow:hidden}
.row input[type=range]{flex:1;min-width:0}
.row b{font-weight:400;width:34px;font-size:10px;color:#555;cursor:pointer;text-align:center;border:1px solid #333}
.row b.learn{color:#000;background:#ccc}
.row b.bound{color:#9c9;border-color:#363}
.row span{width:38px;text-align:right;color:#666;font-variant-numeric:tabular-nums}
select,button{background:#000;color:#ccc;border:1px solid #444;font:inherit;padding:3px 8px;margin:2px 2px 2px 0}
button.on{border-color:#aaa;color:#fff}
.hid{opacity:0;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="hn">傾注の果て</span><small id="hs"></small></div>
<div id="panel">
<h3>傾注の果て</h3>
<div><select id="mode">
 <option value="0" selected>下がるほど、同じものが見える</option>
 <option value="1">下がるほど、何も見えなくなる</option>
 <option value="2">下がるほど、周りが歪んで見える</option>
 <option value="3">下がるほど、過去が見える（囚われた過去）</option>
</select></div>
<div><label style="color:#999"><input type="checkbox" id="nest" checked> 入れ子（奥行き）</label> <label style="color:#999"><input type="checkbox" id="ret" checked> 網膜</label></div>
<div><button id="midiB">MIDI</button><span id="midiS" style="color:#666"></span></div>
<div><button id="reset">最初から</button><button id="mic">マイク</button><button id="fs">全画面</button></div>
<div><select id="outR"><option value="1920x1080">1920×1080</option><option value="2560x1440" selected>2560×1440</option><option value="3840x2160">3840×2160</option></select><button id="recB">● 書き出し</button></div>
<div id="recMsg" style="color:#888"></div>
<div id="sl"></div>
<div style="color:#555;margin-top:8px">H：表示を消す　F：全画面</div>
</div>

function mkT(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);if(F16)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return{t,f};}
let burns=[],laserT=4,laserRow=null,progT=0,prog=0,blT=8,blS=-1,lid=0,NST=null,nT=0,nS=0,nState=0;
const TX=[];let loaded=0;
(window.IMGDATA3||[]).forEach((src,i)=>{const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.MIRRORED_REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.MIRRORED_REPEAT);
  TX[i]=t;loaded++;};im.src=src;});

/* 音（任意） */
let ac=null,an=null,tb=null,lvl=0,recStream=null,fileEl=null;
$('mic').onclick=async()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();await ac.resume();
  const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  an=ac.createAnalyser();an.fftSize=2048;tb=new Float32Array(an.fftSize);ac.createMediaStreamSource(st).connect(an);recStream=st;$('mic').classList.add('on');}
  catch(e){$('mic').textContent='マイク不可';}};
$('fs').onclick=()=>{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d);};
let Z=0,T=0,last=0,ui=true,scale=1,ft=16;
$('reset').onclick=()=>{Z=0;nState=0;nT=0;progT=0;prog=0;burns=[];};
addEventListener('keydown',e=>{if(e.key==='l'||e.key==='L')fireLaser();});
function fireLaser(){
  if(!laserRow||laserRow.n<=0){const a=Math.random()*TAU,r=.32+Math.random()*.5;laserRow={x:Math.cos(a)*r*1.4,y:Math.sin(a)*r*.8,dx:-Math.sin(a)*.05,dy:Math.cos(a)*.05,n:3+Math.random()*6|0};}
  const R=.013+Math.random()*.008;burns.push([laserRow.x+(Math.random()-.5)*.01,laserRow.y+(Math.random()-.5)*.01,R,T]);
  laserRow.x+=laserRow.dx;laserRow.y+=laserRow.dy;laserRow.n--;if(burns.length>64)burns.shift();}$('mode').onchange=()=>{Z=0;};
addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H'){ui=!ui;$('panel').classList.toggle('hid',!ui);$('hud').classList.toggle('hid',!ui);}
  if(e.key==='f'||e.key==='F')$('fs').click();});
/* ---------- 書き出し：画と音を同じ瞬間から一本のmp4へ（MacのChrome、WebCodecs＋mp4-muxer） ---------- */
let rec=null,OUT=null;
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;};
const msg=t=>{$('recMsg').textContent=t;};
async function pickVideo(w,h){const br=w*h>5e6?120e6:w*h>3e6?80e6:50e6;
  for(const codec of["avc1.640034","avc1.640033","avc1.64002A","vp09.00.51.08","vp09.00.41.08"]){
    const cfg={codec,width:w,height:h,bitrate:br,framerate:30,bitrateMode:"variable",latencyMode:"quality"};
    if(codec.startsWith("avc"))cfg.avc={format:"avc"};
    try{const r=await VideoEncoder.isConfigSupported(cfg);if(r.supported)return{cfg:r.config,mux:codec.startsWith("avc")?"avc":"vp9"};}catch(e){}}
  return null;}
async function pickAudio(sr,ch){for(const[codec,mux]of[["mp4a.40.2","aac"],["opus","opus"]]){
  const cfg={codec,sampleRate:sr,numberOfChannels:ch,bitrate:codec==="opus"?256000:320000};
  try{const r=await AudioEncoder.isConfigSupported(cfg);if(r.supported)return{cfg:r.config,mux};}catch(e){}}return null;}
async function startRec(){
  if(!(window.VideoEncoder&&window.showSaveFilePicker)){msg('書き出しはMacのChromeで');return;}
  const [w,h]=$('outR').value.split('x').map(Number);
  const vid=await pickVideo(w,h);if(!vid){msg('この大きさは書き出せません');return;}
  const at=recStream?recStream.getAudioTracks()[0]:null;
  let aud=null;if(at&&window.AudioEncoder&&window.MediaStreamTrackProcessor){const st=at.getSettings();aud=await pickAudio(st.sampleRate||ac.sampleRate,Math.min(2,st.channelCount||2));}
  let fh;try{fh=await showSaveFilePicker({suggestedName:`silver-relief-${stamp()}.mp4`,types:[{description:'video',accept:{'video/mp4':['.mp4']}}]});}catch(e){msg('中止しました');return;}
  const writer=await fh.createWritable();
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.FileSystemWritableFileStreamTarget(writer),fastStart:false,firstTimestampBehavior:'offset',
    video:{codec:vid.mux,width:w,height:h,frameRate:30},audio:aud?{codec:aud.mux,sampleRate:aud.cfg.sampleRate,numberOfChannels:aud.cfg.numberOfChannels}:undefined});
  const ve=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>msg('映像: '+e.message)});ve.configure(vid.cfg);
  let ae=null,reader=null;
  if(aud){ae=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>console.warn(e)});ae.configure(aud.cfg);
    const tr=at.clone();reader=new MediaStreamTrackProcessor({track:tr}).readable.getReader();
    (async()=>{for(;;){const{value,done}=await reader.read();if(done||!rec){if(value)value.close();break;}if(ae.state==='configured')ae.encode(value);value.close();}tr.stop();})();}
  OUT=[w,h];
  if(fileEl){fileEl.currentTime=0;fileEl.play();}
  rec={ve,ae,reader,muxer,writer,t0:performance.now(),n:0,drop:0};
  $('recB').classList.add('on');
  rec.iv=setInterval(()=>{if(!rec)return;const s=Math.floor((performance.now()-rec.t0)/1000);$('recB').textContent=`■ 停止 ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;msg(`${w}×${h} ${vid.mux==='avc'?'H.264':'VP9'}${aud?'':'（音なし）'}`+(rec.drop?`・落${rec.drop}`:''));},500);
}
function recFrame(){const t=(performance.now()-rec.t0)/1000,k=Math.floor(t*30);if(k<rec.n)return;
  if(rec.ve.encodeQueueSize>4){rec.drop++;rec.n=k+1;return;}
  const f=new VideoFrame(cv,{timestamp:Math.round(k*1e6/30),duration:Math.round(1e6/30)});rec.ve.encode(f,{keyFrame:k%60===0});f.close();rec.n=k+1;}
async function stopRec(){if(!rec)return;const r=rec;rec=null;clearInterval(r.iv);
  $('recB').classList.remove('on');$('recB').textContent='● 書き出し';msg('ファイルを閉じています…');
  try{if(r.reader)await r.reader.cancel();}catch(e){}
  await r.ve.flush();if(r.ae&&r.ae.state==='configured')await r.ae.flush();
  r.muxer.finalize();await r.writer.close();r.ve.close();if(r.ae)r.ae.close();OUT=null;
  msg('保存しました'+(r.drop?`（${r.drop}コマ落ち）`:''));}
$('recB').onclick=()=>rec?stopRec():startRec();
const NAMES=['下がるほど、同じものが見える','下がるほど、何も見えなくなる','下がるほど、周りが歪んで見える','下がるほど、過去が見える'];
function frame(ms){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(ms-last)/1000||0);ft+=((ms-last)-ft)*.05;last=ms;T+=dt;
  if(!OUT){if(ft>21)scale=Math.max(.45,scale*.985);else if(ft<15)scale=Math.min(1,scale*1.005);}
  for(const k in P){const p=P[k];p.cur+=(p.tgt-p.cur)*Math.min(1,dt*2);}
  if(an){an.getFloatTimeDomainData(tb);let s=0;for(const x of tb)s+=x*x;const l=clamp((10*Math.log10(s/tb.length+1e-12)+60)/50,0,1);lvl+=(l-lvl)*(l>lvl?.3:.05);}
  const a=an?get('amt')*lvl:0;
  Z+=dt*get('back')*(1+a);
  if(loaded<3)return;
  const dpr=Math.min(2,devicePixelRatio||1),W=OUT?OUT[0]:Math.max(2,innerWidth*dpr*scale|0),H=OUT?OUT[1]:Math.max(2,innerHeight*dpr*scale|0);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  if(!fb||fb.w!==W||fb.h!==H){fb={w:W,h:H,a:[mkT(W,H),mkT(W,H)],i:0};NST=mkT(W,H);}
  /* 入れ子の段取り：間隔ごとに今の画を写し取り、それが画面いっぱいから中心の窓まで縮んでいく */
  const nestOn=$('nest').checked;
  if($('ret').checked){blT-=dt;if(blT<=0&&blS<0){blS=0;blT=get('blink')*(.6+.8*Math.random());}}
  if($('ret').checked){progT+=dt;prog=Math.min(1,progT/get('prog'));
    if(progT>get('prog')+8){progT=0;prog=0;blS=0;burns=[];}
    /* 増殖が進むと、レーザーで焼く。何発かずつ、列をなして周辺から。音が強いときも撃つ */
    laserT-=dt*get('laser')*(prog>.25&&prog<.92?1:0);
    if(laserT<=0||(an&&lvl>.6&&Math.random()<dt*3*get('laser')&&prog>.2&&prog<.92)){fireLaser();laserT=.35+Math.random()*(laserRow&&laserRow.n>0?.3:3);}}    /* 失明の闇が続いたあと、まばたきで新しい目が開く */
  if(blS>=0){blS+=dt;lid=blS<.12?blS/.12:Math.max(0,1-(blS-.16)/.26);if(blS>.45){blS=-1;lid=0;}}
  if(nestOn){nT+=dt;if(nT>get('nper')){nT=0;nState=1;nS=0;
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,fb.a[1-fb.i].f);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,NST.f);gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.LINEAR);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,null);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,null);}}
  let nr=get('nsize')*.5;
  if(nState===1){nS+=dt;const x=Math.min(1,nS/get('nback')),e=x*x*(3-2*x);nr=Math.exp(Math.log(.5*Math.hypot(W/H,1))*(1-e)+Math.log(get('nsize')*.5)*e);if(x>=1)nState=2;}
  const A=fb.a[fb.i],B=fb.a[1-fb.i];
  gl.useProgram(pr);gl.bindFramebuffer(gl.FRAMEBUFFER,A.f);
  gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,B.t);gl.uniform1i(U.PV,2);
  gl.activeTexture(gl.TEXTURE3);gl.bindTexture(gl.TEXTURE_2D,NST.t);gl.uniform1i(U.NS,3);gl.uniform1f(U.uProg,prog);{const a=new Float32Array(256);burns.forEach((b,i)=>a.set(b,i*4));gl.uniform4fv(UBN,a);gl.uniform1i(UNB,burns.length);}gl.uniform1f(U.uRet,$('ret').checked?1:0);gl.uniform1f(U.uVes,get('ves'));gl.uniform1f(U.uDisc,get('disc'));gl.uniform1f(U.uNest,nestOn&&nState>0?1:0);gl.uniform1f(U.uNr,nr);
  gl.uniform1f(U.uK,1+.06*(1+get('back')*20)*(1+a)*Math.min(1,dt*30));
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,TX[0]);gl.uniform1i(U.I0,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,TX[1]);gl.uniform1i(U.I1,1);
  gl.activeTexture(gl.TEXTURE4);gl.bindTexture(gl.TEXTURE_2D,TX[2]);gl.uniform1i(U.I2,4);
  gl.uniform2f(U.r,W,H);gl.uniform1f(U.uZ,Z);gl.uniform1f(U.uMode,+$('mode').value);
  gl.uniform1f(U.uMass,get('mass')*(1+.8*a));gl.uniform1f(U.uPull,get('pull')*(1+a));gl.uniform1f(U.uCore,get('core'));
  gl.uniform1f(U.uRel,get('rel'));gl.uniform1f(U.uLamp,T*get('lamp')+2.2);gl.uniform1f(U.uT,T);
  gl.uniform1f(U.uBright,get('bright'));gl.uniform1f(U.uMid,get('mid'));gl.uniform1f(U.uGrain,get('grain'));
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.useProgram(pb);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,A.t);gl.uniform1i(UBA,0);gl.uniform2f(UBR,W,H);
  gl.uniform1f(UBX.uBright,get('bright'));gl.uniform1f(UBX.uMid,get('mid'));gl.uniform1f(UBX.uGrain,get('grain'));gl.uniform1f(UBX.uT,T);gl.uniform1f(UBX.uNr,nr);gl.uniform1f(UBX.uLid,lid);gl.uniform1f(UBX.uNon,nestOn&&nState>0?1:0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);fb.i=1-fb.i;
  if(rec)recFrame();
  if(ui){$('hn').textContent='傾注の果て — '+NAMES[+$('mode').value];
    $('hs').textContent=`${(1000/ft).toFixed(0)} fps・解像度 ${(scale*100).toFixed(0)}%・下がった距離 ×${Math.exp(Z).toExponential(1)}`;
    for(const k in P)P[k].span.textContent=P[k].cur.toFixed(2);}
}
requestAnimationFrame(frame);
