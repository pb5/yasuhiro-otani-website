<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Silver Relief III — 傾注の果て（絡み）</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#aaa;font:12px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:14px;top:12px;z-index:3;letter-spacing:.2em;color:#888;pointer-events:none;transition:opacity .6s}
#hud small{display:block;letter-spacing:.05em;color:#555}
#panel{position:fixed;right:10px;top:10px;max-height:calc(100% - 20px);width:250px;overflow:auto;z-index:3;background:rgba(0,0,0,.72);border:1px solid #222;padding:10px 12px;transition:opacity .6s}
#panel h3{font-weight:400;color:#777;font-size:11px;letter-spacing:.2em;margin:12px 0 4px;border-top:1px solid #222;padding-top:8px}
#panel h3:first-child{margin-top:0;border:0;padding:0}
.row{display:flex;align-items:center;gap:6px;margin:2px 0}
.row label{width:84px;color:#999;white-space:nowrap;overflow:hidden}
.row input[type=range]{flex:1;min-width:0}
.row b{font-weight:400;width:34px;font-size:10px;color:#555;cursor:pointer;text-align:center;border:1px solid #333}
.row b.learn{color:#000;background:#ccc}
.row b.bound{color:#9c9;border-color:#363}
.row span{width:38px;text-align:right;color:#666;font-variant-numeric:tabular-nums}
select,button{background:#000;color:#ccc;border:1px solid #444;font:inherit;padding:3px 8px;margin:2px 2px 2px 0}
button.on{border-color:#aaa;color:#fff}
.hid{opacity:0;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="hn">傾注の果て</span><small id="hs"></small></div>
<div id="panel">
<h3>傾注の果て</h3>
<div><select id="mode">
 <option value="0" selected>下がるほど、同じものが見える</option>
 <option value="1">下がるほど、何も見えなくなる</option>
 <option value="2">下がるほど、周りが歪んで見える</option>
 <option value="3">下がるほど、過去が見える（囚われた過去）</option>
</select></div>
<div><label style="color:#999"><input type="checkbox" id="nest"> 入れ子（奥行き）</label></div>
<div><button id="midiB">MIDI</button><span id="midiS" style="color:#666"></span></div>
<div><button id="reset">最初から</button><button id="mic">マイク</button><button id="fs">全画面</button></div>
<div><select id="outR"><option value="1920x1080">1920×1080</option><option value="2560x1440" selected>2560×1440</option><option value="3840x2160">3840×2160</option></select><button id="recB">● 書き出し</button></div>
<div id="recMsg" style="color:#888"></div>
<div id="sl"></div>
<h3>線香花火</h3><div style="color:#666">音の輪はマイクを入れると働きます（ヘッドフォンで。スピーカーだとハウリングします）</div>
<div class="row"><label>一本の長さ</label><input id="kT" type="range" min="20" max="240" value="70"><span id="kTv"></span></div>
<div class="row"><label>玉の大きさ</label><input id="kS" type="range" min="0.15" max="3" step="0.01" value="1"><span id="kSv"></span></div>
<div class="row"><label>火花の量</label><input id="kN" type="range" min="0" max="2" step="0.01" value="1"><span></span></div>
<div class="row"><label>火花の重力</label><input id="kG" type="range" min="0.2" max="3" step="0.01" value="1"><span></span></div>
<div class="row"><label>色 銀↔火</label><input id="kC" type="range" min="0" max="1" step="0.01" value="0"><span></span></div>
<div class="row"><label>火花の残像</label><input id="kP" type="range" min="0" max="0.95" step="0.01" value="0.55"><span></span></div>
<div class="row"><label>落ちた後の闇</label><input id="kD" type="range" min="0" max="60" value="12"><span id="kDv"></span></div>
<div><label style="color:#999"><input type="checkbox" id="kstr" checked> こより</label> <label style="color:#999"><input type="checkbox" id="ksnd"> はぜる音</label></div>
<div><button data-k="0">蕾</button><button data-k="1">牡丹</button><button data-k="2">松葉</button><button data-k="3">柳</button><button data-k="4">散り菊</button><button id="kdrop">落とす</button></div>
<div style="color:#555">1〜5：段階　Space：落とす</div>
<div style="color:#555;margin-top:8px">H：表示を消す　F：全画面</div>
</div>

    AUD.tick(dt,{branchN,figHeat:fig.heat,strataHeat,beadHeat,mL:mL(),beat:Math.hypot(dX-c2px.x,dY-c2px.y)/H});
  }
  function drawFig(sc){const x=fig.x,y=topY(x),r=4.5*sc,j=fig.heat*.6*sc;
    const jx=()=>(Math.random()-.5)*j;
    gL.strokeStyle=`rgba(225,225,230,${get('v_fig')})`;gL.lineWidth=Math.max(1,1.1*sc);
    const by=y-r*2.6;gL.beginPath();gL.arc(x+jx(),by-r+jx(),r,0,6.283);gL.stroke();
    const sw=Math.sin(fig.ph)*r*.9;
    gL.beginPath();gL.moveTo(x,by);gL.lineTo(x+sw+jx(),y);gL.moveTo(x,by);gL.lineTo(x-sw+jx(),y);
    gL.moveTo(x,by-r);gL.lineTo(x+r*2.2*Math.sign(Math.cos(fig.ph*.13))+jx(),by-r*3.2+jx());gL.stroke();}
  let pat=null;
  function mkPat(){const c=document.createElement('canvas');c.width=c.height=192;const g=c.getContext('2d');
    for(let i=0;i<420;i++){const x=Math.random()*192,y=Math.random()*192,r=2+Math.random()*7;
      g.strokeStyle=`rgba(255,255,255,${.12+Math.random()*.25})`;g.lineWidth=.8;g.beginPath();g.arc(x,y,r,0,6.283);g.stroke();
      g.fillStyle=`rgba(0,0,0,${Math.random()*.35})`;g.beginPath();g.arc(x+r*.3,y+r*.3,r*.6,0,6.283);g.fill();}
    pat=gL.createPattern(c,'repeat');}
  function draw(){
    const sc=v('kS')*H/1080;
    gE.globalCompositeOperation='destination-out';gE.fillStyle=`rgba(0,0,0,${1-v('kP')})`;gE.fillRect(0,0,W,H);
    gL.clearRect(0,0,W,H);
    /* 層：過去が肉のように積もる。周期ごとに一枚、古いほど下 */
    const vs=get('v_strata');
    if(vs>0){if(!pat)mkPat();
      let prev=new Float32Array(NC+1);for(let i=0;i<=NC;i++)prev[i]=H;
      layers.forEach((L,li)=>{const cur=new Float32Array(NC+1);
        for(let i=0;i<=NC;i++){const a=L[Math.min(NC-1,i)],b=L[Math.max(0,i-1)];cur[i]=prev[i]-(a+b)*.5*NC*H*.12;}
        gL.save();gL.beginPath();gL.moveTo(0,prev[0]);for(let i=0;i<=NC;i++)gL.lineTo(i/NC*W,cur[i]);for(let i=NC;i>=0;i--)gL.lineTo(i/NC*W,prev[i]);gL.closePath();gL.clip();
        const age=(layers.length-1-li)/Math.max(1,layers.length-1),tone=95-age*55+(li%2)*18;
        gL.globalAlpha=vs;gL.fillStyle=`rgb(${tone},${tone},${tone+4})`;gL.fillRect(0,0,W,H);
        gL.globalAlpha=vs*(.5+.4*(1-age));gL.fillStyle=pat;gL.fillRect(0,0,W,H);gL.restore();
        gL.globalAlpha=vs*(.35+.5*Math.min(1,strataHeat*.5));gL.strokeStyle='rgba(235,235,240,1)';gL.lineWidth=Math.max(1,sc);
        gL.beginPath();for(let i=0;i<=NC;i++)gL[i?'lineTo':'moveTo'](i/NC*W,cur[i]);gL.stroke();gL.globalAlpha=1;
        prev=cur;});}
    if(get('v_fig')>0)drawFig(sc);
    if($('kstr').checked&&state!=='dark'){
      const top=tipY-170*sc,gr=gL.createLinearGradient(0,top,0,tipY);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,`rgba(150,145,140,${state==='burn'?.6:Math.max(0,.5-dropT*.4)})`);
      gL.strokeStyle=gr;gL.lineWidth=Math.max(1,1.2*sc);gL.beginPath();gL.moveTo(W*.5-2*sc,top);gL.quadraticCurveTo(W*.5+3*sc,tipY-80*sc,tipX,tipY);gL.stroke();}
    /* 火花・玉 */
    gE.globalCompositeOperation='lighter';const vsp=get('v_spark');
    if(vsp>0)for(const s of sparks){const k=1-s.age/s.life,heat=Math.min(1,k*1.3)*s.br;
      gE.strokeStyle=col(heat,Math.min(1,k*1.5)*s.br*vsp);gE.lineWidth=Math.max(.5,s.w*sc*1.6*k+.4);gE.beginPath();gE.moveTo(s.px,s.py);gE.lineTo(s.x,s.y);gE.stroke();}
    const vb=get('v_bead');
    if(state!=='dark'&&bead.r>0&&vb>0){
      gE.globalAlpha=vb;
      const r=bead.r,ang=-(state==='burn'?th:thDrop*.5),mm=Math.min(1,mB/.35);
      const rx=r*(1-.22*bead.sag+.18*wx)*(1+.12*wob),ry=r*(1+bead.sag)*(1-.12*wob);
      const hg=gE.createRadialGradient(bead.x,bead.y,0,bead.x,bead.y,r*7);
      hg.addColorStop(0,col(.9,.55*beadLight+.1));hg.addColorStop(.15,col(.6,.22*beadLight));hg.addColorStop(.4,col(.3,.05));hg.addColorStop(1,'rgba(0,0,0,0)');
      gE.fillStyle=hg;gE.beginPath();gE.arc(bead.x,bead.y,r*7,0,6.283);gE.fill();
      gE.globalCompositeOperation='source-over';
      if(bead.neck>.1&&state==='burn'){const nx=Math.cos(th),ny=-Math.sin(th),tx=bead.x-Math.sin(th)*ry*.8,ty=bead.y-Math.cos(th)*ry*.8;
        gE.fillStyle=col(.75,.95);gE.beginPath();gE.moveTo(tipX+nx*bead.neck*.5,tipY+ny*bead.neck*.5);gE.lineTo(tx+nx*rx*.7,ty+ny*rx*.7);gE.lineTo(tx-nx*rx*.7,ty-ny*rx*.7);gE.lineTo(tipX-nx*bead.neck*.5,tipY-ny*bead.neck*.5);gE.fill();}
      gE.save();gE.translate(bead.x,bead.y);gE.rotate(ang);gE.scale(rx/r,ry/r);
      const bg=gE.createRadialGradient(0,r*.25,0,0,0,r);
      bg.addColorStop(0,col(.12,1));bg.addColorStop(.55,col(.22,1));bg.addColorStop(.82,col(.7*beadLight,1));bg.addColorStop(1,col(beadLight,1));
      gE.fillStyle=bg;gE.beginPath();gE.arc(0,0,r,0,6.283);gE.fill();
      gE.globalCompositeOperation='lighter';const now=performance.now()*.001;
      for(let i=0;i<4;i++){const a=now*(.7+i*.37)+i*1.7,rr=r*(.82+.12*Math.sin(now*3.1+i));
        gE.fillStyle=col(1,(.5+.5*Math.sin(now*9+i*2.3))*beadLight);gE.beginPath();gE.arc(Math.cos(a)*rr,Math.sin(a)*rr,Math.max(.5,r*.13),0,6.283);gE.fill();}
      gE.restore();gE.globalAlpha=1;}}
  function size(w,h){if(w!==W||h!==H){W=cE.width=cL.width=w;H=cE.height=cL.height=h;fig.x=fig.x||w*.15;}}
  function go(k){state='burn';t=PH[k]*v('kT')+.01;}
  function drop(){if(state==='burn')t=PH[5]*v('kT');}
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>go(+b.dataset.k));$('kdrop').onclick=drop;
  addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();drop();}else if(e.key>='1'&&e.key<='5')go(+e.key-1);});
  return {cE,cL,step,draw,size,
    lensC:()=>{const d=hget(get('d_delay'));return d;},
    c2:()=>({x:(c2px.x-W/2)/H,y:(H/2-c2px.y)/H,m:mL()}),
    hist:(n,dtH)=>{const a=new Float32Array(n*4);for(let i=0;i<n;i++){const s=hget(i*dtH);a[i*4]=s.x;a[i*4+1]=s.y;a[i*4+2]=s.l;}return a;},
    bead:()=>bead,
    label:()=>(state==='burn'?PN[phase().p]:state==='drop'?'落ちる':'闇')+`　玉 ${mB.toFixed(2)}・層 ${mL().toFixed(2)}・火花 ${(1-mB-mL()).toFixed(2)}`,
    sw:()=>sw};
})();

const NAMES=['下がるほど、同じものが見える','下がるほど、何も見えなくなる','下がるほど、周りが歪んで見える','下がるほど、過去が見える'];
function frame(ms){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(ms-last)/1000||0);ft+=((ms-last)-ft)*.05;last=ms;T+=dt;
  if(!OUT){if(ft>21)scale=Math.max(.45,scale*.985);else if(ft<15)scale=Math.min(1,scale*1.005);}
  for(const k in P){const p=P[k];p.cur+=(p.tgt-p.cur)*Math.min(1,dt*2);}
  if(an){an.getFloatTimeDomainData(tb);let s=0;for(const x of tb)s+=x*x;const l=clamp((10*Math.log10(s/tb.length+1e-12)+60)/50,0,1);lvl+=(l-lvl)*(l>lvl?.3:.05);}
  const a=an?get('amt')*lvl:0;
  Z+=dt*get('back')*(1+a);
  if(loaded<2)return;
  const dpr=Math.min(2,devicePixelRatio||1),W=OUT?OUT[0]:Math.max(2,innerWidth*dpr*scale|0),H=OUT?OUT[1]:Math.max(2,innerHeight*dpr*scale|0);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  if(!fb||fb.w!==W||fb.h!==H){fb={w:W,h:H,a:[mkT(W,H),mkT(W,H)],i:0};NST=mkT(W,H);}
  /* 入れ子の段取り：間隔ごとに今の画を写し取り、それが画面いっぱいから中心の窓まで縮んでいく */
  const nestOn=$('nest').checked;
  if(nestOn){nT+=dt;if(nT>get('nper')){nT=0;nState=1;nS=0;
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,fb.a[1-fb.i].f);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,NST.f);gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.LINEAR);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,null);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,null);}}
  let nr=get('nsize')*.5;
  if(nState===1){nS+=dt;const x=Math.min(1,nS/get('nback')),e=x*x*(3-2*x);nr=Math.exp(Math.log(.5*Math.hypot(W/H,1))*(1-e)+Math.log(get('nsize')*.5)*e);if(x>=1)nState=2;}
  ENT.size(W,H);ENT.step(dt,an?lvl:0);ENT.draw();
  const lc=ENT.lensC(),c2=ENT.c2(),scK=+$('kS').value*H/1080;
  const A=fb.a[fb.i],B=fb.a[1-fb.i];
  gl.useProgram(pr);gl.bindFramebuffer(gl.FRAMEBUFFER,A.f);
  gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,B.t);gl.uniform1i(U.PV,2);
  gl.activeTexture(gl.TEXTURE3);gl.bindTexture(gl.TEXTURE_2D,NST.t);gl.uniform1i(U.NS,3);gl.uniform1f(U.uNest,nestOn&&nState>0?1:0);gl.uniform1f(U.uNr,nr);
  gl.uniform1f(U.uK,1+.06*(1+get('back')*20)*(1+a)*Math.min(1,dt*30));
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,TX[0]);gl.uniform1i(U.I0,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,TX[1]);gl.uniform1i(U.I1,1);
  gl.uniform2f(U.r,W,H);gl.uniform1f(U.uZ,Z);gl.uniform1f(U.uMode,+$('mode').value);
  gl.uniform1f(U.uMass,get('mass')*(1+.8*a));gl.uniform1f(U.uPull,get('pull')*(1+a));gl.uniform1f(U.uCore,get('core'));
  gl.uniform1f(U.uRel,get('rel'));gl.uniform1f(U.uLamp,T*get('lamp')+2.2);gl.uniform1f(U.uT,T);
  gl.uniform1f(U.uBright,get('bright'));gl.uniform1f(U.uMid,get('mid'));gl.uniform1f(U.uGrain,get('grain'));
  gl.uniform2f(U.uC,lc.x,lc.y);gl.uniform1f(U.uRc,lc.m>1e-3?8*scK*Math.cbrt(Math.min(1,lc.m/.35))*1.05/H:0);gl.uniform1f(U.uBM,Math.min(1,lc.m/.35)*get('e_bead'));gl.uniform1f(U.uFade,1);gl.uniform1f(U.uSw,ENT.sw());
  gl.uniform2f(U.uC2,c2.x,c2.y);gl.uniform1f(U.uBM2,c2.m*get('e_strata')*.5);gl.uniform1f(U.uMo,get('v_moire'));gl.uniform1f(U.uVw,get('v_world'));
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.useProgram(pb);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,A.t);gl.uniform1i(UBA,0);gl.uniform2f(UBR,W,H);
  const up=(unit,tex,cvs,loc)=>{gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cvs);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);gl.uniform1i(loc,unit);};
  up(1,SPT,ENT.cE,UBS);up(2,LTT,ENT.cL,UBL);
  gl.uniform4fv(UBH,ENT.hist(64,1/12));gl.uniform1f(UBD,1/12);gl.uniform1f(UBC,get('d_c'));gl.uniform1f(UBE,get('e_light'));

    $('hs').textContent=`${(1000/ft).toFixed(0)} fps・解像度 ${(scale*100).toFixed(0)}%・下がった距離 ×${Math.exp(Z).toExponential(1)}`;
    for(const k in P)P[k].span.textContent=P[k].cur.toFixed(2);}
}
requestAnimationFrame(frame);
</script></body></html>
