<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thresholds of Presence — ink (study)</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px/1.4 Georgia,serif;color:#999}
canvas{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;transition:opacity .4s}
#ui.hidden{opacity:0;pointer-events:none}
button{background:#111;color:#bbb;border:1px solid #333;border-radius:4px;padding:5px 9px;font:inherit;cursor:pointer}
button.on{border-color:#aaa;color:#fff}
#fl{position:fixed;left:50%;top:14px;transform:translateX(-50%);opacity:0;transition:opacity .5s}
#tg{position:fixed;right:10px;top:10px}
</style></head><body>
<canvas id="c"></canvas>
<div id="fl"></div>
<button id="tg">≡</button>
<div id="ui">
  <button id="mic">Mic</button><button id="sim">擬似音</button>
  <span>流れ</span><input id="fw" type="range" min="0" max="100" value="45">
  <span>戻り</span><input id="lf" type="range" min="0" max="100" value="20">
  <button id="soft">滲む</button><button id="clear">白紙に戻す</button><button id="fs">全画面</button>
</div>
<script>
/* Ink.
   No camera, no difference. Two things only:
   1. accumulation — every frame a few curves are laid down, each almost invisible. tone is only how many have passed.
      the curves hang between points that drift on slow, unrelated cycles; the room's sound moves them.
   2. ink that flows — each frame every place takes the darker of itself and the place the flow brings to it.
      light never paints over dark: the black can only spread, be carried, be drawn out into threads.
   The paper comes back very slowly, so the black is never finished and never one black. */
const c = document.getElementById("c"), gl = c.getContext("webgl", { antialias: true, alpha: false, preserveDrawingBuffer: false });
const hf = gl.getExtension("OES_texture_half_float"); gl.getExtension("OES_texture_half_float_linear"); gl.getExtension("EXT_color_buffer_half_float");
const FT = hf ? hf.HALF_FLOAT_OES : gl.UNSIGNED_BYTE;
const QV = `attribute vec2 p; varying vec2 uv; void main(){ uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
const NOISE = `
vec3 m289(vec3 x){ return x - floor(x * (1. / 289.)) * 289.; } vec2 m289(vec2 x){ return x - floor(x * (1. / 289.)) * 289.; }
vec3 perm(vec3 x){ return m289(((x * 34.) + 1.) * x); }
float sn(vec2 v){ const vec4 C = vec4(.211324865, .366025404, -.577350269, .024390244);
  vec2 i = floor(v + dot(v, C.yy)), x0 = v - i + dot(i, C.xx); vec2 i1 = x0.x > x0.y ? vec2(1., 0.) : vec2(0., 1.);
  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1; i = m289(i);
  vec3 p = perm(perm(i.y + vec3(0., i1.y, 1.)) + i.x + vec3(0., i1.x, 1.));
  vec3 m = max(.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.); m = m * m; m = m * m;
  vec3 x = 2. * fract(p * C.www) - 1., h = abs(x) - .5, ox = floor(x + .5), a0 = x - ox;
  m *= 1.79284291 - .85373472 * (a0 * a0 + h * h);
  vec3 g; g.x = a0.x * x0.x + h.x * x0.y; g.yz = a0.yz * x12.xz + h.yz * x12.yw; return 130. * dot(m, g); }
vec2 sn2(vec2 v){ return vec2(sn(v), sn(v + 17.3)); }`;
/* the flow: ink is pulled along a noise field and around two drifting centres; the darker always wins */
const FLOW = `precision highp float; varying vec2 uv; uniform sampler2D uPrev; uniform vec2 uRes; uniform float uT, uFlow, uLift; uniform vec4 uV;` + NOISE + `
  void main(){
    vec2 px = 1. / uRes, co = uv * uRes;
    vec2 d = sn2(co * .0012 + uT * .02) * 1.0 + sn2(co * .006 - uT * .03) * .5;
    float asp = uRes.x / uRes.y;
    for (int k = 0; k < 2; k++) {                       // two slow whirlpools
      vec2 ce = k == 0 ? uV.xy : uV.zw, e = (uv - ce) * vec2(asp, 1.); float r = length(e);
      d += vec2(-e.y, e.x) / (r + .04) * exp(-r * r / .08) * (k == 0 ? .9 : -.7) * .15;
    }
    vec2 q = uv + d * px * uFlow;
    float a = texture2D(uPrev, uv).r, b = texture2D(uPrev, q).r;
    float ink = min(a, b);                                // light never paints over dark
    ink = mix(ink, 1., uLift);                            // the paper comes back, slowly
    gl_FragColor = vec4(ink, ink, ink, 1.);
  }`;
/* the print: a grain that lives only in the dark, fixed like the grain of paper, and a dither so the last steps before black do not band */
const SHOW = `precision highp float; varying vec2 uv; uniform sampler2D uInk; uniform vec2 uRes;
  float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  void main(){
    vec2 co = uv * uRes; float ink = texture2D(uInk, uv).r;
    float g = h(co) * .6 + h(floor(co * .5) * 2.) * .3 + h(floor(co * .15)) * .1;
    float dark = 1. - ink;
    float v = ink - (g - .5) * .06 * dark * (1. - dark * .6);
    v = pow(clamp(v, 0., 1.), 1.15);
    vec3 col = vec3(.83, .825, .81) * v;
    col += (h(co + 7.) - .5) / 255.;
    gl_FragColor = vec4(col, 1.);
  }`;
const LV = `attribute vec2 p; uniform vec2 uRes; void main(){ gl_Position = vec4(p * 2. - 1., 0., 1.); }`;
const LF = `precision mediump float; uniform float uA; void main(){ gl_FragColor = vec4(0., 0., 0., uA); }`;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; }
function prog(v, f) { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, v)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, f)); gl.linkProgram(p); return p; }
const pF = prog(QV, FLOW), pS = prog(QV, SHOW), pL = prog(LV, LF);
const U = (p, n) => gl.getUniformLocation(p, n);
const qb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const lb = gl.createBuffer();
function quad(p) { gl.useProgram(p); const l = gl.getAttribLocation(p, "p"); gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }
let SOFT = false, W = 0, H = 0, buf = [], bp = 0;
function tex() { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, FT, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, f }; }
function clearPaper() { for (const b of buf) { gl.bindFramebuffer(gl.FRAMEBUFFER, b.f); gl.clearColor(1, 1, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT); } gl.bindFramebuffer(gl.FRAMEBUFFER, null); }
function resize() { const d = Math.min(2, devicePixelRatio || 1); W = Math.round(innerWidth * d); H = Math.round(innerHeight * d); c.width = W; c.height = H;
  for (const b of buf) { gl.deleteTexture(b.t); gl.deleteFramebuffer(b.f); } buf = [tex(), tex()]; clearPaper(); if (typeof setFilter === 'function') setFilter(); }
addEventListener("resize", resize); resize();

/* the room */
const snd = { an: null, buf: null, fb: null, floor: -70, lv: 0, sim: false, cal: 0, calv: [], sn: 0, bands: [0, 0, 0] };
let actx = null;
async function mic() { try { const st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  actx = new (window.AudioContext || window.webkitAudioContext)(); snd.an = actx.createAnalyser(); snd.an.fftSize = 2048; snd.buf = new Float32Array(2048); snd.fb = new Float32Array(1024);
  actx.createMediaStreamSource(st).connect(snd.an); snd.cal = 2.5; snd.calv = []; flash("listening to the quiet…"); document.getElementById("mic").classList.add("on"); }
  catch (e) { flash("no microphone here — 擬似音"); } }
function sndStep(dt) {
  if (snd.an) { snd.an.getFloatTimeDomainData(snd.buf); let q = 0; for (const v of snd.buf) q += v * v; const db = 20 * Math.log10(Math.sqrt(q / snd.buf.length) + 1e-9);
    if (snd.cal > 0) { snd.calv.push(db); snd.cal -= dt; if (snd.cal <= 0) { const s = snd.calv.sort((a, b) => a - b); snd.floor = Math.max(-90, s[Math.floor(s.length * .6)]); } return; }
    const v = Math.max(0, Math.min(1, (db - snd.floor - 8) / 24)); snd.lv += (v - snd.lv) * (v > snd.lv ? .3 : .06);
    snd.an.getFloatFrequencyData(snd.fb); const hz = actx.sampleRate / 2048;
    [[40, 300], [300, 2500], [2500, 12000]].forEach((r, i) => { let e = 0, n = 0; for (let k = r[0] / hz | 0; k < r[1] / hz; k++) { e += Math.pow(10, snd.fb[k] / 20); n++; }
      const x = Math.min(1, e / n * 40); snd.bands[i] += (x - snd.bands[i]) * .1; }); }
  else if (snd.sim) { snd.sn += (Math.random() - .5) * dt * 1.4; snd.sn *= .996; snd.lv += (Math.max(0, Math.min(1, .4 + snd.sn)) - snd.lv) * .1;
    for (let i = 0; i < 3; i++) snd.bands[i] += ((.3 + .5 * Math.sin(T * (.3 + i * .21) + i)) * snd.lv - snd.bands[i]) * .05; }
}
/* the curves: each voice hangs one curve between two anchors, bent by two controls; all four drift on their own slow cycles */
const VOICES = [0, 1, 2, 3, 4].map(i => ({ f: [.071, .053, .097, .043, .061, .083, .037, .049].map(x => x * (1 + i * .17)), ph: Math.random() * 100, band: i % 3 }));
const SEG = 160, pts = new Float32Array((SEG + 1) * 2);
function curve(v, t, rot) {
  const s = (k, a) => Math.sin(t * v.f[k] + v.ph + k) * a, co = (k, a) => Math.cos(t * v.f[k] + v.ph * 1.3 + k) * a;
  const P = [[s(0, .42), co(1, .38)], [co(2, .5), s(3, .46)], [s(4, .45), s(5, .5)], [co(6, .4), co(7, .44)]];   // a1, c1, c2, a2 around the centre
  const cr = Math.cos(rot), sr = Math.sin(rot), asp = W / H;
  for (let k = 0; k <= SEG; k++) { const u = k / SEG, m = 1 - u;
    let x = m*m*m*P[0][0] + 3*m*m*u*P[1][0] + 3*m*u*u*P[2][0] + u*u*u*P[3][0];
    let y = m*m*m*P[0][1] + 3*m*m*u*P[1][1] + 3*m*u*u*P[2][1] + u*u*u*P[3][1];
    const X = x * cr - y * sr, Y = x * sr + y * cr;
    pts[k * 2] = .5 + X / asp * Math.min(1, asp) ; pts[k * 2 + 1] = .5 + Y * Math.min(1, 1 / asp) ; }
  return pts;
}
let T = 0, last = performance.now(), FLOWK = .45, LIFT = .2, vt = 0, rot = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt; sndStep(dt);
  const live = snd.an || snd.sim, lv = live ? snd.lv : .35;
  vt += dt * (.25 + 2.2 * lv); rot += dt * .012;
  const a = buf[bp], b = buf[1 - bp];
  /* flow */
  gl.bindFramebuffer(gl.FRAMEBUFFER, b.f); gl.viewport(0, 0, W, H); gl.disable(gl.BLEND); gl.useProgram(pF);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, a.t); gl.uniform1i(U(pF, "uPrev"), 0);
  gl.uniform2f(U(pF, "uRes"), W, H); gl.uniform1f(U(pF, "uT"), T); gl.uniform1f(U(pF, "uFlow"), FLOWK * (.4 + 2.4 * lv) * Math.min(2, dt * 60));
  gl.uniform1f(U(pF, "uLift"), (.0004 + .004 * LIFT) * Math.min(2, dt * 60));
  gl.uniform4f(U(pF, "uV"), .5 + .25 * Math.sin(T * .031), .5 + .2 * Math.cos(T * .027), .5 + .28 * Math.cos(T * .023 + 2), .5 + .22 * Math.sin(T * .019 + 1));
  quad(pF);
  /* accumulation: faint curves darken the paper; the louder the room, the more pass */
  gl.enable(gl.BLEND); gl.blendFunc(gl.ZERO, gl.ONE_MINUS_SRC_ALPHA); gl.useProgram(pL);
  const lp = gl.getAttribLocation(pL, "p"); gl.bindBuffer(gl.ARRAY_BUFFER, lb); gl.enableVertexAttribArray(lp);
  const reps = Math.round(1 + 6 * lv);
  for (const v of VOICES) {
    const bl = live ? snd.bands[v.band] : .3;
    gl.uniform1f(U(pL, "uA"), .012 + .05 * bl);
    for (let r = 0; r < reps; r++) {
      gl.bufferData(gl.ARRAY_BUFFER, curve(v, vt + r * dt / reps * (.25 + 2.2 * lv), rot), gl.DYNAMIC_DRAW);
      gl.vertexAttribPointer(lp, 2, gl.FLOAT, false, 0, 0); gl.drawArrays(gl.LINE_STRIP, 0, SEG + 1);
    }
  }
  gl.disableVertexAttribArray(lp); gl.disable(gl.BLEND);
  bp = 1 - bp;
  /* print */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(pS);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, b.t); gl.uniform1i(U(pS, "uInk"), 0); gl.uniform2f(U(pS, "uRes"), W, H);
  quad(pS);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function flash(t) { const f = document.getElementById("fl"); f.textContent = t; f.style.opacity = 1; clearTimeout(flash.t); flash.t = setTimeout(() => f.style.opacity = 0, 2000); }
document.getElementById("mic").onclick = mic;
document.getElementById("sim").onclick = e => { snd.sim = !snd.sim; e.target.classList.toggle("on", snd.sim); };
document.getElementById("fw").oninput = e => { FLOWK = e.target.value / 100; };
document.getElementById("lf").oninput = e => { LIFT = e.target.value / 100; };
document.getElementById("clear").onclick = clearPaper;

function setFilter() { const f = SOFT ? gl.LINEAR : gl.NEAREST; for (const b of buf) { gl.bindTexture(gl.TEXTURE_2D, b.t); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f); } }
document.getElementById("soft").onclick = e => { SOFT = !SOFT; e.target.classList.toggle("on", SOFT); setFilter(); };
document.getElementById("fs").onclick = () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
document.getElementById("tg").onclick = () => document.getElementById("ui").classList.toggle("hidden");
addEventListener("keydown", e => { if (e.key === "h") document.getElementById("ui").classList.toggle("hidden"); });
</script></body></html>
