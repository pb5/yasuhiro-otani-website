<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Silver Relief — 落ち方の変奏</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#aaa;font:12px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
#ui{position:fixed;left:14px;bottom:14px;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;transition:opacity .6s}
#ui.hid{opacity:0;pointer-events:none}
select,button{background:rgba(0,0,0,.6);color:#ccc;border:1px solid #444;font:inherit;padding:4px 10px}
#name{position:fixed;left:16px;top:14px;z-index:2;letter-spacing:.25em;color:#999;transition:opacity 1.2s;pointer-events:none}
#name b{font-weight:400;color:#ddd}
#name small{display:block;letter-spacing:.05em;color:#777;margin-top:4px;max-width:34em}
</style></head><body>
<canvas id="c"></canvas>
<div id="name"><b id="vn">—</b><small id="vd"></small></div>
<div id="ui">
  <select id="sel"></select>
  <select id="q"><option value="0.35">軽い</option><option value="0.5" selected>標準</option><option value="0.75">細かい</option><option value="1">最高</option></select>
  <button id="mic">マイクで</button>
  <button id="fs">全画面</button>
  <span style="color:#666">H：表示を消す</span>
</div>
<script>
"use strict";
/* 落ち方の変奏
   空間を「中心からの距離の対数・仰角・方位角」で数える。距離の対数から落下量を引くと、
   拡大しても同じ構造が繰り返されるので、どこまでも底に着かずに沈みつづける。
   （考え方は yonatan @zozuar の #つぶやきGLSL を参照。コードは書き直し） */
const V=[
 {n:"沈降",d:"まっすぐ、一定の速さで沈む。何も起きないまま、終わらない。",speed:.32,spin:0,twist:0,sway:0,step:0,stall:0,breath:0,vert:0,rough:1},
 {n:"渦",d:"深さに比例してねじれる。落ちるほど回転が締まる。",speed:.3,spin:.05,twist:1.6,sway:0,step:0,stall:0,breath:0,vert:0,rough:1},
 {n:"揺らぎ",d:"落ちる軸そのものが傾き、戻る。木の葉の落ち方。",speed:.26,spin:.02,twist:.3,sway:.42,step:0,stall:0,breath:0,vert:0,rough:1},
 {n:"失速と墜落",d:"ほとんど止まり、ある瞬間に一気に落ちる。音の立ち上がりでも落ちる。",speed:.22,spin:0,twist:.2,sway:.05,step:0,stall:1,breath:0,vert:0,rough:1.1},
 {n:"層を抜ける",d:"一枚の床で止まり、抜けて、次の床で止まる。",speed:.3,spin:0,twist:0,sway:0,step:1,stall:0,breath:0,vert:0,rough:.9},
 {n:"呼吸",d:"落ちては戻る。沈む方向と浮く方向が入れ替わる。",speed:.34,spin:.01,twist:.4,sway:.06,step:0,stall:0,breath:1,vert:0,rough:1},
 {n:"眩暈",d:"落ちながら視野が伸び縮みする。距離の感覚だけが狂う。",speed:.2,spin:0,twist:.1,sway:0,step:0,stall:0,breath:0,vert:1,rough:1},
];
const AUTO=V.length;
const sel=document.getElementById('sel');
V.forEach((v,i)=>sel.add(new Option(v.n,i)));sel.add(new Option("自動で巡る",AUTO));sel.value=AUTO;

const VS=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
uniform vec2 r;uniform float uFall,uAz,uTwist,uFov,uTx,uTy,uRough,uLamp,uGain,uT;
out vec4 o;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash(vec2 p){p=fract(p*vec2(443.897,441.423));p+=dot(p,p.yx+19.19);return fract((p.x+p.y)*p.x);}
/* 対数球座標の中の面：仰角を基準に、倍々の細かさの起伏を重ねる */
float field(vec3 p){
  float e=p.y,s=1.;
  for(int k=0;k<9;k++){
    e+=uRough*sin(p.x*s+sin(p.z*s*2.+p.y*s))*cos(p.y*s*1.3+p.z*s+1.1)/s;   /* 方位は整数倍だけ：継ぎ目が出ない */
    s*=2.;
  }
  return e;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;
  vec3 d=normalize(vec3(uv,uFov));
  d.yz*=rot(uTx);d.xz*=rot(uTy);
  vec3 q=vec3(0.,0.,-1.);
  float R=1.,e=1.,acc=0.;
  for(int i=0;i<96;i++){
    q+=d*max(e,.015)*R*.3;
    R=length(q);
    float lr=log(R);
    vec3 p=vec3(lr-uFall,asin(clamp(-q.z/R,-1.,1.))-1.,atan(q.x,q.y)+uAz+uTwist*lr);
    e=field(p);
    float sheet=exp(-abs(e)*22.);                 /* 面のごく近くだけが光る＝薄い銀の膜 */
    float lit=.5+.5*cos(p.z*2.-uLamp);            /* 一灯：方位で明暗 */
    acc+=sheet*(.12+.88*lit*lit*lit)*(1.-float(i)/110.);
  }
  float c=1.-exp(-acc*uGain*.08);
  c=pow(c,1.9);                                    /* 黒を深く */
  c+=(hash(gl_FragCoord.xy+fract(uT*7.)*91.)-.5)*.014;
  o=vec4(vec3(max(c,0.))*vec3(.95,.97,1.),1.);
}`;
const cv=document.getElementById('c'),gl=cv.getContext('webgl2',{antialias:false});
if(!gl)document.body.innerHTML='<p style="padding:20px">このブラウザでは動きません（WebGL2が必要）</p>';
const sh=(k,s)=>{const x=gl.createShader(k);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x;};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={};for(const n of['r','uFall','uAz','uTwist','uFov','uTx','uTy','uRough','uLamp','uGain','uT'])U[n]=gl.getUniformLocation(pr,n);

/* 音：マイクは任意。なければ音なしで動く */
let an=null,buf=null,lvl=0,lvlSlow=0,kick=0;
document.getElementById('mic').onclick=async()=>{
  try{const ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    an=ac.createAnalyser();an.fftSize=2048;buf=new Float32Array(an.fftSize);ac.createMediaStreamSource(st).connect(an);
    document.getElementById('mic').textContent='マイク：入';}
  catch(e){document.getElementById('mic').textContent='マイク不可';}
};
document.getElementById('fs').onclick=()=>{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d);};
let ui=true;addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H'){ui=!ui;document.getElementById('ui').classList.toggle('hid',!ui);document.getElementById('name').style.opacity=ui?1:0;}});

/* 状態：落下量・回転は速さを積分して持つ（速さが変わっても跳ばない） */
let fall=0,az=0,last=0,T=0,cur=Object.assign({},V[0]),idx=0,autoT=0,shown=-1;
const keys=['speed','spin','twist','sway','step','stall','breath','vert','rough'];
const sm=x=>x*x*(3-2*x);
function frame(ms){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(ms-last)/1000||0);last=ms;T+=dt;
  const auto=+sel.value===AUTO;
  if(auto){autoT+=dt;if(autoT>28){autoT=0;idx=(idx+1)%V.length;}}else idx=+sel.value;
  const tg=V[idx];
  for(const k of keys)cur[k]+=(tg[k]-cur[k])*Math.min(1,dt*.6);     /* 変奏どうしはゆっくり溶け合う */
  if(shown!==idx){shown=idx;document.getElementById('vn').textContent=tg.n;document.getElementById('vd').textContent=tg.d;}

  if(an){an.getFloatTimeDomainData(buf);let s=0;for(const x of buf)s+=x*x;const l=Math.max(0,Math.min(1,(20*Math.log10(Math.sqrt(s/buf.length)+1e-9)+60)/50));
    if(l>lvlSlow+.18)kick=1;lvl+=(l-lvl)*.3;lvlSlow+=(l-lvlSlow)*.02;}
  kick*=Math.exp(-dt*2.5);

  let v=cur.speed*(1+.8*lvl);
  /* 失速と墜落：長い停滞のあと、短い急降下 */
  const plunge=Math.pow(Math.max(0,Math.sin(T*.33)),14)*9+kick*6;
  v*=1-cur.stall+cur.stall*(.06+plunge);
  /* 呼吸：方向の反転 */
  v*=1-cur.breath+cur.breath*Math.sin(T*.21)*1.4;
  fall+=v*dt;
  az+=cur.spin*dt*(1+lvl);
  /* 層を抜ける：落下量を床ごとに止める */
  const L=1.1,f=fall/L,ff=Math.floor(f),fr=f-ff;
  const stepped=(ff+sm(Math.max(0,(fr-.72)/.28)))*L;
  const F=fall*(1-cur.step)+stepped*cur.step;
  /* 眩暈：視野の伸縮と、それを打ち消す落下 */
  const vz=Math.sin(T*.27);
  const fov=.7+cur.vert*.45*vz;
  const Fv=F-cur.vert*.35*vz;

  const q=+document.getElementById('q').value,dpr=Math.min(2,devicePixelRatio||1);
  const W=Math.max(2,innerWidth*dpr*q|0),H=Math.max(2,innerHeight*dpr*q|0);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  gl.viewport(0,0,W,H);
  gl.uniform2f(U.r,W,H);gl.uniform1f(U.uFall,Fv);gl.uniform1f(U.uAz,az);gl.uniform1f(U.uTwist,cur.twist);
  gl.uniform1f(U.uFov,fov);
  gl.uniform1f(U.uTx,cur.sway*Math.sin(T*.43));gl.uniform1f(U.uTy,cur.sway*.7*Math.sin(T*.31+1.3));
  gl.uniform1f(U.uRough,cur.rough*(1+.25*lvl));gl.uniform1f(U.uLamp,T*.05);gl.uniform1f(U.uGain,1+.6*lvl+.8*kick);gl.uniform1f(U.uT,T);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
requestAnimationFrame(frame);
</script></body></html>
