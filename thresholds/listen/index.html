<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Thresholds of Presence — this phone listens</title>
<style>
@font-face { font-family:"EB Garamond"; font-weight:400; font-display:swap; src:url(eb-garamond-latin-400-normal.woff2) format("woff2"); }
:root { color-scheme:dark; --ink:#8f897f; --dim:#5d5850; --mono:ui-monospace, Menlo, Consolas, monospace; }
html, body { margin:0; height:100%; background:#000; color:var(--ink); }
body { font-family:var(--mono); -webkit-user-select:none; user-select:none; overflow:hidden; }
#start { position:fixed; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vh; padding:0 8vw; text-align:center; }
#start p { font-family:"EB Garamond", Garamond, serif; color:#cfc6b8; font-size:22px; line-height:1.45; margin:0; }
#start button { font:inherit; font-size:15px; color:#cfc6b8; background:transparent; border:1px solid #5d5850; border-radius:6px; padding:14px 28px; }
#start small { color:var(--dim); font-size:11px; line-height:1.6; }
#log { position:fixed; left:max(16px, env(safe-area-inset-left)); right:max(16px, env(safe-area-inset-right)); top:5vh; bottom:55vh; display:none; flex-direction:column; justify-content:flex-end; overflow:hidden; font-size:12px; line-height:1.7; color:var(--dim); }
#log div { padding-left:6.2em; text-indent:-6.2em; }
#log div:last-child { color:#e6ded0; }
#script { position:fixed; left:0; right:0; top:47vh; bottom:6vh; width:100%; height:47vh; display:none; }
#foot { position:fixed; left:16px; right:16px; bottom:max(14px, env(safe-area-inset-bottom)); display:none; font-size:10px; color:#4a4640; }
</style>
</head>
<body>
<div id="start">
  <p>This phone will listen to the room<br>and write down what it hears.</p>
  <button id="go">Listen</button>
  <small>The microphone is used only on this phone. Nothing is recorded or sent.</small>
</div>
<div id="log"></div>
<canvas id="script"></canvas>
<div id="foot"></div>
<script>
/* Thresholds of Presence — the audience's phone listens for itself: the same analysis as the stage, with its own microphone,
   from where it sits. Each phone writes a different log of the same performance. Nothing is recorded or sent. */
let A = null; const logEl = document.getElementById("log"), foot = document.getElementById("foot");
const NOTES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
const midiOf = f => 69 + 12 * Math.log2(f / 440);
function note(f) { if (!f) return ""; const m = midiOf(f), r = Math.round(m), c = Math.round((m - r) * 100);
  return NOTES[(r % 12 + 12) % 12] + (Math.floor(r / 12) - 1) + " " + (c >= 0 ? "+" : "−") + Math.abs(c) + "¢"; }
const hz = f => !f ? "—" : f >= 1000 ? (f / 1000).toFixed(2) + " kHz" : f.toFixed(1) + " Hz";
const FLO = 50, FHI = 16000, LLO = Math.log(FLO), LHI = Math.log(FHI);
function pitchOf(td, sr) {
  const N = 2048, off = td.length - N, minL = Math.floor(sr / 1500), maxL = Math.floor(sr / 55);
  let e0 = 0; for (let i = 0; i < N; i++) e0 += td[off + i] * td[off + i];
  if (e0 < 1e-6) return 0;
  let best = 0, bestL = 0;
  for (let L = minL; L <= maxL; L += (L < 200 ? 1 : 2)) { let s = 0, e1 = 0;
    for (let i = 0; i < N - L; i += 2) { s += td[off + i] * td[off + i + L]; e1 += td[off + i + L] * td[off + i + L]; }
    const r = s / Math.sqrt(e0 * 0.5 * e1 + 1e-12); if (r > best) { best = r; bestL = L; } }
  return best > 0.86 ? sr / bestL : 0;
}
const TH = { floor: -90, range: 40, nPeaks: 16, silence: -68 };
function analyse() {
  const { an, fd, td, sr } = A; an.getFloatFrequencyData(fd); an.getFloatTimeDomainData(td);
  const bw = sr / an.fftSize, n = fd.length, lo = Math.floor(40 / bw), hi = Math.min(n - 1, Math.floor(FHI / bw));
  let rms = 0; for (let i = 0; i < td.length; i++) rms += td[i] * td[i];
  const level = 10 * Math.log10(rms / td.length + 1e-12);
  let sm = 0, sfm = 0, lg = 0, cnt = 0, flux = 0, max = -200, am = 0;
  for (let i = lo; i <= hi; i++) { const m = Math.pow(10, fd[i] / 20); sm += m; sfm += m * i * bw; am += m * m;
    lg += Math.log(m * m + 1e-20); cnt++; const pm = Math.pow(10, A.prev[i] / 20); if (m > pm) flux += m - pm; if (fd[i] > max) max = fd[i]; }
  A.prev.set(fd);
  const centroid = sm > 0 ? sfm / sm : 0;
  let spread = 0; for (let i = lo; i <= hi; i++) spread += Math.pow(10, fd[i] / 20) * Math.pow(i * bw - centroid, 2);
  spread = sm > 0 ? Math.sqrt(spread / sm) : 0;
  const flatness = Math.min(1, Math.exp(lg / cnt) / (am / cnt + 1e-20));
  const peaks = [];
  for (let i = lo + 1; i < hi; i++) if (fd[i] > fd[i - 1] && fd[i] >= fd[i + 1] && fd[i] > max - TH.range && fd[i] > TH.floor) {
    const a = fd[i - 1], b = fd[i], c = fd[i + 1], d = 0.5 * (a - c) / (a - 2 * b + c || 1); peaks.push({ f: (i + d) * bw, db: b, i }); }
  peaks.sort((x, y) => y.db - x.db);
  const pk = peaks.slice(0, TH.nPeaks);
  /* how much of the sound's energy lies outside the partials it found */
  let ex = 0; const used = new Uint8Array(hi + 3); pk.forEach(p => { for (let j = p.i - 2; j <= p.i + 2; j++) if (j >= lo && j <= hi && !used[j]) { used[j] = 1; const m = Math.pow(10, fd[j] / 20); ex += m * m; } });
  const unexp = am > 0 ? Math.max(0, 1 - ex / am) : 1;
  /* sensory roughness of the strongest partials (Plomp–Levelt, Sethares' fit) */
  let rough = 0; const rp = pk.slice(0, 8);
  for (let i = 0; i < rp.length; i++) for (let j = i + 1; j < rp.length; j++) {
    const f1 = Math.min(rp[i].f, rp[j].f), f2 = Math.max(rp[i].f, rp[j].f), s = 0.24 / (0.021 * f1 + 19), x = s * (f2 - f1);
    rough += Math.pow(10, rp[i].db / 20) * Math.pow(10, rp[j].db / 20) * (Math.exp(-3.5 * x) - Math.exp(-5.75 * x)); }
  /* log-spaced bands for the landscape and the self-similarity */
  const NB = 160, bands = new Float32Array(NB);
  for (let k = 0; k < NB; k++) { const f0 = Math.exp(LLO + (k / NB) * (LHI - LLO)), f1 = Math.exp(LLO + ((k + 1) / NB) * (LHI - LLO));
    let i0 = Math.max(1, Math.floor(f0 / bw)), i1 = Math.max(i0, Math.floor(f1 / bw)), m = -200; for (let i = i0; i <= i1; i++) if (fd[i] > m) m = fd[i];
    bands[k] = Math.max(0, Math.min(1, (m + 100) / 75)); }
  return { level, centroid, spread, flatness, flux: flux / (sm + 1e-9), peaks: pk, strongest: pk[0] && level > -75 ? pk[0].f : 0,
    pitch: level > -60 ? pitchOf(td, sr) : 0, rough, bands, unexp };
}

const stamp = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return String(m).padStart(2, "0") + ":" + s.toFixed(1).padStart(4, "0"); };
function logLine(t, s) { const d = document.createElement("div"); d.textContent = stamp(t) + "   " + s; logEl.appendChild(d); while (logEl.children.length > 16) logEl.firstChild.remove(); }
function events(t, f) {
  const H = A.hist; H.push({ t, level: f.level, centroid: f.centroid, rough: f.rough }); while (H.length && t - H[0].t > 2) H.shift();
  const old = H[0], ev = A.ev, ok = k => !ev[k] || t - ev[k] > 4, mark = k => ev[k] = t;
  if (f.level < TH.silence) { if (!A.silentSince) A.silentSince = t; if (t - A.silentSince > 1.2 && ok("sil")) { logLine(t, `below ${String(TH.silence).replace("-", "−")} dBFS: no signal`); mark("sil"); } return; }
  A.silentSince = 0;
  if (old && f.level - old.level > 6 && ok("lv")) { logLine(t, `level rising: ${old.level.toFixed(1)} → ${f.level.toFixed(1)} dBFS`); mark("lv"); }
  else if (old && old.level - f.level > 6 && ok("lv")) { logLine(t, `level falling: ${old.level.toFixed(1)} → ${f.level.toFixed(1)} dBFS`); mark("lv"); }
  if (old && old.centroid && f.centroid / old.centroid > 1.35 && ok("ct")) { logLine(t, `centroid moving up: ${hz(old.centroid)} → ${hz(f.centroid)}`); mark("ct"); }
  else if (old && f.centroid && old.centroid / f.centroid > 1.35 && ok("ct")) { logLine(t, `centroid moving down: ${hz(old.centroid)} → ${hz(f.centroid)}`); mark("ct"); }
  if (f.strongest && (!A.sp || Math.abs(12 * Math.log2(f.strongest / A.sp)) > 0.8)) {
    if (!A.spCand || Math.abs(12 * Math.log2(f.strongest / A.spCand.f)) > 0.5) A.spCand = { f: f.strongest, t };
    else if (t - A.spCand.t > 0.6 && ok("sp")) { A.sp = f.strongest; logLine(t, `strongest partial: ${hz(f.strongest)} (${note(f.strongest)})`); mark("sp"); } }
  const noisy = f.flatness > 0.3;
  if (A.noisy !== undefined && noisy !== A.noisy && ok("fl")) { logLine(t, noisy ? `noise component increasing (flatness ${f.flatness.toFixed(2)})` : `spectrum becoming tonal (flatness ${f.flatness.toFixed(2)})`); mark("fl"); }
  A.noisy = noisy;
  if (f.pitch && (!A.pi || Math.abs(12 * Math.log2(f.pitch / A.pi)) > 0.8) && ok("pi")) { A.pi = f.pitch; logLine(t, `fundamental: ${hz(f.pitch)} (${note(f.pitch)})`); mark("pi"); }
}


let R3 = null;
const GLSL_MAGMA = `vec3 magma(float t){ t=clamp(t,0.0,1.0);
 const vec3 c0=vec3(-0.002136485053939582,-0.000749655052795221,-0.005386127855323933);
 const vec3 c1=vec3(0.2516605407371642,0.6775232436837668,2.494026599312351);
 const vec3 c2=vec3(8.353717279216625,-3.577719514958484,0.3144679030132573);
 const vec3 c3=vec3(-27.66873308576866,14.26473078096533,-13.64921318813922);
 const vec3 c4=vec3(52.17613981234068,-27.94360607168351,12.94416944238394);
 const vec3 c5=vec3(-50.76852536473588,29.04658282127291,4.23415299384598);
 const vec3 c6=vec3(18.65570506591883,-11.48977351997711,-5.601961508734096);
 return c0+t*(c1+t*(c2+t*(c3+t*(c4+t*(c5+t*c6))))); }`;
const R0 = 0.32;
let t0 = 0, wake = null, lastSum = 0;
/* older Safari (before 14.1): no float time-domain data, and a smaller largest FFT */
function oldSafariAnalyser(an) { try { an.fftSize = 8192; } catch (e) { try { an.fftSize = 2048; } catch (e2) {} }
  if (!an.getFloatTimeDomainData) { const b = new Uint8Array(an.fftSize); an.getFloatTimeDomainData = arr => { an.getByteTimeDomainData(b); for (let i = 0; i < arr.length && i < b.length; i++) arr[i] = (b[i] - 128) / 128; }; }
  return an; }
async function go() {
  document.getElementById("go").disabled = true;
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.resume) await ac.resume();
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const an = ac.createAnalyser(); oldSafariAnalyser(an); an.smoothingTimeConstant = 0.5; ac.createMediaStreamSource(s).connect(an);
    A = { ac, an, sr: ac.sampleRate, fd: new Float32Array(an.frequencyBinCount).fill(-140), td: new Float32Array(an.fftSize), prev: new Float32Array(an.frequencyBinCount).fill(-140), hist: [], ev: {} };
  } catch (e) { document.querySelector("#start p").textContent = "This phone cannot use its microphone here."; return; }
  try { wake = await (navigator.wakeLock ? navigator.wakeLock.request("screen") : null); } catch (e) {}
  document.getElementById("start").style.display = "none"; logEl.style.display = "flex"; foot.style.display = "block"; sc.style.display = "block"; sizeScript();
  t0 = performance.now(); requestAnimationFrame(loop);
}
document.getElementById("go").addEventListener("click", go);
document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && A) { try { wake = await (navigator.wakeLock ? navigator.wakeLock.request("screen") : null); } catch (e) {} if (A.ac.resume) A.ac.resume(); } });
/* the room: the quiet end of what this phone has heard (the 10th percentile of the last 30 s), so it works even if the music is already playing */
/* the unknown script: every two seconds what this phone heard is written as one glyph, stroke by stroke */
const sc = document.getElementById("script"), sx = sc.getContext("2d"), DPR = Math.min(2, devicePixelRatio || 1);
const glyphs = []; let lastG = -99, done = 0, base = 0, prog = 0;
function sizeScript() { sc.width = Math.round(sc.clientWidth * DPR); sc.height = Math.round(sc.clientHeight * DPR); sx.fillStyle = "#000"; sx.fillRect(0, 0, sc.width, sc.height); base = done; prog = 0; }
addEventListener("resize", () => { if (sc.style.display === "block") sizeScript(); });
function writeStep(t, f) {
  if (t - lastG >= 2 && f.level > TH.silence) { lastG = t; glyphs.push(Float32Array.from(f.bands)); }
  if (done >= glyphs.length) return;
  const W = sc.width, Hh = sc.height, cols = Math.max(5, Math.floor(W / (46 * DPR))), cell = W * 0.9 / cols, rows = Math.max(1, Math.floor(Hh * 0.92 / (cell * 1.2))), per = cols * rows;
  if (done - base >= per) { sx.fillStyle = "#000"; sx.fillRect(0, 0, W, Hh); base = done; }
  prog += 0.014 * (1 + (glyphs.length - 1 - done));
  const k = done - base, g = glyphs[done], cx = W * 0.05 + (k % cols + 0.5) * cell, cy = Hh * 0.04 + (Math.floor(k / cols) + 0.5) * cell * 1.2;
  sx.strokeStyle = "#e4dccd"; sx.lineWidth = 1.4 * DPR; sx.lineCap = "round"; sx.lineJoin = "round"; sx.beginPath();
  const N = 48, upto = Math.max(2, Math.floor(N * Math.min(1, prog)));
  for (let i = 0; i <= upto; i++) { const a = i / N * Math.PI * 2, v = g[Math.floor(i / N * (g.length - 1) * 0.8)], r = cell * (0.06 + 0.36 * v * v);
    const px = cx + Math.cos(a - Math.PI / 2) * r * 0.8, py = cy + Math.sin(a - Math.PI / 2) * r; i ? sx.lineTo(px, py) : sx.moveTo(px, py); } sx.stroke();
  if (prog >= 1) { done++; prog = 0; }
}
const room = []; let roomSaid = false;
function roomFloor() { const v = room.map(x => x.l).sort((a, b) => a - b); return v.length ? v[Math.floor(v.length * 0.1)] : -74; }
function loop(now) {
  const t = (now - t0) / 1000, f = analyse();
  room.push({ t, l: f.level }); while (room.length && t - room[0].t > 30) room.shift();
  TH.silence = Math.min(-45, Math.round(roomFloor() + 6));
  if (!roomSaid && t > 8) { roomSaid = true; logLine(t, `this phone: room ${roomFloor().toFixed(1)} dBFS · silence below ${String(TH.silence).replace("-", "−")} dBFS`); }
  if (t > 1) events(t, f);
  writeStep(t, f);
  if (t - lastSum > 30) { lastSum = t; logLine(t, `${f.peaks.length} partials · unexplained ${(f.unexp * 100).toFixed(1)}%`); }
  foot.textContent = `${f.level.toFixed(1).replace("-", "−")} dBFS   ${f.pitch ? hz(f.pitch) + " " + note(f.pitch) : ""}`;
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
