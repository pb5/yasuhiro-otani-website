name: collect text for thresholds
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [claude/yasuhiro-otani-site-build-68m9iy]
    paths: [tools/collect_text.py, .github/workflows/collect-text.yml]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: mkdir -p thresholds/v29 && python tools/collect_text.py
      - run: |
          git config user.name "pb5"
          git config user.email "yasuhiro.otani@gmail.com"
          git add thresholds/v29/pool.json thresholds/v29/probe.json
          git commit -m "Thresholds v29: refresh collected text" || exit 0
          git pull --rebase
          git push
